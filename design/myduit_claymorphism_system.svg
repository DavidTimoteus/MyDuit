<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" style="background:#f0f3f0;font-family:'Manrope',-apple-system,BlinkMacSystemFont,sans-serif;">
  <defs>
    <!-- Filter Level 2: Standard Clay Card -->
    <filter id="clay-lvl-2" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="0" flood-color="rgba(0,0,0,0.08)" />
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="rgba(0,0,0,0.05)" />
    </filter>

    <!-- Filter Level 3: Hero Summary Card -->
    <filter id="clay-lvl-3" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="0" flood-color="rgba(0,0,0,0.12)" />
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="rgba(0,0,0,0.07)" />
    </filter>

    <!-- Filter Level 4: Tactile Button Primary -->
    <filter id="clay-lvl-4-btn" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="0" flood-color="#047857" />
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="rgba(16,185,129,0.28)" />
    </filter>

    <!-- Filter Level 4: Tactile Button Secondary -->
    <filter id="clay-lvl-4-sec" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="3.5" stdDeviation="0" flood-color="rgba(0,0,0,0.12)" />
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="rgba(0,0,0,0.05)" />
    </filter>

    <!-- Linear Gradients -->
    <linearGradient id="grad-mint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="60%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="grad-white-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f7faf8" />
    </linearGradient>
  </defs>

  <!-- Title & Metadata -->
  <g id="Header" transform="translate(60, 50)">
    <rect width="40" height="40" rx="14" fill="url(#grad-mint)" filter="url(#clay-lvl-4-btn)" />
    <path d="M15 15 L25 15 L25 25 L15 25 Z" fill="#ffffff" opacity="0.9" />
    <text x="56" y="25" font-size="22" font-weight="800" fill="#1e293b">MyDuit PWA — 3D Claymorphism Design System</text>
    <text x="56" y="44" font-size="13" font-weight="500" fill="#64748b">Rev. 5 Official Mint Clay Specification (Product UI Styleguide Compliant)</text>
  </g>

  <!-- Color Palette Swatches -->
  <g id="Swatches" transform="translate(60, 130)">
    <text x="0" y="0" font-size="12" font-weight="700" letter-spacing="1" fill="#64748b">DESIGN TOKENS: PALET WARNA</text>
    
    <!-- Mint Primary -->
    <g transform="translate(0, 16)">
      <rect width="140" height="60" rx="16" fill="#10b981" />
      <text x="14" y="28" font-size="12" font-weight="800" fill="#ffffff">Mint Primary</text>
      <text x="14" y="46" font-size="11" font-weight="600" fill="#ffffff" opacity="0.85">#10b981</text>
    </g>

    <!-- Deep Mint -->
    <g transform="translate(155, 16)">
      <rect width="140" height="60" rx="16" fill="#059669" />
      <text x="14" y="28" font-size="12" font-weight="800" fill="#ffffff">Deep Mint</text>
      <text x="14" y="46" font-size="11" font-weight="600" fill="#ffffff" opacity="0.85">#059669</text>
    </g>

    <!-- Soft Mint Glow -->
    <g transform="translate(310, 16)">
      <rect width="140" height="60" rx="16" fill="#34d399" />
      <text x="14" y="28" font-size="12" font-weight="800" fill="#064e3b">Soft Mint</text>
      <text x="14" y="46" font-size="11" font-weight="600" fill="#064e3b" opacity="0.85">#34d399</text>
    </g>

    <!-- Coral Danger -->
    <g transform="translate(465, 16)">
      <rect width="140" height="60" rx="16" fill="#ef4444" />
      <text x="14" y="28" font-size="12" font-weight="800" fill="#ffffff">Coral Red</text>
      <text x="14" y="46" font-size="11" font-weight="600" fill="#ffffff" opacity="0.85">#ef4444</text>
    </g>

    <!-- Azure Blue -->
    <g transform="translate(620, 16)">
      <rect width="140" height="60" rx="16" fill="#3b82f6" />
      <text x="14" y="28" font-size="12" font-weight="800" fill="#ffffff">Azure Blue</text>
      <text x="14" y="46" font-size="11" font-weight="600" fill="#ffffff" opacity="0.85">#3b82f6</text>
    </g>

    <!-- Warm Canvas -->
    <g transform="translate(775, 16)">
      <rect width="140" height="60" rx="16" fill="#f0f3f0" stroke="#cbd5e1" stroke-width="1" />
      <text x="14" y="28" font-size="12" font-weight="800" fill="#334155">Clay Canvas</text>
      <text x="14" y="46" font-size="11" font-weight="600" fill="#64748b">#f0f3f0</text>
    </g>
  </g>

  <!-- Component Kit: 5-Level Claymorphism Elevation -->
  <g id="ElevationLevels" transform="translate(60, 260)">
    <text x="0" y="0" font-size="12" font-weight="700" letter-spacing="1" fill="#64748b">KOMPONEN 5-LEVEL ELEVASI CLAYMORPHISM</text>

    <!-- Level 3: Hero Summary Card -->
    <g transform="translate(0, 20)">
      <rect width="400" height="150" rx="24" fill="url(#grad-white-card)" stroke="rgba(255,255,255,0.95)" stroke-width="1.5" filter="url(#clay-lvl-3)" />
      <text x="24" y="38" font-size="12" font-weight="700" fill="#64748b">TOTAL SALDO (LEVEL 3 HERO CARD)</text>
      <text x="24" y="78" font-size="32" font-weight="900" fill="#1e293b" letter-spacing="-1">Rp1.694.446</text>
      <text x="24" y="112" font-size="13" font-weight="700" fill="#10b981">+Rp230.000 bulan ini</text>
      <text x="24" y="132" font-size="11" font-weight="500" fill="#94a3b8">Tanpa noda ornamen lingkaran semu</text>
    </g>

    <!-- Level 2: Standard Content Card -->
    <g transform="translate(430, 20)">
      <rect width="320" height="150" rx="22" fill="url(#grad-white-card)" stroke="rgba(255,255,255,0.92)" stroke-width="1" filter="url(#clay-lvl-2)" />
      <text x="22" y="38" font-size="15" font-weight="800" fill="#1e293b">Dompet Tunai</text>
      <text x="22" y="58" font-size="11" font-weight="600" fill="#64748b">Cash · Level 2 Standard Card</text>
      <text x="22" y="100" font-size="24" font-weight="800" fill="#1e293b">Rp820.974</text>
      <text x="22" y="126" font-size="11" font-weight="500" fill="#94a3b8">Dual shadow + soft lip shelf 3px</text>
    </g>

    <!-- Level 1: Sub-metric Chips -->
    <g transform="translate(780, 20)">
      <rect width="300" height="42" rx="14" fill="#ffffff" stroke="rgba(255,255,255,0.9)" stroke-width="1" />
      <text x="18" y="26" font-size="12" font-weight="700" fill="#475569">Level 1: Rata Harian Rp16.079</text>

      <rect y="54" width="300" height="42" rx="14" fill="#ffffff" stroke="rgba(255,255,255,0.9)" stroke-width="1" />
      <text x="18" y="80" font-size="12" font-weight="700" fill="#475569">Level 1: Hari Aktif 6 / 30</text>

      <rect y="108" width="300" height="42" rx="14" fill="#ffffff" stroke="rgba(255,255,255,0.9)" stroke-width="1" />
      <text x="18" y="134" font-size="12" font-weight="700" fill="#475569">Level 1: Rasio Tabungan 42% (Cukup)</text>
    </g>
  </g>

  <!-- Interactive Controls: Buttons, Tabs, Segmented Control -->
  <g id="Controls" transform="translate(60, 480)">
    <text x="0" y="0" font-size="12" font-weight="700" letter-spacing="1" fill="#64748b">KONTROL TAKTIL (LEVEL 4 ELEVASI)</text>

    <!-- Primary Button -->
    <g transform="translate(0, 20)">
      <rect width="200" height="48" rx="20" fill="url(#grad-mint)" stroke="rgba(255,255,255,0.4)" stroke-width="1" filter="url(#clay-lvl-4-btn)" />
      <text x="36" y="30" font-size="13" font-weight="800" fill="#ffffff">+ Tambah Transaksi</text>
    </g>

    <!-- Secondary Button -->
    <g transform="translate(220, 20)">
      <rect width="180" height="48" rx="20" fill="url(#grad-white-card)" stroke="rgba(255,255,255,0.9)" stroke-width="1" filter="url(#clay-lvl-4-sec)" />
      <text x="38" y="30" font-size="13" font-weight="700" fill="#334155">Tambah Pengeluaran</text>
    </g>

    <!-- Active Navigation Tab -->
    <g transform="translate(420, 20)">
      <rect width="190" height="48" rx="22" fill="url(#grad-mint)" stroke="rgba(255,255,255,0.4)" stroke-width="1" filter="url(#clay-lvl-4-btn)" />
      <text x="34" y="30" font-size="13" font-weight="800" fill="#ffffff">Statistik (Active Tab)</text>
    </g>

    <!-- Segmented Control -->
    <g transform="translate(630, 20)">
      <rect width="240" height="48" rx="16" fill="#e2e8f0" opacity="0.6" />
      <rect x="4" y="4" width="112" height="40" rx="13" fill="#ffffff" filter="url(#clay-lvl-4-sec)" />
      <text x="38" y="28" font-size="12" font-weight="800" fill="#10b981">Bulanan</text>
      <text x="156" y="28" font-size="12" font-weight="700" fill="#64748b">Tahunan</text>
    </g>

    <!-- Filter Chips -->
    <g transform="translate(890, 20)">
      <rect width="90" height="40" rx="14" fill="url(#grad-mint)" filter="url(#clay-lvl-4-btn)" />
      <text x="24" y="25" font-size="12" font-weight="800" fill="#ffffff">Semua</text>

      <rect x="100" width="80" height="40" rx="14" fill="#ffffff" filter="url(#clay-lvl-4-sec)" />
      <text x="122" y="25" font-size="12" font-weight="700" fill="#64748b">Aktif</text>
    </g>
  </g>

  <!-- Footer Contract Information -->
  <g id="Footer" transform="translate(60, 680)">
    <rect width="1080" height="60" rx="18" fill="#ffffff" stroke="rgba(0,0,0,0.06)" stroke-width="1" filter="url(#clay-lvl-2)" />
    <text x="24" y="35" font-size="12" font-weight="600" fill="#64748b">
      Integrasi FigCraft: Buka file ini di FigCraft untuk manipulasi grafis instan. Mapping komponen aktif terhubung via figcraft.connect.json.
    </text>
  </g>
</svg>
