name: Build Android TWA (.aab & .apk)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check signing secret availability
        id: check_secret
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Android TWA build: ANDROID_KEYSTORE_BASE64 secret not configured yet."
          fi

      - name: Checkout repository
        if: steps.check_secret.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        if: steps.check_secret.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup JDK 17
        if: steps.check_secret.outputs.ready == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        if: steps.check_secret.outputs.ready == 'true'
        uses: android-actions/setup-android@v3

      - name: Restore release keystore
        if: steps.check_secret.outputs.ready == 'true'
        working-directory: mobile/twa
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > android.keystore

      - name: Configure Bubblewrap & build signed AAB/APK
        if: steps.check_secret.outputs.ready == 'true'
        working-directory: mobile/twa
        env:
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          npm install -g @bubblewrap/cli
          mkdir -p ~/.bubblewrap
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$ANDROID_HOME" > ~/.bubblewrap/config.json
          yes | bubblewrap update --manifest ./twa-manifest.json
          BUBBLEWRAP_KEYSTORE_PASSWORD="$KEYSTORE_PASS" BUBBLEWRAP_KEY_PASSWORD="$KEY_PASS" bubblewrap build --skipPwaValidation

      - name: Upload Android artifacts
        if: steps.check_secret.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: myduit-android-twa
          path: |
            mobile/twa/*.aab
            mobile/twa/*.apk

      - name: Attach Android bundles to GitHub Release
        if: steps.check_secret.outputs.ready == 'true' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mobile/twa/*.aab
            mobile/twa/*.apk

