<script>
  let currentPage = 1;
  const limitPerPage = 10;

  document.addEventListener('DOMContentLoaded', () => {
    resetTanggal();
    loadRiwayat(currentPage);
    google.script.run.withSuccessHandler(populateKategori).fetchKategoriServer();
  });

  function resetTanggal() {
    document.getElementById('tanggal').value = new Date().toISOString().split('T')[0];
  }

  function switchTab(targetView) {

    if (targetView === 'tambah' && !document.getElementById('editRowIndex').value) {
         resetFormState();
       }

    document.querySelectorAll('.view-section').forEach(sec => sec.classList.remove('active'));
    
    // Ubah status aktif ikon Navigasi
    const iconRiwayat = document.getElementById('icon-riwayat');
    
    if (targetView === 'riwayat') {
      document.getElementById('viewRiwayat').classList.add('active');
      document.getElementById('pageTitle').innerText = 'Riwayat Kas';
      iconRiwayat.style.fontVariationSettings = "'FILL' 1";
      iconRiwayat.parentElement.classList.replace('text-textSecondary', 'text-primary');
      loadRiwayat(currentPage);
    } else if (targetView === 'tambah') {
      document.getElementById('viewTambah').classList.add('active');
      document.getElementById('pageTitle').innerText = 'Catat Transaksi';
      iconRiwayat.style.fontVariationSettings = "'FILL' 0";
      iconRiwayat.parentElement.classList.replace('text-primary', 'text-textSecondary');
    }
  }

  function populateKategori(list) {
    if (!list) return;
    const datalist = document.getElementById('kategoriList');
    datalist.innerHTML = list.map(item => `<option value="${item}">`).join('');
  }

// 1. Tambahkan Variabel State di bagian atas script
let globalData = [];
let activeFilterJenis = 'Semua';

// 2. Perbarui Fungsi loadRiwayat
function loadRiwayat(page) {
  currentPage = page;
  const container = document.getElementById('riwayatList');
  container.innerHTML = '<div class="text-center text-textSecondary py-10 text-sm animate-pulse">Memuat riwayat kas...</div>';

  google.script.run
    .withSuccessHandler(res => {
      if (res && res.status === 'success') {
        globalData = res.data || [];
        applyFilterAndSearch(); // Terapkan filter & pencarian setelah data dimuat
        renderPaginationUI(res.totalPages, res.currentPage);
      } else {
        container.innerHTML = `<div class="text-center text-expense py-10 text-sm">Gagal memuat: ${res ? res.message : 'Error server'}</div>`;
      }
    })
    .withFailureHandler(err => {
      container.innerHTML = `<div class="text-center text-expense py-10 text-sm">Koneksi terputus/error: ${err.message || err}</div>`;
    })
    .getRiwayatKasServer(page, limitPerPage);
}

// 3. Tambahkan Fungsi Pengelola Pencarian & Filter Chip
function setFilterJenis(jenis, el) {
  activeFilterJenis = jenis;
  document.querySelectorAll('#filterChips .chip-btn').forEach(btn => {
    btn.className = "chip-btn px-5 py-2 rounded-full bg-transparent text-textSecondary text-sm font-medium whitespace-nowrap hover:bg-surface transition-colors";
  });
  el.className = "chip-btn px-5 py-2 rounded-full bg-primary text-white text-sm font-medium whitespace-nowrap";
  applyFilterAndSearch();
}

function handleSearchFilter() {
  applyFilterAndSearch();
}

function applyFilterAndSearch() {
  const query = (document.getElementById('searchInput')?.value || '').toLowerCase().trim();
  
  const filtered = globalData.filter(item => {
    const jenis = String(item.jenis || '').toLowerCase();
    const isIncome = (jenis === 'pemasukan' || jenis === 'pendapatan');
    
    // Filter Berdasarkan Chip Jenis
    let matchesJenis = true;
    if (activeFilterJenis === 'Pemasukan') matchesJenis = isIncome;
    if (activeFilterJenis === 'Pengeluaran') matchesJenis = !isIncome && jenis !== '';

    // Filter Berdasarkan Kata Kunci Pencarian
    const matchesSearch = !query || 
      String(item.kategori || '').toLowerCase().includes(query) ||
      String(item.keterangan || '').toLowerCase().includes(query) ||
      String(item.sumber || '').toLowerCase().includes(query) ||
      String(item.tanggal || '').toLowerCase().includes(query) ||
      String(item.nominal || '').toLowerCase().includes(query);

    return matchesJenis && matchesSearch;
  });

  renderRiwayatUI(filtered);
}

// 4. Perbarui Pengecekan Jenis pada renderRiwayatUI
function renderRiwayatUI(data) {
  const container = document.getElementById('riwayatList');
  if (!data || data.length === 0) {
    container.innerHTML = '<div class="text-center text-textSecondary py-10 text-sm">Data transaksi tidak ditemukan.</div>';
    return;
  }

  container.innerHTML = data.map(item => {
    const jenisLower = String(item.jenis).toLowerCase();
    const isPemasukan = (jenisLower === 'pemasukan' || jenisLower === 'pendapatan');
    
    const sign = isPemasukan ? '+' : '-';
    const textAmountColor = isPemasukan ? 'text-income' : 'text-expense';
    const iconBg = isPemasukan ? 'bg-green-100' : 'bg-red-50';
    const iconColor = isPemasukan ? 'text-green-600' : 'text-red-500';
    const iconSymbol = isPemasukan ? 'trending_up' : 'trending_down';
    
    const formattedNominal = Number(item.nominal || 0).toLocaleString('id-ID');
    const teksKeterangan = item.keterangan || item.kategori || 'Tanpa Keterangan';

    return `
      <div onclick="toggleDeleteBtn(this)" 
       ondblclick="handleCardDoubleTap(${item.rowIndex}, this)" 
       ontouchend="handleMobileTouchTap(event, ${item.rowIndex}, this)"
       data-item='${JSON.stringify(item).replace(/'/g, "&apos;")}'
       class="tx-card-item relative bg-surfaceContainerLowest rounded-8 p-4 shadow-card flex items-center justify-between gap-3 hover:shadow-md transition-all cursor-pointer border border-transparent hover:border-gray-200 select-none">
        
        <div class="flex items-center gap-3 w-full min-w-0">
          <div class="w-10 h-10 rounded-full ${iconBg} flex items-center justify-center shrink-0">
            <span class="material-symbols-outlined ${iconColor} text-[20px]">${iconSymbol}</span>
          </div>
          <div class="flex-1 min-w-0">
            <h3 class="font-semibold text-textPrimary text-[15px] truncate mb-0.5" title="${teksKeterangan}">${teksKeterangan}</h3>
            <div class="flex items-center gap-2 text-xs text-textSecondary">
              <span>${item.tanggal || '-'}</span>
              <span class="w-1 h-1 rounded-full bg-gray-300"></span>
              <span class="truncate">${item.kategori || '-'}</span>
            </div>
          </div>
        </div>

        <div class="text-right shrink-0 flex flex-col items-end">
          <p class="font-bold ${textAmountColor} text-[15px] mb-0.5">${sign}Rp ${formattedNominal}</p>
          <p class="text-[10px] text-textSecondary">${item.sumber || 'Tunai'}</p>
        </div>

        <button onclick="openDeleteModal(${item.rowIndex}, event)" title="Hapus Transaksi" class="delete-btn-action hidden shrink-0 ml-2 w-9 h-9 rounded-full bg-red-50 hover:bg-red-100 text-expense flex items-center justify-center transition-all">
          <span class="material-symbols-outlined text-[20px]">delete</span>
        </button>

      </div>
    `;
  }).join('');
}

  function renderPaginationUI(totalPages, current) {
    const controls = document.getElementById('paginationControls');
    if (!totalPages || totalPages <= 1) {
      controls.innerHTML = '';
      return;
    }

    let html = '';
    for (let i = 1; i <= totalPages; i++) {
      html += `<button class="w-8 h-8 rounded text-sm font-medium transition-colors ${i === current ? 'bg-primary text-white' : 'bg-surfaceContainerLowest text-textSecondary hover:bg-gray-100'} border border-gray-200" onclick="loadRiwayat(${i})">${i}</button>`;
    }
    controls.innerHTML = html;
  }

  function handleFormSubmit(e) {
  e.preventDefault();

  const editRowIndex = document.getElementById('editRowIndex').value;
  const isEditMode = Boolean(editRowIndex);
  const serverFunc = isEditMode ? 'updateTransaksiServer' : 'simpanTransaksiServer';

  const formData = {
    tanggal: document.getElementById('tanggal').value,
    jenis: document.getElementById('jenis').value,
    kategori: document.getElementById('kategori').value,
    sumber: document.getElementById('sumber').value,
    keterangan: document.getElementById('keterangan').value,
    nominal: document.getElementById('nominal').value
  };

  if (isEditMode) {
    formData.rowIndex = Number(editRowIndex);
  }

  // Reset form dan navigasi
  resetFormState();
  switchTab('riwayat');
  showToast('success', isEditMode ? 'Perubahan disimpan!' : 'Transaksi berhasil dicatat!');

  // Eksekusi ke Server
  google.script.run
    .withSuccessHandler(res => {
      if (res && res.status === 'success') {
        loadRiwayat(currentPage);
        google.script.run.withSuccessHandler(populateKategori).fetchKategoriServer();
      } else {
        showToast('error', 'Gagal memproses: ' + (res ? res.message : 'Error server'));
      }
    })
    .withFailureHandler(err => {
      showToast('error', 'Koneksi error: ' + (err.message || err));
    })[serverFunc](formData);
}

  let toastTimeout;
  function showToast(type, text) {
    const toast = document.getElementById('toast');
    toast.className = `toast show ${type}`;
    toast.innerText = text;
    
    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => { toast.classList.remove('show'); }, 3000);
  }

  // Variabel penyimpan baris yang akan dihapus
let targetRowToDelete = null;

/**
 * Memunculkan/menyembunyikan ikon sampah di pojok kanan saat kartu ditekan
 */
function toggleDeleteBtn(cardEl) {
  const isAlreadyActive = cardEl.classList.contains('border-red-300');
  
  // Sembunyikan semua tombol hapus lain terlebih dahulu
  document.querySelectorAll('.tx-card-item').forEach(el => {
    el.classList.remove('border-red-300', 'bg-red-50/20');
    const btn = el.querySelector('.delete-btn-action');
    if (btn) btn.classList.add('hidden');
  });

  // Jika belum aktif, aktifkan pada kartu ini
  if (!isAlreadyActive) {
    cardEl.classList.add('border-red-300', 'bg-red-50/20');
    const deleteBtn = cardEl.querySelector('.delete-btn-action');
    if (deleteBtn) deleteBtn.classList.remove('hidden');
  }
}

/**
 * Buka Modal Konfirmasi Hapus
 */
function openDeleteModal(rowIndex, event) {
  if (event) event.stopPropagation(); // Mencegah event click kartu terulang
  targetRowToDelete = rowIndex;
  document.getElementById('deleteModal').classList.remove('hidden');
}

/**
 * Tutup Modal Konfirmasi Hapus
 */
function closeDeleteModal() {
  targetRowToDelete = null;
  document.getElementById('deleteModal').classList.add('hidden');
}

/**
 * Eksekusi Hapus Transaksi (Optimistic UI)
 */
function confirmDelete() {
  if (!targetRowToDelete) return;

  const btnConfirm = document.getElementById('btnConfirmDelete');
  btnConfirm.innerText = 'Deleting...';
  btnConfirm.disabled = true;

  const rowToDelete = targetRowToDelete;
  closeDeleteModal();
  showToast('success', 'Menghapus transaksi...');

  // Eksekusi ke Server
  google.script.run
    .withSuccessHandler(res => {
      btnConfirm.innerText = 'Ya, Hapus';
      btnConfirm.disabled = false;

      if (res && res.status === 'success') {
        showToast('success', 'Transaksi berhasil dihapus!');
        loadRiwayat(currentPage); // Refresh list
      } else {
        showToast('error', 'Gagal menghapus: ' + (res ? res.message : 'Error server'));
      }
    })
    .withFailureHandler(err => {
      btnConfirm.innerText = 'Ya, Hapus';
      btnConfirm.disabled = false;
      showToast('error', 'Koneksi terputus: ' + (err.message || err));
    })
    .hapusTransaksiServer(rowToDelete);
}

// Variable penanganan double tap di layar sentuh mobile
let lastTapTime = 0;

function handleMobileTouchTap(event, rowIndex, cardEl) {
  const currentTime = new Date().getTime();
  const tapLength = currentTime - lastTapTime;
  
  if (tapLength < 300 && tapLength > 0) {
    event.preventDefault();
    openEditMode(cardEl);
  }
  lastTapTime = currentTime;
}

function handleCardDoubleTap(rowIndex, cardEl) {
  openEditMode(cardEl);
}

/**
 * Membuka mode Edit dan mengisi form secara otomatis
 */
function openEditMode(cardEl) {
  const rawData = cardEl.getAttribute('data-item');
  if (!rawData) return;

  const item = JSON.parse(rawData.replace(/&apos;/g, "'"));

  // Convert tanggal 'dd:MM:yyyy' ke 'yyyy-MM-dd' untuk input HTML date
  let formattedDate = '';
  if (item.tanggal) {
    const parts = item.tanggal.split(':');
    if (parts.length === 3) {
      formattedDate = `${parts[2]}-${parts[1]}-${parts[0]}`;
    }
  }

  // Isi data ke Form
  document.getElementById('editRowIndex').value = item.rowIndex;
  document.getElementById('tanggal').value = formattedDate || new Date().toISOString().split('T')[0];
  document.getElementById('jenis').value = (item.jenis && item.jenis.toLowerCase() === 'pendapatan') ? 'Pemasukan' : item.jenis;
  document.getElementById('kategori').value = item.kategori || '';
  document.getElementById('sumber').value = item.sumber || '';
  document.getElementById('keterangan').value = item.keterangan || '';
  document.getElementById('nominal').value = item.nominal || 0;

  // Ubah UI Form ke Mode Edit
  document.getElementById('btnSubmit').innerText = 'Perbarui Transaksi';
  document.getElementById('pageTitle').innerText = 'Edit Transaksi';

  switchTab('tambah');
  showToast('success', 'Mode Edit: Silakan perbarui data');
}

/**
 * Reset form ke state default "Tambah Transaksi"
 */
function resetFormState() {
  document.getElementById('transaksiForm').reset();
  document.getElementById('editRowIndex').value = '';
  document.getElementById('btnSubmit').innerText = 'Simpan Transaksi';
  document.getElementById('pageTitle').innerText = 'Catat Transaksi';
  resetTanggal();
}
</script>
