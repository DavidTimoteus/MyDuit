<script>
  let currentPage = 1;
  const limitPerPage = 10;
  let activeFilterJenis = 'Semua';
  let lastTapTime = 0;

  let cachedKategori = [];

  // State filter tanggal aktif (menggantikan select filterTipe/filterBulan/filterTahun lama)
  let filterTipe = 'semua';       // 'semua' | '7hari' | '30hari' | 'custom'
  let filterStartDate = '';       // yyyy-MM-dd, hanya dipakai saat filterTipe === 'custom'
  let filterEndDate = '';         // yyyy-MM-dd, hanya dipakai saat filterTipe === 'custom'

  const BULAN_ID = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  function formatTanggalIndo(date) {
    const dd = String(date.getDate()).padStart(2, '0');
    return `${dd} ${BULAN_ID[date.getMonth()]} ${date.getFullYear()}`;
  }
  function toISODate(date) {
    const yyyy = date.getFullYear();
    const mm = String(date.getMonth() + 1).padStart(2, '0');
    const dd = String(date.getDate()).padStart(2, '0');
    return `${yyyy}-${mm}-${dd}`;
  }

  function populateKategori(list) {
    cachedKategori = list || [];
    const dl = document.getElementById('kategoriList');
    if (dl) dl.innerHTML = cachedKategori.map(k => `<option value="${k}"></option>`).join('');
  }

  document.addEventListener('DOMContentLoaded', () => {
    resetTanggal();
    updateFilterActiveLabel();

    // OPTIMASI CRITICAL PATH: pakai data yg sudah di-inline server (doGet) via
    // window.__INITIAL_RIWAYAT__ / __INITIAL_KATEGORI__, hindari chained google.script.run.
    if (window.__INITIAL_RIWAYAT__) {
      renderRiwayatResult(window.__INITIAL_RIWAYAT__);
    } else {
      loadRiwayat(1); // fallback jika inline data tidak tersedia
    }

    if (window.__INITIAL_KATEGORI__) {
      populateKategori(window.__INITIAL_KATEGORI__);
    } else {
      google.script.run.withSuccessHandler(populateKategori).fetchKategoriServer();
    }
  });


  // Fungsi baru: reset filter & search ke default awal, lalu tampilkan riwayat
  function goHome() {
    switchTab('riwayat');

    activeFilterJenis = 'Semua';
    document.querySelectorAll('#filterChips .chip-btn').forEach((btn, i) => {
      btn.className = i === 0
        ? "chip-btn active shrink-0 px-3 sm:px-5 py-1.5 sm:py-2 rounded-full bg-primary text-white text-xs sm:text-sm font-medium whitespace-nowrap"
        : "chip-btn shrink-0 px-3 sm:px-5 py-1.5 sm:py-2 rounded-full bg-transparent text-textSecondary text-xs sm:text-sm font-medium whitespace-nowrap hover:bg-surface transition-colors";
    });

    const searchInput = document.getElementById('searchInput');
    if (searchInput) searchInput.value = '';

    filterTipe = 'semua';
    filterStartDate = '';
    filterEndDate = '';
    updateFilterActiveLabel();
    loadRiwayat(1);
  }

  function handleSearchFilter() { loadRiwayat(1); }

  // ==========================================
  // FITUR: MODAL FILTER TRANSAKSI (Pop-up)
  // ==========================================
  function updateFilterSubtitles() {
    const today = new Date();
    const d7 = new Date(today); d7.setDate(d7.getDate() - 7);
    const d30 = new Date(today); d30.setDate(d30.getDate() - 30);
    const el7 = document.getElementById('subtitle7hari');
    const el30 = document.getElementById('subtitle30hari');
    if (el7) el7.textContent = `${formatTanggalIndo(d7)} - ${formatTanggalIndo(today)}`;
    if (el30) el30.textContent = `${formatTanggalIndo(d30)} - ${formatTanggalIndo(today)}`;
  }

  function updateFilterActiveLabel() {
    const label = document.getElementById('filterActiveLabel');
    if (!label) return;
    const map = { semua: 'Semua Transaksi', '7hari': '7 Hari Terakhir', '30hari': '30 Hari Terakhir' };
    if (filterTipe === 'custom' && filterStartDate && filterEndDate) {
      const [ys, ms, ds] = filterStartDate.split('-');
      const [ye, me, de] = filterEndDate.split('-');
      label.textContent = `${ds}/${ms} - ${de}/${me}`;
    } else {
      label.textContent = map[filterTipe] || 'Filter';
    }
  }

  function openFilterModal() {
    updateFilterSubtitles();
    // Pre-fill state saat ini ke modal
    document.querySelectorAll('input[name="filterTipeModal"]').forEach(r => { r.checked = (r.value === filterTipe); });
    const startEl = document.getElementById('filterStartDate');
    const endEl = document.getElementById('filterEndDate');
    if (startEl) startEl.value = filterStartDate || '';
    if (endEl) endEl.value = filterEndDate || '';
    toggleCustomDateInputs();

    const modal = document.getElementById('filterModal');
    if (modal) modal.classList.remove('hidden');
  }

  function closeFilterModal() {
    const modal = document.getElementById('filterModal');
    if (modal) modal.classList.add('hidden');
  }

  function toggleCustomDateInputs() {
    const selected = document.querySelector('input[name="filterTipeModal"]:checked')?.value;
    const wrap = document.getElementById('customDateWrap');
    if (wrap) wrap.classList.toggle('hidden', selected !== 'custom');
  }

  function terapkanFilter() {
    const selected = document.querySelector('input[name="filterTipeModal"]:checked')?.value || 'semua';

    if (selected === 'custom') {
      const startVal = document.getElementById('filterStartDate')?.value || '';
      const endVal = document.getElementById('filterEndDate')?.value || '';
      if (!startVal || !endVal) { showToast('error', 'Pilih tanggal Dari dan Hingga.'); return; }
      if (startVal > endVal) { showToast('error', 'Tanggal "Dari" tidak boleh setelah "Hingga".'); return; }
      filterStartDate = startVal;
      filterEndDate = endVal;
    } else {
      filterStartDate = '';
      filterEndDate = '';
    }

    filterTipe = selected;
    updateFilterActiveLabel();
    closeFilterModal();
    loadRiwayat(1);
  }

  // ==========================================
  // FITUR: EXPORT LAPORAN PDF PER BULAN
  // ==========================================
  function openExportModal() {
    const now = new Date();
    const selBulan = document.getElementById('exportBulan');
    const selTahun = document.getElementById('exportTahun');

    if (selBulan) selBulan.value = now.getMonth();
    if (selTahun) {
      selTahun.innerHTML = '';
      for (let i = 0; i <= 3; i++) {
        const y = now.getFullYear() - i;
        const opt = document.createElement('option');
        opt.value = y;
        opt.textContent = y;
        selTahun.appendChild(opt);
      }
    }

    const info = document.getElementById('exportInfoText');
    if (info) info.textContent = '';

    const modal = document.getElementById('exportModal');
    if (modal) modal.classList.remove('hidden');
  }

  function closeExportModal() {
    const modal = document.getElementById('exportModal');
    if (modal) modal.classList.add('hidden');
  }

  function prosesExportPDF() {
    const bulan = parseInt(document.getElementById('exportBulan')?.value);
    const tahun = parseInt(document.getElementById('exportTahun')?.value);
    const btn = document.getElementById('btnProsesExport');
    const info = document.getElementById('exportInfoText');

    if (btn) btn.disabled = true;
    if (info) info.textContent = 'Sedang membuat laporan PDF, mohon tunggu...';

    google.script.run
      .withSuccessHandler(res => {
        if (btn) btn.disabled = false;
        if (res && res.status === 'success') {
          downloadBase64File(res.base64, res.fileName, 'application/pdf');
          if (info) info.textContent = '';
          closeExportModal();
          showToast('success', 'Laporan PDF berhasil dibuat!');
        } else {
          if (info) info.textContent = '';
          showToast('error', 'Gagal membuat PDF: ' + (res ? res.message : 'Error server'));
        }
      })
      .withFailureHandler(err => {
        if (btn) btn.disabled = false;
        if (info) info.textContent = '';
        showToast('error', 'Koneksi error: ' + (err.message || err));
      })
      .generateLaporanPDFServer(bulan, tahun);
  }

  // Konversi hasil base64 dari server menjadi file yg otomatis terdownload di browser
  function downloadBase64File(base64, fileName, mimeType) {
    const byteChars = atob(base64);
    const byteNumbers = new Array(byteChars.length);
    for (let i = 0; i < byteChars.length; i++) byteNumbers[i] = byteChars.charCodeAt(i);
    const byteArray = new Uint8Array(byteNumbers);
    const blob = new Blob([byteArray], { type: mimeType });
    const url = URL.createObjectURL(blob);

    const a = document.createElement('a');
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function setFilterJenis(jenis, el) {
    activeFilterJenis = jenis;
    document.querySelectorAll('#filterChips .chip-btn').forEach(btn => {
      btn.className = "chip-btn shrink-0 px-3 sm:px-5 py-1.5 sm:py-2 rounded-full bg-transparent text-textSecondary text-xs sm:text-sm font-medium whitespace-nowrap hover:bg-surface transition-colors";
    });
    if (el) el.className = "chip-btn active shrink-0 px-3 sm:px-5 py-1.5 sm:py-2 rounded-full bg-primary text-white text-xs sm:text-sm font-medium whitespace-nowrap";
    loadRiwayat(1);
  }

  // Membundel seluruh parameter filter yg aktif saat ini untuk dikirim ke Backend.
  // Dipakai bareng oleh loadRiwayat() DAN handleFormSubmit()/confirmDelete(),
  // supaya hasil refresh setelah CRUD konsisten dengan filter yg sedang aktif.
  function getCurrentFilterParams() {
    return {
      tipe: filterTipe,               // 'semua' | '7hari' | '30hari' | 'custom'
      startDate: filterStartDate,     // yyyy-MM-dd, dipakai backend saat tipe === 'custom'
      endDate: filterEndDate,         // yyyy-MM-dd, dipakai backend saat tipe === 'custom'
      jenis: activeFilterJenis,
      search: (document.getElementById('searchInput')?.value || '').toLowerCase().trim()
    };
  }

  // Menampilkan hasil { status, data, totalPages, currentPage } dari server ke UI.
  function renderRiwayatResult(res) {
    const container = document.getElementById('riwayatList');
    if (res && res.status === 'success') {
      currentPage = res.currentPage;
      renderRiwayatUI(res.data);
      renderPaginationUI(res.totalPages, res.currentPage);
    } else {
      if (container) container.innerHTML = `<div class="text-center text-red-500 py-10 text-sm">Gagal memuat: ${res ? res.message : 'Error'}</div>`;
    }
  }

  function loadRiwayat(page) {
    currentPage = page;
    const container = document.getElementById('riwayatList');
    if (container) container.innerHTML = '<div class="text-center text-slate-500 py-10 text-sm animate-pulse">Memuat riwayat kas...</div>';

    google.script.run
      .withSuccessHandler(renderRiwayatResult)
      .withFailureHandler(err => {
        if (container) container.innerHTML = `<div class="text-center text-red-500 py-10 text-sm">Koneksi error: ${err.message || err}</div>`;
      })
      .getRiwayatKasServer(page, limitPerPage, getCurrentFilterParams());
  }

  // ==========================================
  // FITUR: RENDER UI & TANGGAL RELATIF
  // ==========================================
  function formatTanggalRelatif(dateStr) {
    if (!dateStr) return "-";
    const parts = dateStr.split('/');
    if (parts.length === 3) {
      const d = new Date(`${parts[2]}-${parts[1]}-${parts[0]}T00:00:00`);
      const today = new Date();
      today.setHours(0,0,0,0);
      const diffDays = Math.ceil((today - d) / (1000 * 60 * 60 * 24));
      if (diffDays === 0) return "Hari ini";
      if (diffDays === 1) return "Kemarin";
    }
    return dateStr;
  }

  function renderRiwayatUI(data) {
    const container = document.getElementById('riwayatList');
    if (!container) return;
    if (!data || data.length === 0) {
      container.innerHTML = '<div class="text-center text-slate-500 py-10 text-sm">Data transaksi tidak ditemukan.</div>';
      return;
    }

    container.innerHTML = data.map(item => {
      const isPemasukan = (String(item.jenis).toLowerCase() === 'pemasukan' || String(item.jenis).toLowerCase() === 'pendapatan');
      const sign = isPemasukan ? '+' : '-';
      const textAmountColor = isPemasukan ? 'text-emerald-600' : 'text-red-500';
      const iconBg = isPemasukan ? 'bg-emerald-100' : 'bg-red-50';
      const iconColor = isPemasukan ? 'text-emerald-600' : 'text-red-500';
      const iconSymbol = isPemasukan ? 'trending_up' : 'trending_down';
      
      const formattedNominal = Number(item.nominal || 0).toLocaleString('id-ID');
      const teksKet = item.keterangan || item.kategori || 'Tanpa Keterangan';
      const relativeDate = formatTanggalRelatif(item.tanggal);

      return `
        <div onclick="toggleDeleteBtn(this)" 
         ondblclick="handleCardDoubleTap(${item.rowIndex}, this)" 
         ontouchend="handleMobileTouchTap(event, ${item.rowIndex}, this)"
         data-item='${JSON.stringify(item).replace(/'/g, "&apos;")}'
         class="tx-card-item relative bg-white rounded-xl p-4 shadow-sm flex items-center justify-between gap-3 hover:shadow-md transition-all cursor-pointer border border-transparent hover:border-emerald-300 select-none">
          
          <div class="flex items-center gap-3 w-full min-w-0">
            <div class="w-10 h-10 rounded-full ${iconBg} flex items-center justify-center shrink-0">
              <span class="material-symbols-outlined ${iconColor} text-[20px]">${iconSymbol}</span>
            </div>
            <div class="flex-1 min-w-0">
              <h3 class="font-semibold text-slate-800 text-[15px] truncate mb-0.5" title="${teksKet}">${teksKet}</h3>
              <div class="flex items-center gap-2 text-xs text-slate-500">
                <span class="font-medium">${relativeDate}</span>
                <span class="w-1 h-1 rounded-full bg-slate-300"></span>
                <span class="truncate">${item.kategori || '-'}</span>
              </div>
            </div>
          </div>
          <div class="text-right shrink-0 flex flex-col items-end">
            <p class="font-bold ${textAmountColor} text-[15px] mb-0.5">${sign}Rp ${formattedNominal}</p>
            <p class="text-[10px] text-slate-400">${item.sumber || 'Tunai'}</p>
          </div>
          <button onclick="openDeleteModal(${item.rowIndex}, event)" class="delete-btn-action hidden shrink-0 ml-2 w-9 h-9 rounded-full bg-red-50 hover:bg-red-100 text-red-500 flex items-center justify-center transition-all">
            <span class="material-symbols-outlined text-[20px]">delete</span>
          </button>
        </div>
      `;
    }).join('');
  }

  function renderPaginationUI(totalPages, current) {
    const controls = document.getElementById('paginationControls');
    if (!controls) return;
    if (!totalPages || totalPages <= 1) { controls.innerHTML = ''; return; }
    
    let html = '';
    for (let i = 1; i <= totalPages; i++) {
      html += `<button class="w-8 h-8 mx-1 rounded text-sm font-medium transition-colors border ${i === current ? 'bg-emerald-600 text-white border-emerald-600 shadow-sm' : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'}" onclick="loadRiwayat(${i})">${i}</button>`;
    }
    controls.innerHTML = html;
  }

  // ==========================================
  // FITUR: FORM, EDIT DOUBLE-TAP, & NAVIGASI
  // ==========================================

  function switchTab(tabName) {
    const views = {
      riwayat: 'viewRiwayat',
      tambah:  'viewTambah',
      budget:  'viewBudget'
    };

    // 1) Sembunyikan SEMUA view-section
    Object.values(views).forEach(id => {
      const el = document.getElementById(id);
      if (!el) return;
      el.classList.remove('active');
      el.classList.add('hidden');
    });

    // 2) Kelola visibilitas <header id="pageHeader">
    //    (berisi greeting "David Timoteus", notifikasi, & judul "Riwayat Kas")
    //    → Sembunyikan HANYA saat tab Budget aktif, tampilkan pada tab lain.
    const pageHeader = document.getElementById('pageHeader');
    if (pageHeader) {
      if (tabName === 'budget') {
        pageHeader.classList.add('hidden');
      } else {
        pageHeader.classList.remove('hidden');
      }
    }

    // 3) Aktifkan view yang dipilih
    const activeEl = document.getElementById(views[tabName]);
    if (activeEl) {
      activeEl.classList.remove('hidden');
      activeEl.classList.add('active');
      // Pastikan display tidak terkunci oleh style inline lama
      activeEl.style.display = '';
    }

    // 4) Reset state form (kecuali sedang edit di tab Tambah)
    if (tabName === 'tambah') {
      if (!document.getElementById('editRowIndex')?.value) {
        if (typeof resetFormState === 'function') resetFormState();
      }
    } else {
      if (typeof resetFormState === 'function') resetFormState();
    }

    // 5) Muat data dompet/budget saat tab Budget dibuka
    if (tabName === 'budget' && typeof loadDompetServer === 'function') {
      loadDompetServer();
    }

    // 6) Perbarui state aktif tombol bottom-navigation
    updateNavActiveState(tabName);
  }

  function updateNavActiveState(tabName) {
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.classList.remove('text-primary');
      btn.classList.add('text-textSecondary');
      const icon = btn.querySelector('.material-symbols-outlined');
      if (icon) icon.style.fontVariationSettings = "'FILL' 0";
    });

    const activeBtn = document.querySelector(`.nav-btn[data-tab="${tabName}"]`);
    if (activeBtn) {
      activeBtn.classList.remove('text-textSecondary');
      activeBtn.classList.add('text-primary');
      const icon = activeBtn.querySelector('.material-symbols-outlined');
      if (icon) icon.style.fontVariationSettings = "'FILL' 1";
    }
  }

  function loadDompetServer() {
    const container   = document.getElementById('rekeningList');
    const totalEl     = document.getElementById('totalSaldoBudget');
    const lastUpdEl   = document.getElementById('lastUpdatedBudget');   // ⬅ tambah

    if (container) container.innerHTML =
      `<div class="text-center text-textSecondary py-10 text-sm animate-pulse">Memuat rekening...</div>`;
    if (lastUpdEl) lastUpdEl.textContent = 'Memuat...';                  // ⬅ tambah

    google.script.run
      .withSuccessHandler(res => {
        if (!res || res.status !== 'success') {
          if (container) container.innerHTML =
            `<div class="text-center text-red-500 py-6 text-sm">${res ? res.message : 'Gagal memuat data.'}</div>`;
          if (lastUpdEl) lastUpdEl.textContent = 'Terakhir diperbarui: -';
          return;
        }

        // Total saldo
        if (totalEl) totalEl.textContent = formatRupiah(res.totalSaldo);

        // ⬇ Render Last Updated dinamis
        if (lastUpdEl) lastUpdEl.textContent = formatLastUpdated(res.lastUpdated);

        // Daftar rekening
        if (container) {
          container.innerHTML = res.rekening.length
            ? res.rekening.map(renderRekeningCard).join('')
            : `<div class="text-center text-textSecondary py-10 text-sm">Belum ada rekening.</div>`;
        }
      })
      .withFailureHandler(err => {
        if (container) container.innerHTML =
          `<div class="text-center text-red-500 py-6 text-sm">Koneksi error: ${err.message || err}</div>`;
        if (lastUpdEl) lastUpdEl.textContent = 'Terakhir diperbarui: -';
      })
      .getDompetServer();
  }

  function formatLastUpdated(isoString) {
    if (!isoString) return 'Terakhir diperbarui: -';
    const d = new Date(isoString);
    if (isNaN(d.getTime())) return 'Terakhir diperbarui: -';
    const tgl = d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
    const jam = d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
    return `Terakhir diperbarui: ${tgl}, ${jam}`;
  }

  function renderRekeningCard(r) {
    return `<div class="bg-white rounded-xl border border-slate-200 shadow-sm p-4 mb-3">
      <div class="flex items-center justify-between mb-2">
        <div class="flex items-center gap-2">
          <span class="material-symbols-outlined text-primary text-[20px]">account_balance</span>
          <span class="font-semibold text-sm text-slate-800">${r.nama}</span>
          <span class="text-[10px] px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700 font-medium">${r.kategori}</span>
        </div>
        <button class="text-slate-400 hover:text-slate-600"><span class="material-symbols-outlined text-[18px]">more_vert</span></button>
      </div>
      <div class="mb-2">
        <p class="text-xs text-slate-400">Saldo Saat Ini</p>
        <p class="text-lg font-bold text-slate-800">${formatRupiah(r.saldo)}</p>
      </div>
      <div class="border-t border-slate-100 pt-2 flex justify-between text-[11px] text-slate-400">
        <span>Perubahan Terakhir</span><span>${r.terakhirDiperbarui}</span>
      </div>
    </div>`;
  }

  function formatRupiah(n) {
    return 'Rp ' + Number(n || 0).toLocaleString('id-ID');
  }
  function resetFormState() {
    const form = document.getElementById('transaksiForm');
    if (form) form.reset();
    const editInput = document.getElementById('editRowIndex');
    if (editInput) editInput.value = '';
    const btnSubmit = document.getElementById('btnSubmit');
    if (btnSubmit) btnSubmit.innerText = 'Simpan Transaksi';
    const pageTitle = document.getElementById('pageTitle');
    if (pageTitle) pageTitle.innerText = 'Catat Transaksi';
    resetTanggal();
  }

  function resetTanggal() {
    const inputTanggal = document.getElementById('tanggal') || document.getElementById('inputTanggal');
    if (inputTanggal) {
      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      inputTanggal.value = `${yyyy}-${mm}-${dd}`;
    }
  }

  function handleCardDoubleTap(rowIndex, cardEl) {
    try {
      const item = JSON.parse(cardEl.getAttribute('data-item'));
      openEditMode(item);
    } catch (err) { console.error("Error Mode Edit:", err); }
  }

  function handleMobileTouchTap(event, rowIndex, cardEl) {
    const currentTime = new Date().getTime();
    if (currentTime - lastTapTime < 300 && currentTime - lastTapTime > 0) {
      event.preventDefault();
      handleCardDoubleTap(rowIndex, cardEl);
    }
    lastTapTime = currentTime;
  }

  function openEditMode(item) {
    if (!item) return;
    const editRowEl = document.getElementById('editRowIndex');
    if (editRowEl) editRowEl.value = item.rowIndex;

    const tglEl = document.getElementById('tanggal') || document.getElementById('inputTanggal');
    if (tglEl) {
      if (item.tanggalRaw) {
        tglEl.value = item.tanggalRaw;
      } else {
        const p = item.tanggal.split('/');
        tglEl.value = p.length === 3 ? `${p[2]}-${p[1]}-${p[0]}` : getLocalToday();
      }
    }

    if (document.getElementById('jenis')) document.getElementById('jenis').value = item.jenis;
    if (document.getElementById('kategori')) document.getElementById('kategori').value = item.kategori;
    if (document.getElementById('sumber')) document.getElementById('sumber').value = item.sumber || '';
    if (document.getElementById('keterangan')) document.getElementById('keterangan').value = item.keterangan || '';
    if (document.getElementById('nominal')) document.getElementById('nominal').value = item.nominal;
    
    if (document.getElementById('btnSubmit')) document.getElementById('btnSubmit').innerText = 'Update Transaksi';
    if (document.getElementById('pageTitle')) document.getElementById('pageTitle').innerText = 'Edit Transaksi';

    switchTab('tambah');
  }

  // SESUDAH — hapus loading toast, 1 toast final saja, cegah double-submit trigger
function handleFormSubmit(e) {
  e.preventDefault();
  const btnSubmit = document.getElementById('btnSubmit');
  if (btnSubmit?.disabled) return; // guard: cegah trigger ganda jika user klik cepat 2x
  if (btnSubmit) btnSubmit.disabled = true;

  const isEditMode = Boolean(document.getElementById('editRowIndex')?.value);
  const formData = {
    rowIndex: Number(document.getElementById('editRowIndex')?.value),
    tanggal: document.getElementById('tanggal')?.value,
    jenis: document.getElementById('jenis')?.value,
    kategori: document.getElementById('kategori')?.value,
    sumber: document.getElementById('sumber')?.value,
    keterangan: document.getElementById('keterangan')?.value,
    nominal: document.getElementById('nominal')?.value
  };

  const serverFunc = isEditMode ? 'updateTransaksiServer' : 'simpanTransaksiServer';
  // PERBAIKAN DELAY: dulu di sini ada 2 round-trip berurutan (simpan -> lalu loadRiwayat(1)
  // yang baca ulang seluruh sheet). Sekarang server langsung mengembalikan data riwayat
  // terbaru dalam 1 response (res.riwayat), jadi cukup 1x google.script.run per submit.
  google.script.run
    .withSuccessHandler(res => {
      if (btnSubmit) btnSubmit.disabled = false;
      if (res && res.status === 'success') {
        const kat = (formData.kategori || '').trim();
        if (kat && !cachedKategori.includes(kat)) {
          cachedKategori.push(kat);
          cachedKategori.sort();
          populateKategori(cachedKategori); // instan, tanpa round-trip ke server
        }
        switchTab('riwayat');
        showToast('success', isEditMode ? 'Perubahan disimpan!' : 'Transaksi berhasil dicatat!');
        renderRiwayatResult(res.riwayat); // render langsung dari response, tanpa request tambahan
      } else {
        showToast('error', 'Gagal memproses: ' + (res ? res.message : 'Error server'));
      }
    })
    .withFailureHandler(err => { if (btnSubmit) btnSubmit.disabled = false; showToast('error', 'Koneksi error: ' + (err.message || err)); })
    [serverFunc](formData, 1, limitPerPage, getCurrentFilterParams());
}

  // ==========================================
  // FITUR: TOAST & HAPUS
  // ==========================================
  let toastTimeout;
  function showToast(type, text) {
    const toast = document.getElementById('toast');
    if (!toast) return;
    toast.className = `fixed bottom-6 left-1/2 -translate-x-1/2 max-w-[90vw] px-5 py-3 rounded-full text-white text-sm font-medium shadow-lg z-[9999] inline-flex items-center gap-2 whitespace-nowrap ${type === 'success' ? 'bg-emerald-600' : 'bg-red-500'} show`;
    toast.innerHTML = `<span class="material-symbols-outlined text-[18px] shrink-0">${type === 'success' ? 'check_circle' : 'error'}</span><span class="truncate">${text}</span>`;
    toast.style.display = 'flex';
    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => { toast.style.display = 'none'; }, 700);
  }

  let targetRowToDelete = null;
  function toggleDeleteBtn(cardEl) {
    const isAlreadyActive = cardEl.classList.contains('border-red-300');
    document.querySelectorAll('.tx-card-item').forEach(el => {
      el.classList.remove('border-red-300', 'bg-red-50');
      const btn = el.querySelector('.delete-btn-action');
      if (btn) btn.classList.add('hidden');
    });
    if (!isAlreadyActive) {
      cardEl.classList.add('border-red-300', 'bg-red-50');
      const deleteBtn = cardEl.querySelector('.delete-btn-action');
      if (deleteBtn) deleteBtn.classList.remove('hidden');
    }
  }

  function openDeleteModal(rowIndex, event) {
    if (event) event.stopPropagation();
    targetRowToDelete = rowIndex;
    const modal = document.getElementById('deleteModal');
    if (modal) modal.classList.remove('hidden');
  }

  function closeDeleteModal() {
    targetRowToDelete = null;
    const modal = document.getElementById('deleteModal');
    if (modal) modal.classList.add('hidden');
  }

  function confirmDelete() {
    if (!targetRowToDelete) return;
    const btnConfirm = document.getElementById('btnConfirmDelete');
    if (btnConfirm) { btnConfirm.innerText = 'Deleting...'; btnConfirm.disabled = true; }
    const rowToDelete = targetRowToDelete;
    closeDeleteModal();
    showToast('success', 'Menghapus transaksi...');

    // PERBAIKAN DELAY: sama seperti simpan/update, hapus + reload sekarang jadi 1 round-trip.
    google.script.run
      .withSuccessHandler(res => {
        if (btnConfirm) { btnConfirm.innerText = 'Ya, Hapus'; btnConfirm.disabled = false; }
        if (res && res.status === 'success') {
          showToast('success', 'Transaksi berhasil dihapus!');
          renderRiwayatResult(res.riwayat); // render langsung dari response
        } else {
          showToast('error', 'Gagal menghapus: ' + (res ? res.message : 'Error server'));
        }
      })
      .withFailureHandler(err => {
        if (btnConfirm) { btnConfirm.innerText = 'Ya, Hapus'; btnConfirm.disabled = false; }
        showToast('error', 'Koneksi terputus: ' + (err.message || err));
      })
      .hapusTransaksiServer(rowToDelete, currentPage, limitPerPage, getCurrentFilterParams());
  }
</script>
