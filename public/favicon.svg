<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Neumorphic Drop Shadows -->
    <filter id="neuRaised" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="-14" dy="-14" stdDeviation="16" flood-color="#FFFFFF" flood-opacity="0.95"/>
      <feDropShadow dx="14" dy="14" stdDeviation="18" flood-color="#A6ABBD" flood-opacity="0.65"/>
    </filter>

    <filter id="neuInset" x="-20%" y="-20%" width="140%" height="140%">
      <feOffset dx="6" dy="6"/>
      <feGaussianBlur stdDeviation="7" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="#0D2750" flood-opacity="0.18" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>

    <filter id="mintGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#36AE7C" flood-opacity="0.45"/>
    </filter>

    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ECCA3"/>
      <stop offset="50%" stop-color="#36AE7C"/>
      <stop offset="100%" stop-color="#268B60"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0"/>
      <stop offset="40%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="512" height="512" rx="128" fill="#E5E5E5"/>

  <!-- Raised Neumorphic Squircle -->
  <rect x="56" y="56" width="400" height="400" rx="96" fill="#E5E5E5" filter="url(#neuRaised)"/>

  <!-- Sunken Circular Center Well -->
  <circle cx="256" cy="260" r="148" fill="#E5E5E5" filter="url(#neuInset)"/>

  <!-- Gold Coin Floating In -->
  <g filter="url(#mintGlow)">
    <circle cx="256" cy="180" r="38" fill="url(#goldGrad)" stroke="#B45309" stroke-width="2"/>
    <circle cx="256" cy="180" r="28" fill="none" stroke="#FEF3C7" stroke-width="2.5" stroke-dasharray="4 2"/>
    <!-- Currency sign on coin -->
    <path d="M256 168 v24 M250 174 h12 M250 186 h12" stroke="#78350F" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- 3D Mint Teal Wallet / Piggy Emblem -->
  <g filter="url(#mintGlow)">
    <!-- Wallet Main Flap -->
    <path d="M150 240 C150 215, 170 200, 200 200 L312 200 C342 200, 362 215, 362 240 L362 320 C362 345, 342 360, 312 360 L200 360 C170 360, 150 345, 150 320 Z" 
          fill="url(#mintGrad)"/>
    <!-- Wallet Inner Highlight -->
    <path d="M156 242 C156 220, 174 206, 202 206 L310 206 C338 206, 356 220, 356 242" 
          fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="4" stroke-linecap="round"/>
    <!-- Clasp Pocket -->
    <rect x="290" y="258" width="76" height="44" rx="14" fill="#268B60" stroke="#1E704D" stroke-width="2"/>
    <!-- Clasp Button -->
    <circle cx="340" cy="280" r="10" fill="url(#goldGrad)"/>
    <circle cx="340" cy="280" r="4" fill="#78350F"/>
    <!-- Coin Slot Opening -->
    <rect x="220" y="214" width="72" height="8" rx="4" fill="#1B4D36"/>
  </g>
</svg>