  }

  .pb-safe {

  }

  .view-section {

  /* Toast Optimistic UI */

  .toast {

    transform: translateX(-50%) translateY(50px);
    background: #333;
    color: #fff;
    padding: 10px 18px;
    border-radius: 20px;
    font-size: 12px;

    width: max-content;
    max-width: 90vw;
