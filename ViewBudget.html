<header class="pt-2 pb-4">
  <h2 class="font-bold text-lg text-slate-800">Catatan Rekening</h2>
  <p class="text-xs sm:text-sm text-slate-500 mt-0.5">Ringkasan total kekayaan dan daftar rekening aktif Anda.</p>
</header>

<div class="bg-primary rounded-2xl shadow-md text-white p-5 mb-6">
  <p class="text-xs sm:text-sm opacity-90 mb-1">Total Semua Saldo</p>
  <p id="totalSaldoBudget" class="text-2xl sm:text-3xl font-bold mb-3">Rp 0</p>
  <div class="flex items-center gap-1.5 text-[11px] opacity-80">
    <span class="material-symbols-outlined text-[14px]">schedule</span>
    <span id="lastUpdatedBudget">Terakhir diperbarui: Hari ini, 10:45</span>
  </div>
</div>

<div class="flex items-center justify-between mb-3">
  <h3 class="font-semibold text-sm text-slate-800">Daftar Rekening</h3>
  <button aria-label="Tambah Rekening" class="text-primary hover:text-primaryHover">
    <span class="material-symbols-outlined text-[26px]">add_circle</span>
  </button>
</div>

<div id="rekeningList" class="flex flex-col">
  <div class="text-center text-textSecondary py-10 text-sm animate-pulse">Memuat rekening...</div>
</div>
