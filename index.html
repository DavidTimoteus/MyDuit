<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MyDuit — Catatan Keuangan</title>
    <meta name="description" content="Catat, pantau, dan kendalikan keuangan pribadi. Offline-first." />
    <meta name="theme-color" content="#f8faf9" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MyDuit" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
      rel="stylesheet"
    />
    <script>
      // Jaring pengaman untuk chunk yang gagal dimuat.
      //
      // Vite memuat potongan kode lazy dengan nama ber-hash. Setelah deploy baru,
      // berkas lama hilang; tab yang masih terbuka (atau service worker yang
      // menyajikan index.html lama) meminta nama lama dan menerima HTML alih-alih
      // JavaScript. Modul gagal di-parse, React tidak pernah mount, dan pengguna
      // hanya melihat layar putih. Vite memancarkan `vite:preloadError` untuk
      // kasus ini: cukup muat ulang SEKALI untuk mengambil index.html + nama baru.
      // Penjaga sessionStorage mencegah loop bila gagalnya bukan karena versi.
      window.addEventListener('vite:preloadError', function () {
        try {
          if (!sessionStorage.getItem('myduit-preload-reload')) {
            sessionStorage.setItem('myduit-preload-reload', '1')
            window.location.reload()
          }
        } catch (e) {
          window.location.reload()
        }
      })
    </script>
  </head>
  <body>
    <div id="root">
      <!--
        Inline loading placeholder — ditampilkan saat cold start PWA di HP,
        sebelum bundel React selesai dieksekusi. Mencegah jarring white flash.
        React akan mount dan menggantikan seluruh konten ini secara otomatis.
      -->
      <style>
        #root-placeholder {
          position: fixed;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          background: linear-gradient(160deg, #1b4332 0%, #2d6a4f 55%, #40916c 100%);
          font-family: 'Manrope', ui-sans-serif, system-ui, sans-serif;
          z-index: 1;
        }
        #root-placeholder-card {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 14px;
          text-align: center;
          padding: 36px 32px;
          border-radius: 32px;
          background: rgba(255, 255, 255, 0.08);
          box-shadow:
            8px 10px 24px rgba(0, 0, 0, 0.16),
            -6px -6px 18px rgba(255, 255, 255, 0.05),
            inset 2px 2px 4px rgba(255, 255, 255, 0.12),
            inset -2px -2px 6px rgba(0, 0, 0, 0.08);
          border: 1px solid rgba(255, 255, 255, 0.16);
        }
        #root-placeholder-logo {
          width: 80px;
          height: 80px;
          border-radius: 24px;
          overflow: hidden;
          display: flex;
          align-items: center;
          justify-content: center;
          background: transparent;
          box-shadow: 0 10px 24px rgba(0, 0, 0, 0.28);
        }
        #root-placeholder-logo img {
          width: 80px;
          height: 80px;
          object-fit: cover;
          border-radius: 24px;
          display: block;
        }
        #root-placeholder-title {
          font-size: 30px;
          font-weight: 800;
          color: #ffffff;
          letter-spacing: -0.02em;
          margin: 0;
        }
        #root-placeholder-tagline {
          font-size: 13px;
          font-weight: 700;
          color: #e2e8f0;
          letter-spacing: 0.06em;
          text-transform: uppercase;
          margin: 0;
        }
        #root-placeholder-dots {
          display: flex;
          gap: 6px;
          margin-top: 4px;
        }
        #root-placeholder-dots span {
          width: 7px;
          height: 7px;
          border-radius: 999px;
          background: rgba(255, 255, 255, 0.7);
          opacity: 0.35;
          animation: ph-dot-pulse 1.2s ease-in-out infinite;
        }
        #root-placeholder-dots span:nth-child(2) { animation-delay: 0.2s; }
        #root-placeholder-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes ph-dot-pulse {
          0%, 80%, 100% { opacity: 0.3; transform: scale(0.85); }
          40%            { opacity: 1;   transform: scale(1.15); }
        }
      </style>
      <div id="root-placeholder" aria-hidden="true">
        <div id="root-placeholder-card">
          <div id="root-placeholder-logo">
            <img src="/favicon.svg" alt="MyDuit logo" width="80" height="80" />
          </div>
          <p id="root-placeholder-title">MyDuit</p>
          <p id="root-placeholder-tagline">Catat. Pantau. Kendalikan.</p>
          <div id="root-placeholder-dots" aria-hidden="true">
            <span></span><span></span><span></span>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
