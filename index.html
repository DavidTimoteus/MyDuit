<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MyDuit — Catatan Keuangan</title>
    <meta name="description" content="Catat, pantau, dan kendalikan keuangan pribadi. Offline-first." />
    <meta name="theme-color" content="#E5E5E5" />
    <script src="/boot.js"></script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MyDuit" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root">
      <!--
        Inline placeholder — kanvas bersih Neumorphism #E5E5E5 saat cold start (seamless ke Splash.jsx)
      -->
      <style>
        #root-placeholder {
          position: fixed;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          background-color: #E5E5E5;
          background: #E5E5E5;
          font-family: 'Manrope', ui-sans-serif, system-ui, sans-serif;
          z-index: 99999;
        }
        #root-placeholder-inner {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 14px;
          text-align: center;
          padding: 24px;
        }
        #root-placeholder-logo {
          width: 80px;
          height: 80px;
          border-radius: 28px;
          overflow: hidden;
          display: flex;
          align-items: center;
          justify-content: center;
          background-color: #E5E5E5;
          background: #E5E5E5;
          box-shadow:
            -8px -8px 20px rgba(255, 255, 255, 0.85),
             8px  8px 20px rgba(0, 0, 0, 0.16);
        }
        #root-placeholder-logo img {
          width: 80px;
          height: 80px;
          object-fit: cover;
          border-radius: 24px;
          display: block;
        }
        #root-placeholder-title {
          font-size: 34px;
          font-weight: 800;
          color: #0F172A;
          letter-spacing: -0.02em;
          margin: 0;
          text-shadow:
            -1px -1px 2px rgba(255, 255, 255, 0.90),
             2px  2px 3px rgba(0, 0, 0, 0.22),
             4px  4px 6px rgba(0, 0, 0, 0.12);
        }
        #root-placeholder-tagline {
          font-size: 13px;
          font-weight: 700;
          color: #36AE7C;
          letter-spacing: 0.04em;
          margin: 0;
        }
        #root-placeholder-sub {
          font-size: 12px;
          font-weight: 500;
          color: #64748B;
          margin: 0;
        }
        #root-placeholder-dots {
          display: flex;
          gap: 6px;
          margin-top: 4px;
        }
        #root-placeholder-dots span {
          width: 7px;
          height: 7px;
          border-radius: 999px;
          background: #36AE7C;
          opacity: 0.35;
          animation: ph-dot-pulse 1.2s ease-in-out infinite;
        }
        #root-placeholder-dots span:nth-child(2) { animation-delay: 0.2s; }
        #root-placeholder-dots span:nth-child(3) { animation-delay: 0.4s; }
        #root-placeholder-dots span:nth-child(4) { animation-delay: 0.6s; }
        @keyframes ph-dot-pulse {
          0%, 80%, 100% { opacity: 0.3; transform: scale(0.85); }
          40%            { opacity: 1;   transform: scale(1.15); }
        }
      </style>
      <div id="root-placeholder" aria-hidden="true">
        <div id="root-placeholder-inner">
          <div id="root-placeholder-logo">
            <img src="/favicon.svg" alt="MyDuit logo" width="80" height="80" />
          </div>
          <p id="root-placeholder-title">MyDuit</p>
          <p id="root-placeholder-tagline">Catat. Pantau. Kendalikan.</p>
          <p id="root-placeholder-sub">Pemasukan dan pengeluaranmu dalam satu tempat.</p>
          <div id="root-placeholder-dots" aria-hidden="true">
            <span></span><span></span><span></span><span></span>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
