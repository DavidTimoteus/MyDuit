  // Reflow ulang layout "pas layar" tab Utang saat window di-resize/rotate (mis. desktop
  // dilebarkan/disempitkan, atau HP diputar orientasi) SELAGI tab Utang sedang aktif —
  // di-debounce supaya tidak menghitung ulang di setiap 1px pergerakan resize.
  // Dipasang di 3 sumber sekaligus (window resize, orientationchange, visualViewport resize)
  // karena di banyak browser mobile (terutama Safari iOS) event 'resize' biasa TIDAK selalu
  // terpicu saat address bar/toolbar muncul-sembul saat scroll -> tanpa visualViewport,
  // tinggi #utangViewport bisa telat/keliru menyesuaikan & memicu overflow/scroll di HP.
  function scheduleUtangReflow_(delay) {
    clearTimeout(utangResizeTimer);
    utangResizeTimer = setTimeout(() => {
      const viewSection = document.getElementById('viewUtang');
      if (viewSection && viewSection.classList.contains('active')) {
        layoutAndRenderUtangPages_();
      }
    }, delay || 200);
  }
  window.addEventListener('resize', () => scheduleUtangReflow_(200));
  window.addEventListener('orientationchange', () => scheduleUtangReflow_(250));
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', () => scheduleUtangReflow_(120));
  }

  function formatTanggalIndo(date) {
    const dd = String(date.getDate()).padStart(2, '0');
    return `${dd} ${BULAN_ID[date.getMonth()]} ${date.getFullYear()}`;
  }

  function formatRupiah(n) {
    return 'Rp ' + Number(n || 0).toLocaleString('id-ID');
  }

  function formatTanggalRelatif(dateStr) {
    if (!dateStr) return "-";
    const parts = dateStr.split('/');
    if (parts.length === 3) {
      const d = new Date(`${parts[2]}-${parts[1]}-${parts[0]}T00:00:00`);
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const diffDays = Math.ceil((today - d) / (1000 * 60 * 60 * 24));
      if (diffDays === 0) return "Hari ini";
      if (diffDays === 1) return "Kemarin";
    }
    return dateStr;
  }

  // ===== SPLASH SCREEN (loading ala mobile) =====
  // Overlay logo + nama "MyDuit" menutupi proses pemuatan awal, lalu di-dissolve
  // (fade out) ke beranda (tab Transaksi/Riwayat). Dipanggil dari DOMContentLoaded.
  // Tidak ada block delay: splash menunggu minimum ~1.4s biar efek masuk terasa
  // (logo pop + huruf masuk beranimasi), lalu fade 550ms & elemen dihapus dr DOM.
  function initSplashScreen_() {
    const splash = document.getElementById('splashScreen');
    if (!splash) return;

    const splashMinTime = 1400; // ms minimum splash tampil (efek animasi logo terasa)
    const fadeMs = 550;

    const done = function () {
      splash.classList.add('is-leaving');
      setTimeout(function () {
        if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
      }, fadeMs);
    };

    setTimeout(done, splashMinTime);
  }

  // ==========================================
  // CUSTOM DROPDOWN CLAYMORPHISM (pengganti popup native <select>)
  // ==========================================
  // MASALAH: popup opsi bawaan <select> (yg muncul saat diklik) dirender LANGSUNG oleh
  // browser/OS, BUKAN oleh halaman -> CSS/claymorphism kita SAMA SEKALI tidak bisa
  // menjangkau tampilannya (makanya selalu polos + highlight biru bawaan, beda sendiri
  // dari sisa app). Satu-satunya cara benar2 dapat popup ber-gaya claymorphism adalah
  // ganti popup-nya sendiri dgn elemen HTML biasa yg kita buat & styling manual.
  // PENDEKATAN: <select> ASLI TETAP ADA di DOM & TETAP jadi satu-satunya sumber data
  // (cuma disembunyikan visual via .clay-select-native-hidden) -> SEMUA kode existing yg
  // baca/tulis .value elemen ini (handleFormSubmit, openEditMode, OCR autofill, dst di
  // seluruh file ini) TIDAK PERLU DIUBAH SAMA SEKALI, tetap jalan seperti biasa. Yang
  // baru cuma lapisan visual: tombol trigger (klon style select asli) + list custom di
  // atasnya, disinkronkan ke select asli lewat 3 jalur sekaligus supaya SELALU akurat
  // walau value-nya diubah dari mana saja:
  //   1) event 'change' (saat user klik opsi custom kita)
  //   2) MutationObserver di childList select (saat opsi di-rebuild total, mis.
  //      populateSumberAkun() yg replace innerHTML select #sumber/#salinSumber)
  //   3) override property .value via Object.defineProperty (nangkep assignment
  //      LANGSUNG semacam "elSumber.value = data.sumber" di kode lain yg TIDAK memicu
  //      event 'change' bawaan browser)
  // List dirender ke document.body (bukan nested di dalam form) posisi FIXED, dihitung
  // dari getBoundingClientRect() trigger -> supaya TIDAK ke-clip oleh "overflow-y-auto"
  // pada #transaksiForm/#salinTransaksiForm (kalau nested biasa, popup panjang bakal
  // kepotong krn parent-nya scroll container, ini bug umum dropdown custom).
  // FIX (scroll/swipe list dropdown terpotong): SEMUA popup list custom claymorphism
  // (native <select> yg dienhance enhanceClaySelect_() MAUPUN combobox bebas-ketik
  // enhanceClayCombobox_()) WAJIB bisa di-scroll/swipe mulus saat opsinya banyak & tidak
  // muat di layar, di HP maupun desktop. Idealnya ini cukup diatur lewat class
  // .clay-select-list di ViewCSS.html, TAPI diset ULANG di sini secara inline (bukan cuma
  // andalkan CSS eksternal) supaya perilakunya PASTI konsisten & tidak diam2 hilang kalau
  // class-nya kena override/kehapus di ViewCSS.html kelak. max-height dibatasi (~15rem,
  // senada dgn Tailwind max-h-60) + overflow-y:auto supaya list panjang discroll di dalam
  // dirinya sendiri (bukan mendorong/terpotong oleh layar), dan
  // -webkit-overflow-scrolling:touch supaya swipe di iOS Safari terasa mulus (momentum
  // scroll bawaan), bukan patah-patah/nge-drag biasa.
  function applyClaySelectListScrollStyle_(list) {
    list.style.maxHeight = '15rem'; // ~max-h-60
    list.style.overflowY = 'auto';
    list.style.overflowX = 'hidden';
    list.style.webkitOverflowScrolling = 'touch'; // momentum scroll iOS Safari
    list.style.overscrollBehavior = 'contain'; // scroll di dalam list tidak "bocor" ke belakangnya
  }

  function enhanceClaySelect_(selectId) {
    const select = document.getElementById(selectId);
    if (!select || select._clayEnhanced) return;
    select._clayEnhanced = true;

    select.classList.add('clay-select-native-hidden');

    const trigger = document.createElement('button');
    trigger.type = 'button';
    trigger.className = (select.className || '')
      .replace('clay-select-native-hidden', '')
      .trim() + ' clay-select-trigger flex items-center justify-between gap-2';
    trigger.innerHTML =
      '<span class="clay-select-trigger-label truncate"></span>' +
      '<span class="material-symbols-outlined text-[18px] text-slate-400 shrink-0">expand_more</span>';
    select.insertAdjacentElement('afterend', trigger);

    // Posisi popup dihitung manual (fixed, nempel document.body) -> parent select TIDAK
    // perlu position:relative, jadi field-group lain yg reuse class ini tidak kepengaruh.
    const list = document.createElement('div');
    list.className = 'clay-select-list hidden';
    list.setAttribute('role', 'listbox');
    applyClaySelectListScrollStyle_(list);
    document.body.appendChild(list);

    function labelEl() { return trigger.querySelector('.clay-select-trigger-label'); }

    function updateTriggerLabel() {
      const opt = select.options[select.selectedIndex];
      const el = labelEl();
      if (!el) return;
      if (opt && opt.value !== '') {
        el.textContent = opt.textContent;
        el.classList.remove('text-slate-400');
      } else {
        el.textContent = opt ? opt.textContent : '';
        el.classList.add('text-slate-400');
      }
    }

    function renderOptions() {
      list.innerHTML = '';
      Array.from(select.options).forEach(opt => {
        if (opt.disabled) return; // skip placeholder "Pilih ..."
        const item = document.createElement('div');
        item.className = 'clay-select-option' + (opt.value === select.value ? ' is-selected' : '');
        item.setAttribute('role', 'option');
        item.textContent = opt.textContent;
        item.addEventListener('click', () => {
          select.value = opt.value;
          select.dispatchEvent(new Event('change', { bubbles: true }));
          closeList();
        });
        list.appendChild(item);
      });
    }

    function positionList() {
      const r = trigger.getBoundingClientRect();
      list.style.left = r.left + 'px';
      list.style.top = (r.bottom + 6) + 'px';
      list.style.width = r.width + 'px';
    }

    function openList() {
      renderOptions();
      positionList();
      list.classList.remove('hidden');
      trigger.classList.add('is-open');
    }
    function closeList() {
      list.classList.add('hidden');
      trigger.classList.remove('is-open');
    }
    function isOpen() { return !list.classList.contains('hidden'); }

    trigger.addEventListener('click', (e) => {
      e.stopPropagation();
      isOpen() ? closeList() : openList();
    });
    document.addEventListener('click', (e) => {
      if (isOpen() && !list.contains(e.target) && e.target !== trigger) closeList();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && isOpen()) closeList();
    });
    // Modal/form-nya sendiri yg discroll (bukan window) -> tutup saja saat scroll drpd
    // reposition terus-menerus (lebih simpel & aman, popup jarang dibuka sambil scroll).
    // FIX (list panjang tidak bisa di-scroll/swipe): listener ini dipasang di document
    // dgn { capture: true }, sehingga SEMUA event 'scroll' di halaman ini tertangkap —
    // TERMASUK scroll/swipe DI DALAM list itu sendiri (elemen `list` scrollable,
    // overflow-y:auto, lihat .clay-select-list di ViewCSS.html), krn listener capture
    // di document tetap kepicu utk scroll pada elemen manapun di bawahnya, walau event
    // scroll sendiri tidak bubble. Akibatnya: begitu jari/scroll mulai menggulir isi
    // list, closeList() langsung terpanggil & list seketika tertutup sebelum sempat
    // ke-scroll. Guard `list.contains(e.target)` di bawah mengecualikan scroll yg
    // sumbernya dari dalam list sendiri — HANYA scroll di luar list (mis. modal/body
    // di belakangnya) yang tetap menutup popup seperti semula.
    document.addEventListener('scroll', (e) => { if (isOpen() && !list.contains(e.target)) closeList(); }, true);
    window.addEventListener('resize', () => { if (isOpen()) closeList(); });

    select.addEventListener('change', updateTriggerLabel);
    new MutationObserver(updateTriggerLabel).observe(select, { childList: true });

    const form = select.closest('form');
    if (form) form.addEventListener('reset', () => setTimeout(updateTriggerLabel));

    // Nangkep "select.value = ..." langsung dari kode lain (openEditMode, OCR autofill,
    // dst) yg TIDAK memicu event 'change' bawaan browser -> tanpa ini label trigger bisa
    // basi/tidak sinkron setelah edit transaksi dibuka.
    const nativeDesc = Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype, 'value');
    Object.defineProperty(select, 'value', {
      get() { return nativeDesc.get.call(select); },
      set(v) { nativeDesc.set.call(select, v); updateTriggerLabel(); },
      configurable: true
    });

    updateTriggerLabel();
  }

  // ==========================================
  // LOGIKA FILTER KATEGORI BERDASARKAN JENIS (sumber: DATABASE, bukan histori ter-load)
  // ==========================================
  // Server (fetchKategoriServer()) cuma balikin SATU daftar kategori datar (array string),
  // TANPA info kategori itu punya jenis Pemasukan atau Pengeluaran. Pemetaannya diambil
  // dari SELURUH data transaksi di database lewat fungsi server BARU
  // getKategoriByJenisServer() (lihat Code.gs — implementasi query-nya ADA DI SISI SERVER,
  // BUKAN cachedRiwayat yg cuma nyimpen histori halaman/filter yg sedang ke-load di client).
  //
  // STRATEGI LOAD: dipanggil SEKALI di background saat app pertama dibuka (DOMContentLoaded),
  // TIDAK memblokir apapun. Supaya TIDAK perlu nunggu round-trip server tiap kali combobox
  // Kategori dibuka (dan supaya kunjungan berikutnya instan tanpa loading), hasilnya disimpan
  // di localStorage PER PERANGKAT (KATEGORI_JENIS_SUMBER_CACHE_KEY) -> combobox baca dari
  // kategoriJenisSumberMap (in-memory, awalnya diisi dari localStorage kalau ada) SELAGI request
  // background ke server jalan menyegarkan cache utk sesi berikutnya.
  const KATEGORI_JENIS_SUMBER_CACHE_KEY = 'myduit_kategoriJenisSumberMap_v1';
  let kategoriJenisSumberMap = null; // { Pengeluaran: { _all:[...], "Dompet":[...], ... }, Pemasukan: {...} }

  function loadKategoriJenisMapFromDeviceCache_() {
    try {
      const raw = localStorage.getItem(KATEGORI_JENIS_SUMBER_CACHE_KEY);
      if (raw) kategoriJenisSumberMap = JSON.parse(raw);
    } catch (e) {
      // localStorage tidak tersedia (mis. mode private/incognito ketat) atau data korup ->
      // abaikan saja, tetap lanjut pakai fallback cachedKategori sampai server jawab.
    }
  }

  function saveKategoriJenisMapToDeviceCache_(map) {
    try { localStorage.setItem(KATEGORI_JENIS_SUMBER_CACHE_KEY, JSON.stringify(map)); } catch (e) {}
  }

  function refreshKategoriJenisMapFromServer_() {
    if (window.__HAS_DATABASE__ === false) return; // DB belum ada -> modal setup yang menangani
    google.script.run
      .withSuccessHandler((map) => {
        if (map && typeof map === 'object') {
          kategoriJenisSumberMap = map;
          saveKategoriJenisMapToDeviceCache_(map);
        }
      })
      .withFailureHandler((err) => {
        console.error('Gagal ambil kategori per jenis+sumber dari server:', err);
        // biarkan kategoriJenisSumberMap apa adanya (cache lama dari device kalau ada, atau
        // null -> getKategoriByJenisSumber_() otomatis fallback ke cachedKategori/daftar lengkap).
      })
      .getKategoriByJenisSumberServer();
  }

  // Kategori difilter berdasarkan Jenis (Pemasukan/Pengeluaran) DAN Sumber/Akun aktif.
  // Kalau kombinasi jenis+sumber belum pernah punya histori transaksi (mis. akun baru),
  // fallback ke seluruh kategori milik jenis itu ("_all") supaya combobox tidak kosong.
  // Kalau map dari server/device-cache belum ada sama sekali -> fallback ke cachedKategori
  // (daftar lengkap tanpa filter apapun).
  function getKategoriByJenisSumber_(jenisAktif, sumberAktif) {
    const key = isIncomeJenis_(jenisAktif) ? 'Pemasukan' : 'Pengeluaran';
    const bucket = kategoriJenisSumberMap && kategoriJenisSumberMap[key];
    if (bucket) {
      const sumberKey = String(sumberAktif || '').trim();
      if (sumberKey && Array.isArray(bucket[sumberKey]) && bucket[sumberKey].length) {
        return bucket[sumberKey];
      }
      if (Array.isArray(bucket._all) && bucket._all.length) {
        return bucket._all;
      }
    }
    return cachedKategori.slice(); // map belum ada -> tampilkan semua
  }

    // ==========================================
  // FORMAT RIBUAN OTOMATIS — SEMUA INPUT NOMINAL (ATURAN UTAMA seluruh app)
  // ==========================================
  // SETIAP field nominal Rupiah di seluruh app (Catat Transaksi #nominal, Salin Transaksi
  // #salinNominal, Pindah Saldo #pindahSaldoNominal, Utang #formUtangTotal/#formUtangCicilan,
  // Tambah/Edit Rekening #inputSaldoAwalRekeningBaru/#editRekeningSaldo) WAJIB tampil dgn
  // pemisah ribuan titik SAAT DIKETIK (100 / 1.000 / 10.000 / 100.000, dst), bukan cuma saat
  // ditampilkan di kartu/riwayat (yg sudah lama pakai .toLocaleString('id-ID') di tempat lain).
  //
  // PENDEKATAN: field2 ini diubah dari type="number" -> type="text" + inputmode="numeric" di
  // HTML masing2 (ViewTransaksi.html/ViewUtang.html/ViewBudget.html) — <input type=number> MENOLAK
  // karakter "." sbg pemisah ribuan (cuma mau angka polos), jadi tidak mungkin diformat
  // langsung di tempat. Supaya SEMUA kode lain yg SUDAH ADA (baca `Number(el.value)`, tulis
  // `el.value = 150000` — puluhan titik tersebar di file ini: handleFormSubmit,
  // handlePindahSaldoSubmit, openEditMode, handleUtangSubmit, dst) TIDAK PERLU DIUBAH SATU
  // PUN, property "value" bawaan elemen di-override (pola SAMA PERSIS dgn trik
  // flatpickr/custom-select yg sudah ada di file ini):
  //   - GETTER: selalu balikin STRING ANGKA MENTAH tanpa titik (mis. "150000"), walau yg
  //     tampil di layar "150.000" -> `Number(el.value)` di kode manapun tetap dapat angka
  //     yg benar, kode itu sendiri sama sekali tidak tahu ada pemformatan berjalan.
  //   - SETTER: terima angka/string apapun (mis. `el.value = item.saldo` dari
  //     openEditMode()/editRekening dst), buang semua karakter non-digit, lalu tulis ulang
  //     ke elemen SUDAH terformat titik (nativeSet) -> assignment dari kode lama otomatis
  //     ikut terformat tanpa perlu disentuh.
  // Listener 'input' (saat user mengetik/hapus) mem-format ULANG setiap ketukan, dgn posisi
  // kursor dijaga tetap relatif dari KANAN (caretFromRight) supaya tidak meloncat ke depan
  // saat titik baru disisipkan di tengah angka — masalah umum pada live-format kalau posisi
  // kursor dihitung dari kiri.
  const NOMINAL_INPUT_IDS_ = [
    'nominal', 'salinNominal', 'pindahSaldoNominal', 'formUtangTotal',
    'formUtangCicilan', 'inputSaldoAwalRekeningBaru', 'editRekeningSaldo',
    'budgetLimitNominal'
  ];

  function formatRibuanDigits_(digitsOnly) {
    if (!digitsOnly) return '';
    return digitsOnly.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  }

  function initFormatRibuanNominal_() {
    NOMINAL_INPUT_IDS_.forEach(id => {
      const el = document.getElementById(id);
      if (!el || el._ribuanInit) return;
      el._ribuanInit = true;

      const proto = Object.getPrototypeOf(el);
      const nativeDesc = Object.getOwnPropertyDescriptor(proto, 'value')
        || Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value');

      Object.defineProperty(el, 'value', {
        configurable: true,
        get() {
          return nativeDesc.get.call(el).replace(/\./g, '');
        },
        set(v) {
          const digitsOnly = String(v == null ? '' : v).replace(/[^\d]/g, '');
          nativeDesc.set.call(el, formatRibuanDigits_(digitsOnly));
        }
      });

      el.addEventListener('input', () => {
        const rawDisplayed = nativeDesc.get.call(el);
        const caretFromRight = rawDisplayed.length - (el.selectionStart ?? rawDisplayed.length);
        const digitsOnly = rawDisplayed.replace(/[^\d]/g, '');
        const formatted = formatRibuanDigits_(digitsOnly);
        nativeDesc.set.call(el, formatted);
        const newPos = Math.max(0, formatted.length - caretFromRight);
        el.setSelectionRange(newPos, newPos);
      });

      // Reformat nilai awal kalau field ini sudah keburu terisi sebelum init (mis. server
      // inline value di HTML) -> konsisten pakai titik sejak render pertama.
      if (nativeDesc.get.call(el)) {
        const digitsOnly = nativeDesc.get.call(el).replace(/[^\d]/g, '');
        nativeDesc.set.call(el, formatRibuanDigits_(digitsOnly));
      }
    });
  }

  // ==========================================
  // CUSTOM COMBOBOX CLAYMORPHISM (pengganti <input list="..."> + <datalist>)
  // ==========================================
  // MASALAH SERUPA custom select di atas: popup <datalist> bawaan browser dirender native
  // oleh OS (kotak hitam kaku, lepas dari estetika app), CSS kita tidak bisa menjangkaunya.
  // BEDA dari custom select: field kategori WAJIB tetap bisa diketik bebas (nambah kategori
  // baru sendiri) -> elemen dasarnya TETAP <input type="text"> biasa (TIDAK disembunyikan
  // spt select), cukup ditempeli listener focus/klik/ketik utk munculin & live-search list
  // custom claymorphism di bawahnya (reuse .clay-select-list/.clay-select-option, gaya sama
  // persis dgn dropdown #sumber). getOptionsFn dipanggil ULANG setiap kali list dibuka/
  // difilter (BUKAN sekali di awal) -> otomatis ikut jenis TERBARU tiap saat, jadi TIDAK
  // perlu listener 'change' terpisah pada #jenis atau panggilan manual tambahan di
  // openTransaksiPreset()/openEditMode(): begitu #jenis berubah (lewat cara apapun -
  // diklik user maupun di-set programatic), kali berikutnya combobox Kategori dibuka
  // otomatis sudah dapat daftar yg sesuai, tanpa ada state list yg perlu disinkronkan manual.
  function enhanceClayCombobox_(inputId, getOptionsFn) {
    const input = document.getElementById(inputId);
    if (!input || input._clayEnhanced) return;
    input._clayEnhanced = true;

    input.removeAttribute('list'); // lepas ikatan ke <datalist> native, popup kustom ambil alih

    const list = document.createElement('div');
    list.className = 'clay-select-list hidden';
    list.setAttribute('role', 'listbox');
    applyClaySelectListScrollStyle_(list);
    document.body.appendChild(list);

    function positionList() {
      const r = input.getBoundingClientRect();
      list.style.left = r.left + 'px';
      list.style.top = (r.bottom + 6) + 'px';
      list.style.width = r.width + 'px';
    }

    function renderOptions() {
      const q = input.value.trim().toLowerCase();
      const all = (typeof getOptionsFn === 'function' ? getOptionsFn() : []) || [];
      const filtered = q ? all.filter(k => k.toLowerCase().includes(q)) : all;
      list.innerHTML = '';
      if (filtered.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'clay-select-option is-empty';
        empty.textContent = q ? `Pakai "${input.value.trim()}" sebagai kategori baru` : 'Belum ada kategori';
        list.appendChild(empty);
        return;
      }
      filtered.forEach(k => {
        const item = document.createElement('div');
        item.className = 'clay-select-option' + (k === input.value ? ' is-selected' : '');
        item.setAttribute('role', 'option');
        item.textContent = k;
        // mousedown (bukan click) supaya jalan SEBELUM input kehilangan focus (blur),
        // krn blur akan menutup list lebih dulu kalau pakai 'click'.
        item.addEventListener('mousedown', (e) => {
          e.preventDefault();
          input.value = k;
          input.dispatchEvent(new Event('input', { bubbles: true }));
          input.dispatchEvent(new Event('change', { bubbles: true }));
          closeList();
        });
        list.appendChild(item);
      });
    }

    function openList() {
      renderOptions();
      positionList();
      list.classList.remove('hidden');
    }
    function closeList() { list.classList.add('hidden'); }
    function isOpen() { return !list.classList.contains('hidden'); }

    input.addEventListener('focus', openList);
    input.addEventListener('click', openList);
    input.addEventListener('input', openList); // live search sambil ngetik
    document.addEventListener('click', (e) => {
      if (isOpen() && !list.contains(e.target) && e.target !== input) closeList();
    });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && isOpen()) closeList(); });
    // FIX (BUG UTAMA "scroll/swipe list belum jalan"): sebelumnya listener ini `() => { if
    // (isOpen()) closeList(); }` TANPA pengecualian e.target sama sekali -> scroll APAPUN,
    // TERMASUK swipe/scroll DI DALAM list combobox itu sendiri (elemen `list`,
    // overflow-y:auto), langsung memicu closeList() SEKETIKA di scroll pertama (bahkan
    // sebelum sempat bergeser sepiksel pun terlihat) -> list SELALU nyaris-mustahil discroll,
    // beda dari enhanceClaySelect_() di atas yg SUDAH benar pakai guard `list.contains(e.target)`
    // sejak awal. Disamakan persis di sini: HANYA scroll dari LUAR list (mis. modal/body di
    // belakangnya) yang menutup popup; scroll/swipe yg sumbernya dari dalam list sendiri
    // dibiarkan jalan normal.
    document.addEventListener('scroll', (e) => { if (isOpen() && !list.contains(e.target)) closeList(); }, true);
    window.addEventListener('resize', () => { if (isOpen()) closeList(); });
  }


  // ==========================================
  // NAVIGASI TAB UTAMA
  // ==========================================
  // Body punya class Tailwind "pb-24" (padding-bottom 96px) supaya konten normal-flow tab
  // lain (Tambah/Statistik/Budget yang memang didesain scroll) tidak ketutup nav bawah yang
  // fixed. Tab Riwayat & Utang beda: tingginya sudah dihitung sendiri via
  // fitRiwayatListViewport_() / fitUtangViewport() supaya PERSIS pas di atas nav (lihat
  // komentar di ViewUtang.html) -> kalau pb-24 body TETAP menyala, itu jadi ruang kosong
  // TAMBAHAN di bawah #riwayatList/#utangViewport yang mendorong total tinggi body melebihi
  // tinggi layar & memicu SCROLL DI LEVEL HALAMAN (kebalikan dari tujuan "pas layar, tanpa
  // scroll") di banyak ukuran layar mobile. Makanya di-nolkan khusus saat tab Riwayat/Utang
  // aktif & dikembalikan lagi saat pindah ke tab lain.
  function updateBodyPaddingForTab_(tabName) {
    document.body.style.paddingBottom = (tabName === 'utang' || tabName === 'riwayat' || tabName === 'budget') ? '0px' : '';
  }

  function switchTab(tabName) {
    const views = { 
      riwayat: 'viewRiwayat', 
      tambah: 'viewTambah', 
      budget: 'viewBudget',
      statistik: 'viewStatistik',
      utang: 'viewUtang'
    };

    updateBodyPaddingForTab_(tabName);

    // Sembunyikan semua tampilan
    Object.values(views).forEach(id => {
      const el = document.getElementById(id);
      if (el) {
        el.classList.remove('active');
        el.classList.add('hidden');
      }
    });

    // Atur visibilitas header utama (hanya tampil di tab riwayat)
    const pageHeader = document.getElementById('pageHeader');
    if (pageHeader) {
      if (tabName === 'riwayat') {
        pageHeader.classList.remove('hidden');
      } else {
        pageHeader.classList.add('hidden');
      }
    }

    // Tampilkan tampilan yang dipilih
    const targetId = views[tabName];
    const activeEl = targetId ? document.getElementById(targetId) : null;
    if (activeEl) {
      activeEl.classList.remove('hidden');
      activeEl.classList.add('active');
      activeEl.style.display = ''; 
    }

    if (tabName === 'tambah' && !document.getElementById('editRowIndex')?.value) {
      resetFormState();
    } else if (tabName !== 'tambah') {
      resetFormState();
    }

    // Lazy load data jika belum ada di cache
    if (tabName === 'budget') {
      if (budgetSubTab === 'budget') {
        loadBudget();
      } else {
        if (!cachedDompet) loadDompetServer(true);
        else renderDompetUI(cachedDompet);
        // sama alasannya dgn setTimeout(fitRiwayatListViewport_, 0) di tab riwayat: panggil
        // sesaat SETELAH browser selesai reflow (bukan sinkron) supaya getBoundingClientRect()
        // #rekeningList sudah akurat begitu #viewBudget baru saja jadi .active.
        setTimeout(fitRekeningListViewport_, 0);
      }
    } else if (tabName === 'statistik') {
      loadStatistik();
    } else if (tabName === 'utang') {
      loadUtang();
    } else if (tabName === 'riwayat') {
      // header pageHeader baru muncul/hilang di sini -> tinggi tersedia utk list berubah,
      // hitung ulang sesaat setelah browser selesai reflow (bukan sinkron).
      setTimeout(fitRiwayatListViewport_, 0);
    }

    document.querySelectorAll('.nav-btn').forEach(btn => {
    const tab = btn.getAttribute('data-tab');
    const isActive = (tab === tabName);

    // Toggle kelas active pada tombol navigasi
    btn.classList.toggle('active', isActive);
   });

    updateNavActiveState(tabName);
    updateFabAddButton(tabName);
  }

  // FIX: tombol FAB "+" di nav bawah sebelumnya selalu hijau & selalu switchTab('tambah'),
  // termasuk saat pengguna sedang di tab Utang (tidak relevan, seharusnya buka form
  // tambah utang bukan form tambah transaksi kas). Sekarang warnanya & fungsinya
  // menyesuaikan tab aktif: di tab Utang jadi merah + buka modal tambah utang,
  // di tab lain tetap hijau + switchTab('tambah') seperti semula.
  function updateFabAddButton(tabName) {
    const fab = document.getElementById('btnFabAdd');
    if (!fab) return;

    // Speed-dial (Pengeluaran/Pindah Saldo/Pemasukan) cuma relevan di tab default/Transaksi
    // -> tutup dulu & pastikan state bersih tiap kali FAB berganti fungsi/tab pindah,
    // supaya tidak ada dial "nyangkut" terbuka saat FAB sudah berubah jadi tombol lain
    // (mis. Tambah Utang/Tambah Rekening).
    closeFabSpeedDial();

    // Pakai inline style (bukan class Tailwind from-x/to-x) karena warna merah bukan
    // bagian dari palet tailwind.config di ViewIndex.html -> inline style lebih pasti menang.
    // Shadow-nya SUDAH tidak di-inline lagi (dulu fab.style.boxShadow) — sekarang cukup
    // toggle class clay-key-danger/clay-key-primary, .clay-fab (ViewCSS.html) yg urus
    // resep shadow clay-nya (key warnanya otomatis ikut ganti tanpa perlu inline lagi).
    if (tabName === 'utang') {
      fab.style.background = 'linear-gradient(135deg, #EF5350 0%, #B71C1C 100%)';
      fab.classList.remove('clay-key-primary');
      fab.classList.remove('clay-key-blue');
      fab.classList.add('clay-key-danger');
      fab.setAttribute('aria-label', 'Tambah Utang');
      fab.onclick = () => openUtangModal(null, 'add');
    } else if (tabName === 'budget') {
      // FIX: FAB di tab Budget sebelumnya tetap switchTab('tambah') (buka form transaksi
      // kas), padahal konteksnya sedang di halaman Rekening -> lebih relevan langsung
      // buka modal "Tambah Rekening / Akun Baru" (ViewBudget.html).
      // Warna diganti solid bg-blue-700 (#1d4ed8) — sesuai permintaan terbaru, menggantikan
      // clay-key-primary (hijau) yg dipakai tab lain. Inline style dipakai (bukan cuma toggle
      // class) krn "biru solid FAB" ini beda dari resep gradient clay-key-blue bawaan (yg
      // dipakai kartu/tombol lain di tab Budget) — di sini cukup 1 warna flat sesuai instruksi.
      fab.style.background = '#1d4ed8';
      fab.classList.remove('clay-key-danger');
      fab.classList.remove('clay-key-primary');
      fab.classList.add('clay-key-blue');
      // Sub-tab menentukan aksi FAB: di sub-tab 'budget' (limit per kategori) buka modal
      // tambah budget; di sub-tab 'rekening' buka modal tambah rekening.
      if (budgetSubTab === 'budget') {
        fab.setAttribute('aria-label', 'Tambah Budget');
        fab.onclick = () => openTambahBudgetModal();
      } else {
        fab.setAttribute('aria-label', 'Tambah Rekening');
        fab.onclick = () => openTambahRekeningModal();
      }
    } else {
      // FAB tambah transaksi — sekarang membuka speed-dial 3 pilihan (Pengeluaran/Pindah
      // Saldo/Pemasukan) dulu, bukan langsung switchTab('tambah') lagi. Lihat
      // toggleFabSpeedDial()/openTransaksiPreset()/openPindahSaldoModal() di bawah.
      fab.style.background = '';
      fab.classList.remove('clay-key-danger');
      fab.classList.remove('clay-key-blue');
      fab.classList.add('clay-key-primary');
      fab.setAttribute('aria-label', 'Tambah (Pengeluaran/Pindah Saldo/Pemasukan)');
      fab.onclick = () => toggleFabSpeedDial();
    }
  }

  // ==========================================
  // FAB SPEED-DIAL: Pengeluaran / Pindah Saldo / Pemasukan
  // ==========================================
  let fabDialOpen = false; // true = speed-dial sedang terbuka (3 tombol melengkung tampil)

  function toggleFabSpeedDial() {
    fabDialOpen ? closeFabSpeedDial() : openFabSpeedDial();
  }

  function openFabSpeedDial() {
    const dial = document.getElementById('fabSpeedDial');
    const backdrop = document.getElementById('fabDialBackdrop');
    const icon = document.getElementById('btnFabAddIcon');
    if (!dial) return;
    fabDialOpen = true;
    dial.classList.add('open');
    if (backdrop) backdrop.classList.remove('hidden');
    if (icon) icon.classList.add('fab-icon-open'); // "+" -> "x" (rotate 45deg, lihat ViewCSS.html)
  }

  function closeFabSpeedDial() {
    const dial = document.getElementById('fabSpeedDial');
    const backdrop = document.getElementById('fabDialBackdrop');
    const icon = document.getElementById('btnFabAddIcon');
    fabDialOpen = false;
    if (dial) dial.classList.remove('open');
    if (backdrop) backdrop.classList.add('hidden');
    if (icon) icon.classList.remove('fab-icon-open');
  }

  // Dipicu tombol "Pengeluaran"/"Pemasukan" di speed-dial -> langsung buka form Catat
  // Transaksi (#viewTambah) dgn field Jenis SUDAH terisi otomatis & disembunyikan (lihat
  // #jenisFieldGroup/#tanggalJenisRow di ViewTransaksi.html), supaya pengguna tidak perlu pilih
  // jenis lagi manual. Dikembalikan ke kondisi semula oleh resetJenisPresetUI_() (dipanggil
  // dari resetFormState()) begitu form ditutup/direset lagi.
  //
  // FIX: sebelumnya fungsi ini memanggil switchTab('tambah') (yg baru MEMICU resetFormState()
  // & baru menampilkan #viewTambah secara TIDAK LANGSUNG lewat side-effect switchTab lain:
  // toggle nav, lazy-load tab lain, updateFabAddButton, dst) -> preset kadang tidak
  // ke-apply/gagal tampil krn urutan efek sampingnya bertumpuk. Sekarang #viewTambah
  // ditampilkan LANGSUNG (toggle class .active/.hidden di sini, tanpa lewat switchTab),
  // resetFormState() juga dipanggil LANGSUNG lebih dulu supaya form pasti kosong/fresh
  // SEBELUM value jenis & penyembunyian field-nya di-set -> urutannya eksplisit & tidak
  // bergantung pada logic switchTab yg lebih luas.
  function openTransaksiPreset(jenis) {
    closeFabSpeedDial();

    // 1) Kosongkan/siapkan form mode TAMBAH (bukan edit) lebih dulu.
    resetFormState();

    // 2) Isi & sembunyikan field Jenis (preset otomatis, user tidak perlu pilih manual lagi).
    const jenisSelect = document.getElementById('jenis');
    const jenisGroup = document.getElementById('jenisFieldGroup');
    const row = document.getElementById('tanggalJenisRow');
    if (jenisSelect) jenisSelect.value = jenis; // via setter enhanceClaySelect_, trigger label custom ikut sinkron
    if (jenisGroup) jenisGroup.classList.add('hidden');
    if (row) { row.classList.remove('grid-cols-2'); row.classList.add('grid-cols-1'); }

    // 3) Tampilkan modal #viewTambah LANGSUNG (bukan lewat switchTab()).
    const modalTambah = document.getElementById('viewTambah');
    if (modalTambah) {
      modalTambah.classList.remove('hidden');
      modalTambah.classList.add('active');
      modalTambah.style.display = ''; // bersihkan kalau ada inline display:none tersisa
    }

    // Selaraskan indikator tab bawah & padding body spt saat switchTab('tambah') normal,
    // TANPA ikut memicu lazy-load tab lain/resetFormState kedua kalinya.
    updateBodyPaddingForTab_('tambah');
    updateNavActiveState('tambah');
  }

  // Kembalikan field Jenis ke kondisi normal (tampil lagi, grid 2 kolom) — dipanggil dari
  // resetFormState() supaya form Catat Transaksi yg dibuka lewat jalur NORMAL (bukan preset
  // dari speed-dial) tidak ikut kena efek openTransaksiPreset() dari sesi sebelumnya.
  function resetJenisPresetUI_() {

  function openPindahSaldoModal() {
    closeFabSpeedDial();

    setPindahSaldoModalMode_(false);

  // Dibuka dari kartu Pindah Saldo di Riwayat Transaksi (double-click/tap-hold detail ->
  // tombol Edit) -> modal yang SAMA dipakai, cuma field-nya di-prefill dari data transaksi
  // yang sedang diedit & tombol submit mengarah ke updatePindahSaldoServer().
  function openEditPindahSaldoModal(item) {
    closeFabSpeedDial();
    const modal = document.getElementById('modalPindahSaldo');
    if (!modal || !item) return;

    editingPindahSaldoId = item.id;
    setPindahSaldoModalMode_(true);

    populatePindahSaldoSelects_();

    // Sumber tersimpan dgn format "AkunA -> AkunB" (lihat pindahSaldoServer di controller.gs)
    const parts = String(item.sumber || '').split('->').map(s => s.trim());
    const sumberAwal = parts[0] || '';
    const tujuanAwal = parts[1] || '';
    const selSumber = document.getElementById('pindahSaldoSumber');
    const selTujuan = document.getElementById('pindahSaldoTujuan');
    if (selSumber) selSumber.value = sumberAwal;
    if (selTujuan) selTujuan.value = tujuanAwal;
    checkPindahSaldoRekeningSama_();

    const tglEl = document.getElementById('pindahSaldoTanggal');
    const tglStr = item.tanggalRaw || new Date().toLocaleDateString('en-CA');
    if (tglEl) {
      if (tglEl._flatpickr) tglEl._flatpickr.setDate(tglStr, true, 'Y-m-d');
      else tglEl.value = tglStr;
    }

    // Catatan opsional user tersimpan menempel di belakang Keterangan setelah tanda "—"
    // (lihat pindahSaldoServer(): `keterangan += " — " + catatanUser`) -> ekstrak balik.
    const catatanMatch = String(item.keterangan || '').match(/—\s*([\s\S]*)$/);
    const catatanEl = document.getElementById('pindahSaldoCatatan');
    if (catatanEl) catatanEl.value = catatanMatch ? catatanMatch[1].trim() : '';

    const nominalEl = document.getElementById('pindahSaldoNominal');
    if (nominalEl) nominalEl.value = item.nominal || 0;

    modal.classList.remove('hidden');
  }

  // FIX (peringatan sumber & tujuan sama, mis. "Ovo ke Ovo"): live-check tiap kali salah
  // satu dropdown Sumber/Tujuan berubah (dipasang via onchange di ViewTransaksi.html) — pola SAMA
  // PERSIS dgn checkBayarUtangSaldo_() (modal Bayar Cicilan/Lunasin, ViewUtang.html):
  // toggle warning box + disable tombol submit selama kondisi invalid. Dipanggil juga saat
  // modal dibuka/direset (openPindahSaldoModal(), populatePindahSaldoSelects_()) supaya
  // state warning/tombol selalu bersih di awal, bukan nyisa dari sesi buka-modal sebelumnya.
  function checkPindahSaldoRekeningSama_() {
    const warning = document.getElementById('pindahSaldoRekeningSamaWarning');
    const btnConfirm = document.getElementById('btnConfirmPindahSaldo');
    if (!warning || !btnConfirm) return true;

    const sumber = document.getElementById('pindahSaldoSumber')?.value;
    const tujuan = document.getElementById('pindahSaldoTujuan')?.value;
    const sama = Boolean(sumber) && Boolean(tujuan) && sumber === tujuan;

    warning.classList.toggle('hidden', !sama);
    btnConfirm.disabled = sama;
    return !sama;
  }

  // Isi dropdown Sumber & Tujuan dari cachedDompet.rekening (sama daftar akun dgn dropdown
  // "Sumber/Akun" form transaksi, lihat populateSumberAkun()) -> tidak perlu round-trip
  // server terpisah, dompet sudah selalu ter-cache duluan (lihat init di atas).
  function populatePindahSaldoSelects_() {
    const list = (cachedDompet && cachedDompet.rekening) ? cachedDompet.rekening.map(r => r.nama) : [];
    ['pindahSaldoSumber', 'pindahSaldoTujuan'].forEach((id, idx) => {
      const sel = document.getElementById(id);
      if (!sel) return;
      const current = sel.value;
      const placeholder = idx === 0 ? 'Pilih Rekening Sumber' : 'Pilih Rekening Tujuan';
      sel.innerHTML = `<option value="" disabled selected>${placeholder}</option>` + list.map(n => `<option value="${n}">${n}</option>`).join('');
      if (current) sel.value = current;
    });
    // FIX: rebuild innerHTML di atas TIDAK memicu event 'change' (assignment .value manual),
    // jadi warning "rekening sama" bisa nyisa stale kalau dipanggil ulang sementara modal
    // masih terbuka dgn pilihan lama (mis. cachedDompet berubah di background) -> re-check manual.
    checkPindahSaldoRekeningSama_();
  }

function handlePindahSaldoSubmit(event) {
    event.preventDefault();

    if (editingPindahSaldoId) {
      handleUpdatePindahSaldoSubmit_();
      return;
    }

    const tanggal = document.getElementById('pindahSaldoTanggal')?.value;
    const sumber = document.getElementById('pindahSaldoSumber')?.value;
    const tujuan = document.getElementById('pindahSaldoTujuan')?.value;
    const nominal = Number(document.getElementById('pindahSaldoNominal')?.value) || 0;
    const catatan = document.getElementById('pindahSaldoCatatan')?.value.trim();

    // ===== VALIDASI CLIENT-SIDE =====
    if (!sumber || !tujuan) { showToast('error', 'Pilih rekening sumber & tujuan.'); return; }
    if (sumber === tujuan) { showToast('error', 'Rekening sumber & tujuan tidak boleh sama.'); return; }
    if (nominal <= 0) { showToast('error', 'Nominal transfer harus lebih dari 0.'); return; }
    // Saldo rekening tidak boleh minus (nilai terendah 0) -> cek dulu di client pakai
    // cachedDompet biar user langsung dapat feedback, TANPA nunggu round-trip ke server
    // (server tetap validasi ulang di pindahSaldoServer sbg pertahanan terakhir).
    const akunSumber = (cachedDompet && cachedDompet.rekening) ? cachedDompet.rekening.find(r => r.nama === sumber) : null;
    if (akunSumber && Number(akunSumber.saldo || 0) - nominal < 0) {
      showToast('error', `Saldo "${sumber}" tidak cukup (Rp ${Number(akunSumber.saldo || 0).toLocaleString('id-ID')}).`);
      return;
    }

    const formData = { tanggal, sumberRekening: sumber, rekeningTujuan: tujuan, nominal, catatan };

    // ===== SNAPSHOT (utk rollback kalau server gagal) =====
    const snapshotDompet = cloneCache_(cachedDompet);
    const snapshotRiwayat = cloneCache_(cachedRiwayat);

    // ===== OPTIMISTIC UPDATE: mutasi instan cachedDompet + selipkan kartu riwayat "Pindah
    // Saldo" di urutan teratas (nilai field sama persis dgn yg dicatat sungguhan di
    // pindahSaldoServer, lihat controller.gs), UI 0ms delay =====
    applyDeltaCachedDompet_(sumber, -nominal);
    applyDeltaCachedDompet_(tujuan, nominal);
    if (cachedRiwayat && cachedRiwayat.data) {
      let keteranganOptimistic = `Pindah saldo : dari "${sumber}" -> "${tujuan}"`;
      if (catatan) keteranganOptimistic += ` — ${catatan}`;
      cachedRiwayat.data.unshift({
        id: 'temp-' + Date.now(), jenis: 'Pindah Saldo', kategori: 'Pindah Saldo',
        sumber: `${sumber} -> ${tujuan}`, keterangan: keteranganOptimistic, nominal
      });
    }

    closePindahSaldoModal();
    refreshVisibleUI_();
    showToast('success', 'Saldo berhasil dipindahkan!');

    // ===== KIRIM KE SERVER DI BACKGROUND =====
    google.script.run
      .withSuccessHandler(res => {
        if (res && res.status === 'success') {
          cachedDompet = res.dompet; // sinkronkan dgn saldo/timestamp asli dari server
          if (res.riwayat) cachedRiwayat = res.riwayat; // sinkronkan dgn ID/pagination asli
          refreshVisibleUI_();
        } else {
          cachedDompet = snapshotDompet; cachedRiwayat = snapshotRiwayat; // ROLLBACK
          refreshVisibleUI_();
          showToast('error', 'Gagal disimpan ke server, perubahan dibatalkan: ' + (res ? res.message : 'Error'));
        }
      })
      .withFailureHandler(err => {
        cachedDompet = snapshotDompet; cachedRiwayat = snapshotRiwayat; // ROLLBACK
        refreshVisibleUI_();
        showToast('error', 'Koneksi error, perubahan dibatalkan: ' + (err.message || err));
      })
      .pindahSaldoServer(formData, getRiwayatBatchPage_(), batchFetchLimit, getCurrentFilterParams());
}

  // Submit mode EDIT (editingPindahSaldoId terisi) -> panggil updatePindahSaldoServer().
  // TIDAK pakai optimistic update utk saldo Dompet (perhitungan delta lama vs baru lebih
  // rumit drpd tambah baru/hapus) -> tampilkan loading, tunggu payload asli dari server.
  function handleUpdatePindahSaldoSubmit_() {
    const id = editingPindahSaldoId;
    const tanggal = document.getElementById('pindahSaldoTanggal')?.value;
    const sumber = document.getElementById('pindahSaldoSumber')?.value;
    const tujuan = document.getElementById('pindahSaldoTujuan')?.value;
    const nominal = Number(document.getElementById('pindahSaldoNominal')?.value) || 0;
    const catatan = document.getElementById('pindahSaldoCatatan')?.value.trim();

    if (!sumber || !tujuan) { showToast('error', 'Pilih rekening sumber & tujuan.'); return; }
    if (sumber === tujuan) { showToast('error', 'Rekening sumber & tujuan tidak boleh sama.'); return; }
    if (nominal <= 0) { showToast('error', 'Nominal transfer harus lebih dari 0.'); return; }

    const formData = { id, tanggal, sumberRekening: sumber, rekeningTujuan: tujuan, nominal, catatan };
    const snapshotDompet = cloneCache_(cachedDompet);
    const snapshotRiwayat = cloneCache_(cachedRiwayat);

    closePindahSaldoModal();
    showToast('loading', 'Menyimpan perubahan...');

    google.script.run
      .withSuccessHandler(res => {
        hideToast();
        if (res && res.status === 'success') {
          cachedDompet = res.dompet;
          if (res.riwayat) cachedRiwayat = res.riwayat;
          refreshVisibleUI_();
          showToast('success', 'Pindah saldo berhasil diperbarui!');
        } else {
          cachedDompet = snapshotDompet; cachedRiwayat = snapshotRiwayat;
          refreshVisibleUI_();
          showToast('error', 'Gagal disimpan ke server, perubahan dibatalkan: ' + (res ? res.message : 'Error'));
        }
      })
      .withFailureHandler(err => {
        hideToast();
        cachedDompet = snapshotDompet; cachedRiwayat = snapshotRiwayat;
        refreshVisibleUI_();
        showToast('error', 'Koneksi error, perubahan dibatalkan: ' + (err.message || err));
      })
      .updatePindahSaldoServer(formData, getRiwayatBatchPage_(), batchFetchLimit, getCurrentFilterParams());
  }

  // FIX (warna nav "Budget" jadi biru): sebelumnya SEMUA tab aktif dipaksa `.text-primary`
  // (hijau) tanpa kecuali. Sekarang tab "budget" dikecualikan -> pakai `.text-blue-700`
  // supaya senada dgn warna utama baru tab ini (bg-blue-700), tab lain tetap hijau seperti
  // semula. Class biru itu WAJIB ikut dibersihkan di loop reset di atas, kalau tidak akan
  // "nyangkut" di tombol Budget saat user pindah ke tab lain.
  function updateNavActiveState(tabName) {
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.classList.remove('text-primary', 'text-blue-700', 'text-danger'); btn.classList.add('text-textSecondary');
      const icon = btn.querySelector('.material-symbols-outlined');
      if (icon) icon.style.fontVariationSettings = "'FILL' 0";
      // Pill neumorphic di belakang ikon (lihat .nav-icon-wrap di ViewCSS.html) ->
      // default semua jadi versi "timbul" (inactive/raised) dulu, nanti tab yg
      // dipilih di bawah di-override jadi versi "tertekan" (active/inset).
      const iconWrap = btn.querySelector('.nav-icon-wrap');
      if (iconWrap) { iconWrap.classList.remove('nav-icon-active'); iconWrap.classList.add('nav-icon-inactive'); }
    });

    const activeBtn = document.querySelector(`.nav-btn[data-tab="${tabName}"]`);
    if (activeBtn) {
      activeBtn.classList.remove('text-textSecondary');
      activeBtn.classList.add(tabName === 'budget' ? 'text-blue-700' : (tabName === 'utang' ? 'text-danger' : 'text-primary'));
      const icon = activeBtn.querySelector('.material-symbols-outlined');
      if (icon) icon.style.fontVariationSettings = "'FILL' 1";
      const iconWrap = activeBtn.querySelector('.nav-icon-wrap');
      if (iconWrap) { iconWrap.classList.remove('nav-icon-inactive'); iconWrap.classList.add('nav-icon-active'); }
    }
  }

  // ==========================================
  // NAV BERANDA: tab pindah INSTAN di setiap tap (0 delay, sama seperti nav Budget).
  // Deteksi double-tap TIDAK LAGI menunda perpindahan tab -> hanya menambahkan force
  // refresh di belakang layar kalau tap kedua datang cepat dalam window singkat.
  // ==========================================
  function handleHomeButtonClick() {
    goHomeInstant(); // selalu langsung pindah tab, tanpa menunggu jendela deteksi double-tap

    homeBtnTapCount++;
    clearTimeout(homeBtnTapTimer);
    if (homeBtnTapCount >= 2) {
      homeBtnTapCount = 0;
      goHomeForceRefresh();
      return;
    }
    homeBtnTapTimer = setTimeout(() => { homeBtnTapCount = 0; }, 350);
  }

  // SINGLE CLICK: switch tab ke 'riwayat' pakai batch yg sudah ada di memori, 0 request server.
  function goHomeInstant() {
    switchTab('riwayat');
    if (cachedAllRiwayatData.length > 0) {
      renderLocalRiwayatPage(currentPage || 1);
    } else {
      loadRiwayat(1); // fallback: belum ada apapun di cache (mis. baru pertama kali load)
    }
  }

  // 2x TAP CEPAT: tab sudah berpindah instan lewat goHomeInstant() di atas -> di sini
  // tinggal reset filter ke default + force refresh total dari server (riwayat & dompet).
  function goHomeForceRefresh() {
    if (isHomeForceRefreshing) return; // FIX: kalau masih ada request yg jalan, abaikan pemicu baru (cegah tabrakan)
    isHomeForceRefreshing = true;

    activeFilterJenis = 'Semua';
    document.querySelectorAll('#filterChips .chip-btn').forEach((btn, i) => {
      btn.className = i === 0
        ? "chip-btn active w-10 h-10 shrink-0 rounded-full bg-blue-700 text-white flex items-center justify-center shadow-sm border border-blue-700 transition-colors"
        : "chip-btn w-10 h-10 shrink-0 rounded-full bg-surface text-textSecondary flex items-center justify-center border border-gray-200 hover:bg-gray-100 hover:text-textPrimary transition-colors";
    });

    const searchInput = document.getElementById('searchInput');
    if (searchInput) searchInput.value = '';

    filterTipe = 'hari_ini'; filterStartDate = ''; filterEndDate = '';
    updateFilterActiveLabel();

    cachedAllRiwayatData = []; cachedBatchIndex = 0; // reset batch -> paksa fetch batch baru dari awal
    loadRiwayat(1, true);
    loadDompetServer(true);

    setTimeout(() => { isHomeForceRefreshing = false; }, 2000); // lepas guard setelah window wajar utk round-trip selesai
  }

  // ==========================================
  // FITUR: PENCARIAN & FILTER

  function handleSearchFilter() {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => {
      cachedAllRiwayatData = []; cachedBatchIndex = 0; // filter berubah -> batch lama tidak relevan lagi
      loadRiwayat(1, true);

  function setFilterJenis(jenis, el) {
    activeFilterJenis = jenis;
    document.querySelectorAll('#filterChips .chip-btn').forEach(btn => {
      btn.className = "chip-btn clay-chip clay-key-neutral w-10 h-10 shrink-0 bg-surface text-textSecondary flex items-center justify-center hover:bg-gray-100 hover:text-textPrimary transition-colors";

    // supaya beda dari Pemasukan yg tetap hijau primary (clay-key-blue -> shadow chip ikut

  function getCurrentFilterParams() {
    return {
      tipe: filterTipe,
      startDate: filterStartDate,
      endDate: filterEndDate,
      jenis: activeFilterJenis,
      search: (document.getElementById('searchInput')?.value || '').toLowerCase().trim()
    };
  }

  function updateFilterSubtitles() {
    const today = new Date();
    const d7 = new Date(today); d7.setDate(d7.getDate() - 7);
    const d30 = new Date(today); d30.setDate(d30.getDate() - 30);
    const elHariIni = document.getElementById('subtitleHariIni');
    const el7 = document.getElementById('subtitle7hari');
    const el30 = document.getElementById('subtitle30hari');
    if (elHariIni) elHariIni.textContent = formatTanggalIndo(today);
    if (el7) el7.textContent = `${formatTanggalIndo(d7)} - ${formatTanggalIndo(today)}`;
    if (el30) el30.textContent = `${formatTanggalIndo(d30)} - ${formatTanggalIndo(today)}`;
  }

  function updateFilterActiveLabel() {
    const label = document.getElementById('filterActiveLabel');
    if (!label) return;
    const map = { hari_ini: 'Hari Ini', semua: 'Semua Transaksi', '7hari': '7 Hari Terakhir', '30hari': '30 Hari Terakhir' };
    if (filterTipe === 'custom' && filterStartDate && filterEndDate) {
      const [ys, ms, ds] = filterStartDate.split('-');
      const [ye, me, de] = filterEndDate.split('-');
      label.textContent = `${ds}/${ms} - ${de}/${me}`;
    } else {
      label.textContent = map[filterTipe] || 'Filter';
    }
  }

  function openFilterModal() {
    updateFilterSubtitles();
    document.querySelectorAll('input[name="filterTipeModal"]').forEach(r => { r.checked = (r.value === filterTipe); });
    // FIX: field custom periode sekarang cuma 1 input mode "range" (#filterRangeDate) ->
    // sinkron nilai lewat fp.setDate([start, end]), BUKAN assignment .value biasa (flatpickr
    // range butuh kedua tanggal sekaligus supaya kalender & altInput ikut ter-render benar).
    const rangeEl = document.getElementById('filterRangeDate');
    const rangeFp = rangeEl && rangeEl._flatpickr;
    if (rangeFp) {
      if (filterStartDate && filterEndDate) rangeFp.setDate([filterStartDate, filterEndDate], false);
      else rangeFp.clear();
    }
    toggleCustomDateInputs();
    document.getElementById('filterModal')?.classList.remove('hidden');
  }

  function closeFilterModal() { document.getElementById('filterModal')?.classList.add('hidden'); }

  function toggleCustomDateInputs() {
    const selected = document.querySelector('input[name="filterTipeModal"]:checked')?.value;
    document.getElementById('customDateWrap')?.classList.toggle('hidden', selected !== 'custom');
  }

  function terapkanFilter() {
    const selected = document.querySelector('input[name="filterTipeModal"]:checked')?.value || 'semua';
    if (selected === 'custom') {
      // FIX: baca 2 tanggal terpilih dari instance flatpickr mode "range" (#filterRangeDate)
      // -> fp.selectedDates berisi [Date awal, Date akhir] setelah user klik kedua ujung
      // rentang. Diformat manual ke "yyyy-mm-dd" (bukan pakai fp.input.value) supaya format
      // tetap sama persis dgn kode lama (yg dibaca banyak tempat lain, mis. loadRiwayat()).
      const rangeEl = document.getElementById('filterRangeDate');
      const rangeFp = rangeEl && rangeEl._flatpickr;
      const dates = rangeFp ? rangeFp.selectedDates : [];
      if (!dates || dates.length < 2) { showToast('error', 'Pilih periode Dari dan Hingga.'); return; }
      const toYMD = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      filterStartDate = toYMD(dates[0]);
      filterEndDate = toYMD(dates[1]);
    } else {
      filterStartDate = ''; filterEndDate = '';
    }
    filterTipe = selected;
    updateFilterActiveLabel();
    closeFilterModal();
    cachedAllRiwayatData = []; cachedBatchIndex = 0; // filter berubah -> batch lama tidak relevan lagi
    loadRiwayat(1, true);
  }

  // ==========================================
  // LOAD & RENDER RIWAYAT KAS
  // ==========================================
  // OPTIMASI PAGINATION: server diminta 50 transaksi SEKALIGUS (batchFetchLimit, bukan 10)
  // per fetch, lalu 50 item itu dipecah jadi 5 "halaman" @10 item DI MEMORI JS
  // (renderLocalRiwayatPage()) -> pindah antar halaman 1-5 dalam batch yg sama jadi INSTAN,
  // tanpa loading/round-trip ke server sama sekali. Baru begitu user melewati batas batch
  // (mis. dari halaman 5 ke 6) atau filter/pencarian berubah, fetch baru ke server dipicu.
  function loadRiwayat(page, forceRefresh = false) {
    const targetBatchIndex = Math.floor((page - 1) / pagesPerBatch);

    // 1. BATCH YG DIBUTUHKAN SUDAH ADA DI MEMORI & bukan force-refresh -> slice & render
    //    langsung, 0 request ke server.
    if (!forceRefresh && cachedAllRiwayatData.length > 0 && targetBatchIndex === cachedBatchIndex) {
      renderLocalRiwayatPage(page);
      return;
    }

    // 2. Batch belum ada / beda batch / filter berubah -> fetch 1 batch (50 item) dari server.
    currentPage = page;
    const container = document.getElementById('riwayatList');
    if (container) container.innerHTML = '<div class="flex flex-col items-center justify-center gap-3 py-10 text-slate-500 text-sm"><div class="riwayat-dot-spinner" aria-hidden="true"><div class="riwayat-dot-spinner__dot"></div><div class="riwayat-dot-spinner__dot"></div><div class="riwayat-dot-spinner__dot"></div><div class="riwayat-dot-spinner__dot"></div><div class="riwayat-dot-spinner__dot"></div><div class="riwayat-dot-spinner__dot"></div><div class="riwayat-dot-spinner__dot"></div><div class="riwayat-dot-spinner__dot"></div></div><span>Memuat riwayat kas...</span></div>';

    // serverPage dihitung dari targetBatchIndex (BUKAN selalu 1) -> supaya batch ke-2/3/dst
    // yg benar ikut diminta ke getRiwayatKasServer() saat user melewati 50 item pertama.
    const serverPage = targetBatchIndex + 1;

    google.script.run
      .withSuccessHandler(res => {
        if (res && res.status === 'success') {
          const data = res.data || [];
          // Batch kosong padahal BUKAN batch pertama -> ternyata user sudah melewati transaksi
          // terakhir yg tersedia (bisa terjadi krn halaman "buka peluang next" di bawah meleset,
          // lihat cachedBatchIsLast). Batalkan navigasi, koreksi total halaman turun, tetap di
          // halaman terakhir yg valid -> BUKAN nampilkan "data tidak ditemukan" yg menyesatkan.
          if (data.length === 0 && targetBatchIndex > 0) {
            cachedBatchIsLast = true; // sekarang PASTI: batch yg sudah di-cache adalah batch terakhir
            const lastValidPage = cachedBatchIndex * pagesPerBatch + (Math.ceil(cachedAllRiwayatData.length / limitPerPage) || 1);
            renderLocalRiwayatPage(lastValidPage);
            return;
          }
          cachedRiwayat = res;
          cachedAllRiwayatData = data;
          cachedBatchIndex = targetBatchIndex;
          // "Batch terakhir" kalau isinya kurang dari limit (pasti habis) ATAU server bilang
          // halaman batch ini sudah >= totalPages versi dia (jaga2 kasus total item pas
          // kelipatan 50 persis, spy tdk perlu 1 fetch tambahan cuma utk konfirmasi "abis").
          cachedBatchIsLast = data.length < batchFetchLimit || serverPage >= (res.totalPages || 1);
          renderLocalRiwayatPage(page);
        } else {
          if (container) container.innerHTML = `<div class="text-center text-red-500 py-10 text-sm">Gagal memuat: ${res ? res.message : 'Error'}</div>`;
        }
      })
      .withFailureHandler(err => {
        if (container) container.innerHTML = `<div class="text-center text-red-500 py-10 text-sm">Koneksi error: ${err.message || err}</div>`;
      })
      .getRiwayatKasServer(serverPage, batchFetchLimit, getCurrentFilterParams());
  }

  // Ambil "halaman server" (basis batch 50 item) yg merepresentasikan batch yg SEDANG
  // di-cache -> dipakai saat sinkronisasi ke server (tambah/edit/hapus transaksi, rename/
  // hapus rekening) supaya server diminta refetch BATCH yg sama (50 item), bukan cuma
  // 10 item halaman UI yg sedang aktif -> instant-paging antar 5 halaman tetap jalan
  // setelah sinkronisasi tsb.
  function getRiwayatBatchPage_() { return cachedBatchIndex + 1; }

  // Memecah batch (maks 50 item) yg sedang di-cache jadi halaman @10 item -> dipanggil setiap
  // pindah halaman DALAM batch yg sama (instan), maupun setelah batch baru selesai di-fetch,
  // maupun setelah optimistic update (tambah/edit/hapus) via refreshVisibleUI_().
  function renderLocalRiwayatPage(page) {
    currentPage = page;
    const pageInBatch = ((page - 1) % pagesPerBatch) + 1; // posisi halaman ini di dalam batch (1..5)
    const startIndex = (pageInBatch - 1) * limitPerPage;
    const pageItems = cachedAllRiwayatData.slice(startIndex, startIndex + limitPerPage);

    const batchPages = Math.ceil(cachedAllRiwayatData.length / limitPerPage) || 1;
    // Kalau batch ini BELUM PASTI batch terakhir, "gantungkan" 1 halaman ekstra supaya
    // tombol/dot berikutnya tetap bisa diklik -> nanti otomatis dikoreksi begitu batch
    // selanjutnya benar2 di-fetch & ternyata sudah habis/kurang dari 50 (lihat loadRiwayat()).
    riwayatTotalPages = cachedBatchIndex * pagesPerBatch + batchPages + (cachedBatchIsLast ? 0 : 1);

    renderRiwayatUI(pageItems);
    renderPaginationUI(riwayatTotalPages, currentPage);
    fitRiwayatListViewport_();
  }

  function renderRiwayatResult(res) {
    // Dipakai utk: (a) initial load (__INITIAL_RIWAYAT__), (b) refreshVisibleUI_() setelah
    // optimistic update (tambah/edit/hapus transaksi, rename/hapus rekening) -> cachedRiwayat
    // (berisi 1 batch, sudah dimutasi di memori kalau optimistic) di sini disalin jadi batch
    // aktif & di-render ulang di HALAMAN YG SAMA (currentPage TIDAK direset ke 1), supaya user
    // tidak "terlempar" dari halaman yg sedang dilihat cuma gara2 nambah/edit/hapus 1 transaksi.
    cachedRiwayat = res;
    if (res && res.status === 'success') {
      cachedAllRiwayatData = res.data || [];
      cachedBatchIsLast = cachedAllRiwayatData.length < batchFetchLimit;
      renderLocalRiwayatPage(currentPage || 1);
    } else {
      const container = document.getElementById('riwayatList');
      if (container) container.innerHTML = `<div class="text-center text-red-500 py-10 text-sm">Gagal memuat: ${res ? res.message : 'Error'}</div>`;
    }
  }

  // FIX RELASI DATA (RENAME): keterangan transaksi yang akunnya baru diganti nama disisipi
  // penanda "(akun diganti: ...)" oleh backend (renameSumberTransaksi_ di controller.gs).
  // Helper ini memisahkan penanda tsb dari teks keterangan asli, supaya bisa dirender
  // sebagai badge notifikasi terpisah (bukan nempel jadi satu kalimat panjang di judul kartu).
  function extractRenameNotice_(keterangan) {
    const regex = /\(akun diganti:\s*"(.+?)"\s*->\s*"(.+?)",\s*(\d{2}\/\d{2}\/\d{4})\)\s*$/i;
    const teks = String(keterangan || '');
    const match = teks.match(regex);
    if (!match) return { clean: teks, notice: null };
    return {
      clean: teks.replace(regex, '').trim(),
      notice: { dari: match[1], ke: match[2], tanggal: match[3] }
    };
  }

  function renderRiwayatUI(data) {
    const container = document.getElementById('riwayatList');
    if (!container) return;
    document.getElementById('optimistic-loading')?.remove();

    if (!data || data.length === 0) {
      container.innerHTML = '<div class="text-center text-slate-500 py-10 text-sm">Data transaksi tidak ditemukan.</div>';
      return;
    }

    container.innerHTML = data.map(item => {
      const isPemasukan = (String(item.jenis).toLowerCase() === 'pemasukan' || String(item.jenis).toLowerCase() === 'pendapatan');
      const isPindahSaldo = String(item.jenis).toLowerCase() === 'pindah saldo';
      // "Pindah Saldo" bukan Pemasukan maupun Pengeluaran -> warna biru netral (clay-key-blue,
      // token sudah ada & dipakai jg di FAB/modal Pindah Saldo, lihat DESIGN-MEMORY.md), TANPA
      // tanda +/- di depan nominal (saldo cuma berpindah antar akun, bukan nambah/berkurang
      // dari sistem keuangan secara keseluruhan).
      const sign = isPindahSaldo ? '' : (isPemasukan ? '+' : '-');
      const color = isPindahSaldo ? 'text-blue-600' : (isPemasukan ? 'text-emerald-600' : 'text-red-500');
      const bg = isPindahSaldo ? 'bg-blue-50' : (isPemasukan ? 'bg-emerald-100' : 'bg-red-50');
      const icon = isPindahSaldo ? 'sync_alt' : (isPemasukan ? 'trending_up' : 'trending_down');
      // Kunci shadow clay per kartu ikut jenis transaksi (Claymorphism.md §4: shadow warna
      // wajib mengikuti hue permukaannya) — hijau utk Pemasukan, merah utk Pengeluaran, biru
      // utk Pindah Saldo.
      const clayKey = isPindahSaldo ? 'clay-key-blue' : (isPemasukan ? 'clay-key-primary' : 'clay-key-danger');
      const { clean: keteranganBersih, notice: renameNotice } = extractRenameNotice_(item.keterangan);

      return `<div onclick="toggleDeleteBtn(this)"
           ondblclick="handleCardDoubleTap('${item.id}', this)"
           ontouchstart="handleLongPressStart(event, '${item.id}', this)"
           ontouchmove="handleLongPressMove(event)"
           ontouchend="handleLongPressEnd(event, this)"
           data-item='${JSON.stringify(item).replace(/'/g, "&apos;")}'
           data-pindah-saldo="${isPindahSaldo}"
           class="tx-card-item clay clay-card ${clayKey} relative bg-white p-4 flex items-center justify-between gap-3 transition-all cursor-pointer select-none mb-3">

          <div class="flex items-center gap-3 flex-1 min-w-0">
            <div class="clay-icon-tile ${clayKey} w-10 h-10 rounded-full ${bg} flex items-center justify-center shrink-0">
              <span class="material-symbols-outlined ${color} text-[20px]">${icon}</span>
            </div>
            <div class="flex-1 min-w-0">
              <h3 class="font-semibold text-slate-800 text-[15px] truncate mb-0.5">${keteranganBersih || item.kategori || 'Tanpa Keterangan'}</h3>
              <div class="flex items-center gap-2 text-xs text-slate-500">
                <span class="font-medium">${formatTanggalRelatif(item.tanggal)}</span>
                <span class="w-1 h-1 rounded-full bg-slate-300"></span>
                <span class="truncate">${item.kategori || '-'}</span>
              </div>
              ${renameNotice ? `<div class="mt-1.5 inline-flex items-center gap-1 text-[10px] font-medium text-amber-700 bg-amber-50 border border-amber-200 rounded-full px-2 py-0.5">
                <span class="material-symbols-outlined text-[12px]">sync_alt</span>
                <span>Akun diganti: ${renameNotice.dari} &rarr; ${renameNotice.ke}</span>
              </div>` : ''}
            </div>
          </div>
          <div class="text-right shrink-0 flex flex-col items-end">
            <p class="font-bold ${color} text-[15px] mb-0.5">${sign}Rp ${Number(item.nominal || 0).toLocaleString('id-ID')}</p>
            <p class="text-[10px] text-slate-400">${item.sumber || 'Tunai'}</p>
          </div>
          <button onclick="${isPindahSaldo ? `openDeletePindahSaldoModal('${item.id}', event)` : `openDeleteModal('${item.id}', event)`}" class="delete-btn-action hidden shrink-0 ml-2 w-9 h-9 rounded-full bg-red-500 hover:bg-red-600 text-white flex items-center justify-center transition-all">
            <span class="material-symbols-outlined text-[20px]">delete</span>
          </button>
        </div>
      `;
    }).join('');
  }

  // Gaya pagination disamakan dgn tab Utang & Cicilan (panah + titik halaman, lihat
  // .riwayat-pagination-* di ViewCSS.html) — beda dr Utang, di sini tiap "batch" 50 item
  // di-FETCH dari server (getRiwayatKasServer(page,...) via loadRiwayat()), tapi 5 halaman
  // UI @10 item DALAM 1 batch yg sama dipecah & dirender instan dari memori (lihat
  // renderLocalRiwayatPage()) -> klik dot/panah TETAP cukup panggil loadRiwayat(page), fungsi
  // itu sendiri yg menentukan perlu fetch server atau cukup slice dari cache. Kalau halaman
  // terlalu banyak (>7) titik-titik diringkas jadi teks "Halaman x/y" saja spy tidak
  // membanjiri layar dgn dot.
  function renderPaginationUI(totalPages, current) {
    const controls = document.getElementById('paginationControls');
    if (!controls) return;
    if (!totalPages || totalPages <= 1) { controls.innerHTML = ''; return; }

    const prevDisabled = current <= 1 ? 'disabled' : '';
    const nextDisabled = current >= totalPages ? 'disabled' : '';

    let middle;
    // Konsisten: SELALU pakai teks "Halaman x/y" (bukan titik²), pola sama dgn
    // yg sebelumnya dipakai saat total halaman >7 — tidak bergantung jumlah halaman,
    // jadi pagination tampil seragam di semua kondisi (FIX ketidakkonsistenan).
    middle = `<span class="text-[11px] font-medium text-slate-400">Halaman ${current}/${totalPages}</span>`;

    controls.innerHTML = `
      <button type="button" aria-label="Halaman sebelumnya" onclick="loadRiwayat(${current - 1})" class="riwayat-pagination-arrow clay-pagination-arrow" ${prevDisabled}>
        <span class="material-symbols-outlined text-[18px]">chevron_left</span>
      </button>
      ${middle}
      <button type="button" aria-label="Halaman berikutnya" onclick="loadRiwayat(${current + 1})" class="riwayat-pagination-arrow clay-pagination-arrow" ${nextDisabled}>
        <span class="material-symbols-outlined text-[18px]">chevron_right</span>
      </button>`;
  }

  // ==========================================
  // RIWAYAT: tinggi list "pas layar" + SWIPE gaya tab Utang
  // ==========================================
  // #riwayatList SENGAJA tidak diberi max-height tetap (beda2 tiap device) — dihitung dari
  // sisa ruang viewport (dikurangi posisi list itu sendiri & tinggi nav bawah), mirip
  // fitUtangViewport() tapi lebih sederhana krn di sini cuma 1 kotak scroll, bukan "halaman"
  // yg dipecah² dari 1 array client. Kalau 10 transaksi muat di ruang yg tersedia -> tidak
  // ada scroll sama sekali; kalau tidak muat -> overflow-y:auto otomatis memunculkan scroll
  // HANYA pada list ini, sisa halaman tetap tanpa efek overflow.
  function fitRiwayatListViewport_() {
    const list = document.getElementById('riwayatList');
    const viewSection = document.getElementById('viewRiwayat');
    if (!list || !viewSection || !viewSection.classList.contains('active')) return;
    const nav = document.querySelector('nav');
    const navH = nav ? nav.getBoundingClientRect().height : 80;
    const navGap = window.innerWidth >= 768 ? 28 : 16;
    const top = list.getBoundingClientRect().top;
    const viewportHeight = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
    const available = viewportHeight - top - navH - navGap;
    list.style.maxHeight = Math.max(available, 200) + 'px';
    list.style.overflowY = 'auto';
  }
  let riwayatResizeTimer_ = null;
  function scheduleRiwayatReflow_(delay) {
    clearTimeout(riwayatResizeTimer_);
    riwayatResizeTimer_ = setTimeout(fitRiwayatListViewport_, delay || 200);
  }
  window.addEventListener('resize', () => scheduleRiwayatReflow_(200));
  window.addEventListener('orientationchange', () => scheduleRiwayatReflow_(250));
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', () => scheduleRiwayatReflow_(120));
  }

  // Swipe kiri = halaman berikutnya, swipe kanan = halaman sebelumnya — pola & threshold
  // sama dgn initUtangSwipe_() (lihat komentar lengkap di sana), tapi beda pendekatan krn
  // tiap "halaman" di sini adalah fetch server baru (bukan array yg sudah ada di client):
  // TIDAK ada live drag 1:1 mengikuti jari (tidak ada konten halaman sebelah utk digeser
  // bareng), sebagai gantinya list digeser dikit sbg umpan-balik visual + efek "rubber-band"
  // di ujung, lalu saat lepas jari & lewat ambang -> list di-geser keluar layar ke arah
  // swipe, loadRiwayat() dipanggil, & saat data baru datang list masuk lagi dari sisi
  // berlawanan. Variabel state SENGAJA beda nama dr touchStartX/Y (dipakai long-press per
  // kartu) supaya tidak saling menimpa; listener dipasang sekali via flag _swipeBound &
  // TIDAK memanggil preventDefault/stopPropagation supaya tap/long-press per kartu & scroll
  // vertikal (touch-action:pan-y) tetap berfungsi normal.
  let riwayatSwipeStartX = null;
  let riwayatSwipeStartY = null;
  let riwayatSwipeDragging = false;
  let riwayatSwipeDeltaPx = 0;

  function initRiwayatSwipe_() {
    const el = document.getElementById('riwayatList');
    if (!el || el._swipeBound) return;
    el._swipeBound = true;
    el.style.touchAction = 'pan-y';

    el.addEventListener('touchstart', (e) => {
      if (!e.touches || e.touches.length !== 1) { riwayatSwipeStartX = null; riwayatSwipeStartY = null; return; }
      riwayatSwipeStartX = e.touches[0].clientX;
      riwayatSwipeStartY = e.touches[0].clientY;
      riwayatSwipeDragging = false;
      riwayatSwipeDeltaPx = 0;
    }, { passive: true });

    el.addEventListener('touchmove', (e) => {
      if (riwayatSwipeStartX === null || !e.touches || e.touches.length !== 1) return;
      const touch = e.touches[0];
      const diffX = touch.clientX - riwayatSwipeStartX;
      const diffY = touch.clientY - riwayatSwipeStartY;

      if (!riwayatSwipeDragging) {
        if (Math.abs(diffX) < 8 && Math.abs(diffY) < 8) return;
        if (Math.abs(diffX) <= Math.abs(diffY)) { riwayatSwipeStartX = null; return; } // vertical -> biarkan scroll native
        riwayatSwipeDragging = true;
        el.style.transition = 'none';
      }

      riwayatSwipeDeltaPx = diffX;
      let deltaPx = diffX;
      if ((currentPage <= 1 && deltaPx > 0) || (currentPage >= riwayatTotalPages && deltaPx < 0)) {
        deltaPx *= 0.35; // rubber-band di halaman pertama/terakhir
      }
      el.style.transform = `translateX(${deltaPx}px)`;
      el.style.opacity = String(Math.max(0.5, 1 - Math.abs(deltaPx) / 400));
    }, { passive: true });

    el.addEventListener('touchend', () => {
      const wasDragging = riwayatSwipeDragging;
      const deltaPx = riwayatSwipeDeltaPx;
      riwayatSwipeStartX = null; riwayatSwipeStartY = null;
      riwayatSwipeDragging = false; riwayatSwipeDeltaPx = 0;
      if (!wasDragging) return;

      const SWIPE_MIN_DIST = 42;
      let targetPage = currentPage;
      if (deltaPx <= -SWIPE_MIN_DIST) targetPage = currentPage + 1; // swipe kiri -> halaman berikutnya
      else if (deltaPx >= SWIPE_MIN_DIST) targetPage = currentPage - 1; // swipe kanan -> halaman sebelumnya

      el.style.transition = 'transform .25s ease, opacity .25s ease';
      if (targetPage !== currentPage && targetPage >= 1 && targetPage <= riwayatTotalPages) {
        const dir = targetPage > currentPage ? -1 : 1;
        el.style.transform = `translateX(${dir * 60}px)`;
        el.style.opacity = '0';
        setTimeout(() => {
          loadRiwayat(targetPage);
          el.style.transition = 'none';
          el.style.transform = `translateX(${-dir * 40}px)`;
          void el.offsetHeight;
          el.style.transition = 'transform .25s ease, opacity .25s ease';
          el.style.transform = 'translateX(0)';
          el.style.opacity = '1';
        }, 180);
      } else {
        el.style.transform = 'translateX(0)';
        el.style.opacity = '1';
      }
    }, { passive: true });

    el.addEventListener('touchcancel', () => {
      riwayatSwipeStartX = null; riwayatSwipeStartY = null;
      if (riwayatSwipeDragging) {
        riwayatSwipeDragging = false; riwayatSwipeDeltaPx = 0;
        el.style.transition = 'transform .25s ease, opacity .25s ease';
        el.style.transform = 'translateX(0)';
        el.style.opacity = '1';
      }
    }, { passive: true });
  }

  function getFullSyncPayloadServer(page, limit, filterParams) {
    return { status: 'success', riwayat: getRiwayatKasServer(page, limit, filterParams), dompet: getDompetServer() };
  }

  // ==========================================
  // LOAD & RENDER DOMPET (BUDGET)
  // ==========================================
  function loadDompetServer(forceRefresh) {
    // OPTIMASI: kalau sudah pernah dimuat & tidak diminta refresh paksa, render dari JS memory
    // langsung (0 latency, tanpa round-trip ke server). Cache hanya di-invalidate oleh CRUD.
    if (!forceRefresh && cachedDompet) {
      renderDompetUI(cachedDompet);
      return;
    }

    const container = document.getElementById('rekeningList');
    if (container) container.innerHTML = `<div class="text-center text-textSecondary py-10 text-sm animate-pulse">Memuat rekening...</div>`;

    google.script.run
      .withSuccessHandler(res => {
        if (!res || res.status !== 'success') {
          if (container) container.innerHTML = `<div class="text-center text-red-500 py-6 text-sm">Gagal memuat data: ${res ? res.message : 'Error'}</div>`;
          return;
        }
        cachedDompet = res; // simpan ke JS memory
        renderDompetUI(cachedDompet);
      })
      .withFailureHandler(err => {
        if (container) container.innerHTML = `<div class="text-center text-red-500 py-6 text-sm">Koneksi error: ${err.message || err}</div>`;
      })
      .getDompetServer();
  }

  // Render murni dari data yang sudah ada (cache atau response baru) -> dipisah dari loadDompetServer
  // supaya bisa dipanggil ulang instan tanpa perlu hit server lagi.
  function renderDompetUI(res) {
    const totalEl = document.getElementById('totalSaldoBudget');
    const lastUpdEl = document.getElementById('lastUpdatedBudget');

    if (totalEl) totalEl.textContent = 'Rp ' + Number(res.totalSaldo).toLocaleString('id-ID');
    if (lastUpdEl) {
       const d = res.lastUpdated ? new Date(res.lastUpdated) : null;
       lastUpdEl.textContent = d && !isNaN(d.getTime()) ? `Terakhir diperbarui: ${d.toLocaleDateString('id-ID')} ${d.toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'})}` : 'Terakhir diperbarui: -';
    }
    // List rekening dirender sbg CARD STACK (bukan pagination lagi, lihat renderRekeningStack_())
    // -> rekeningStackIndex TIDAK direset ke 0 di sini, supaya user tidak "terlempar" balik ke
    // kartu paling atas cuma gara2 optimistic update (tambah/edit/hapus 1 rekening).
    renderRekeningStack_();
  }

  // ==========================================
  // BUDGET: CARD STACK SLIDER (HORIZONTAL) — pengganti pagination
  // ==========================================
  // Semua kartu rekening DIRENDER SEKALIGUS ke DOM (jumlah rekening biasanya kecil, jadi
  // aman scr performa) & POSISINYA (bukan kontennya) yg diubah tiap pindah kartu — supaya CSS
  // transition pada transform/opacity bisa jalan mulus tanpa perlu bikin/hapus elemen tiap
  // swipe (lihat applyRekeningStackTransform_()). Hanya kartu PALING ATAS (delta 0, sesuai
  // rekeningStackIndex) yg pointer-events aktif -> otomatis jadi satu²nya kartu yg menerima
  // sentuhan/klik, kartu di belakangnya sekadar "mengintip" utk efek tumpukan.
  let rekeningStackIndex = 0; // index kartu yg sedang di depan (0-based)
  const REKENING_STACK_PEEK = 3; // maks kartu di belakang yg ikut "mengintip"

  function renderRekeningStack_() {
    const container = document.getElementById('rekeningList');
    if (!container) return;
    const list = (cachedDompet && cachedDompet.rekening) ? cachedDompet.rekening : [];

    if (rekeningStackIndex > list.length - 1) rekeningStackIndex = Math.max(0, list.length - 1);
    if (rekeningStackIndex < 0) rekeningStackIndex = 0;

    container.innerHTML = list.length
      ? list.map((r, i) => renderRekeningCard(r, i)).join('')
      : `<div class="text-center text-slate-500 py-10 text-sm">Belum ada rekening.</div>`;

    if (list.length) applyRekeningStackTransform_(false); // posisi awal LANGSUNG tanpa transisi, hindari "kartu terbang" saat render pertama/ganti tab
    renderRekeningStackIndicator_(rekeningStackIndex, list.length);
    fitRekeningListViewport_();
  }

  // Hitung & terapkan transform/opacity/z-index tiap kartu berdasar jaraknya (delta) dari
  // rekeningStackIndex -> delta<0 kartu sudah "dilewati" (digeser ke KIRI, siap muncul lagi
  // kalau user swipe-kanan/mundur), delta 0 kartu depan (aktif), delta 1..PEEK kartu
  // mengintip di KANANnya (makin kecil & pudar makin jauh), delta>PEEK disembunyikan total.
  // FIX (loop rekening 6/6 -> 1/6 & sebaliknya): delta dihitung SIRKULER (jarak terpendek
  // mengelilingi total kartu, bukan selisih indeks mentah) supaya kartu terakhir & pertama
  // dianggap "bersebelahan" dlm lingkaran -> transisi wrap-around tetap terasa 1 arah yg
  // konsisten dgn arah swipe, bukan "melompat" ke ujung berlawanan.
  function applyRekeningStackTransform_(animate) {
    const container = document.getElementById('rekeningList');
    if (!container) return;
    const cards = container.querySelectorAll('.rekening-stack-card');
    const total = cards.length;
    cards.forEach(card => {
      const i = Number(card.getAttribute('data-index'));
      let delta = i - rekeningStackIndex;
      if (total > 2) {
        if (delta > total / 2) delta -= total;
        if (delta < -total / 2) delta += total;
      }
      card.style.transition = animate ? 'transform .32s cubic-bezier(.22,.61,.36,1), opacity .32s ease' : 'none';
      if (delta < 0) {
        card.style.transform = 'translateX(-115%) scale(0.94)';
        card.style.opacity = '0';
        card.style.zIndex = 10;
        card.style.pointerEvents = 'none';
      } else if (delta === 0) {
        card.style.transform = 'translateX(0) scale(1)';
        card.style.opacity = '1';
        card.style.zIndex = 100;
        card.style.pointerEvents = 'auto';
      } else if (delta <= REKENING_STACK_PEEK) {
