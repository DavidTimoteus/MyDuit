        card.style.transform = `translateX(${delta * 14}px) scale(${1 - delta * 0.045})`;
        card.style.opacity = String(1 - delta * 0.18);
        card.style.zIndex = 100 - delta;
        card.style.pointerEvents = 'none';
      } else {
        card.style.transform = `translateX(${REKENING_STACK_PEEK * 14}px) scale(${1 - REKENING_STACK_PEEK * 0.045})`;
        card.style.opacity = '0';
        card.style.zIndex = 1;
        card.style.pointerEvents = 'none';
      }
    });
  }

  function goToRekeningStack_(index) {
    const list = (cachedDompet && cachedDompet.rekening) ? cachedDompet.rekening : [];
    if (!list.length) return;
    if (index < 0) index = 0;
    if (index > list.length - 1) index = list.length - 1;
    if (index === rekeningStackIndex) return;
    rekeningStackIndex = index;
    applyRekeningStackTransform_(true);
    renderRekeningStackIndicator_(rekeningStackIndex, list.length);
  }
  // FIX (loop): next dari kartu TERAKHIR kembali ke kartu PERTAMA (bukan berhenti), begitu
  // jg prev dari kartu PERTAMA kembali ke kartu TERAKHIR -> stack jadi carousel melingkar.
  function nextRekeningStack_() {
    const list = (cachedDompet && cachedDompet.rekening) ? cachedDompet.rekening : [];
    if (!list.length) return;
    goToRekeningStack_(rekeningStackIndex >= list.length - 1 ? 0 : rekeningStackIndex + 1);
  }
  function prevRekeningStack_() {
    const list = (cachedDompet && cachedDompet.rekening) ? cachedDompet.rekening : [];
    if (!list.length) return;
    goToRekeningStack_(rekeningStackIndex <= 0 ? list.length - 1 : rekeningStackIndex - 1);
  }

  // Indikator posisi (dot ≤7 rekening, teks "x/y" kalau lebih) + tombol panah kiri/kanan ->
  // bentuknya DISAMAKAN dgn renderPaginationUI() tab Riwayat/Transaksi (lihat
  // .rekening-pagination-* di ViewCSS.html, struktur identik .riwayat-pagination-*, cuma
  // hue biru). Dipakai jg oleh desktop/non-touch (klik panah) selain swipe langsung di
  // kartu. FIX: sebelumnya fungsi ini nulis ke id yg tidak pernah ada di ViewBudget.html
  // (#rekeningDotsContainer/#btnPrevRekening/#btnNextRekening) & baca variabel yg tidak
  // pernah dideklarasikan (rekeningTotalPages/rekeningCurrentPage) -> silent no-op,
  // #rekeningPaginationControls selalu kosong. Sekarang render ke #rekeningPaginationControls
  // (id yg BENAR2 ada di ViewBudget.html) pakai parameter yg sudah dikirim si pemanggil
  // (index 0-based & total item, lihat renderRekeningStack_()/goToRekeningStack_()). Beda dgn
  // Riwayat/Utang: stack rekening MELINGKAR/loop, jadi panah TIDAK pernah disabled kecuali
  // cuma 1 rekening.
  function renderRekeningStackIndicator_(indexZeroBased, total) {
    const controls = document.getElementById('rekeningPaginationControls');
    if (!controls) return;
    if (!total || total <= 1) { controls.innerHTML = ''; return; }

    const current = indexZeroBased + 1; // tampilan 1-based, samakan dgn renderPaginationUI
    const arrowDisabled = total <= 1 ? 'disabled' : '';

    let middle;
    if (total <= 7) {
      middle = `<div class="rekening-pagination-dots">${
        Array.from({ length: total }, (_, i) => i).map(i =>
          `<button type="button" aria-label="Ke rekening ${i + 1}" onclick="goToRekeningStack_(${i})" class="rekening-pagination-dot ${i === indexZeroBased ? 'active' : ''}"></button>`
        ).join('')
      }</div>`;
    } else {
      middle = `<span class="text-[11px] font-medium text-slate-400">${current}/${total}</span>`;
    }

    controls.innerHTML = `
      <button type="button" aria-label="Rekening sebelumnya" onclick="prevRekeningStack_()" class="rekening-pagination-arrow clay-pagination-arrow" ${arrowDisabled}>
        <span class="material-symbols-outlined text-[18px]">chevron_left</span>
      </button>
      ${middle}
      <button type="button" aria-label="Rekening berikutnya" onclick="nextRekeningStack_()" class="rekening-pagination-arrow clay-pagination-arrow" ${arrowDisabled}>
        <span class="material-symbols-outlined text-[18px]">chevron_right</span>
      </button>`;
  }

  // ==========================================
  // BUDGET: tinggi #rekeningList "pas konten & pas layar" — pendekatan mirip
  // fitRiwayatListViewport_() (tab Transaksi) tapi TIDAK lagi memaksa tinggi container
  // sampai memenuhi SISA layar penuh (dulu bikin kartu jadi tinggi banget & banyak ruang
  // kosong di bawah konten, lihat laporan user). Sekarang tinggi container mengikuti tinggi
  // KONTEN kartu terpanjang (diukur via ukurTinggiKontenRekeningMax_()), dibatasi ATAS oleh
  // ruang yg tersisa di layar (viewport - header² di atasnya - nav bawah) supaya:
  // 1) TIDAK ada ruang kosong berlebih kalau kontennya pendek (kartu jadi "pas" tingginya).
  // 2) TIDAK PERNAH melebihi layar walau kontennya panjang -> tab Budget tidak pernah
  //    memicu scroll/swipe vertikal halaman (overflow selalu tercegah dari sumbernya,
  //    bukan cuma ditutup lewat overflow:hidden yg bikin shadow/kartu-mengintip kelihatan
  //    "terpotong" kalau dipaksa lebih tinggi dari kontennya).
  // ==========================================
  function fitRekeningListViewport_() {
    const viewport = document.getElementById('budgetViewport');
    const list = document.getElementById('rekeningList');
    const viewSection = document.getElementById('viewBudget');
    if (!viewport || !list || !viewSection || !viewSection.classList.contains('active')) return;
    const nav = document.querySelector('nav');
    const navH = nav ? nav.getBoundingClientRect().height : 80;
    const navGap = window.innerWidth >= 768 ? 28 : 16;
    const viewportHeight = (window.visualViewport && window.visualViewport.height) || window.innerHeight;

    // Set dulu tinggi #budgetViewport PERSIS sebesar sisa ruang kosong viewport (sama pola
    // fitUtangViewport() tab Utang): bagian fixed di atas (header/hero/indikator) tidak ikut
    // berubah tinggi/discroll, dan total tab TIDAK PERNAH melebihi layar -> tanpa scroll
    // halaman walau kontennya panjang. Bottom pb-24 body dinolkan by updateBodyPaddingForTab_().
    const topViewport = viewport.getBoundingClientRect().top;
    viewport.style.height = Math.max(280, Math.round(viewportHeight - topViewport - navH - navGap)) + 'px';

    // Lalu tinggi area kartu = tinggi konten alami (diukur via probe) dibatasi sisa ruang
    // setelah bagian fixed, supaya kartu pas muat dan tetap tidak pernah memicu scroll.
    const top = list.getBoundingClientRect().top;
    const available = Math.max(viewportHeight - top - navH - navGap, 150);
    const dataList = (cachedDompet && cachedDompet.rekening) ? cachedDompet.rekening : [];
    const MIN_H = 150; // tinggi minimum wajar utk 1 kartu (ikon+nama+saldo), jaga2 kartu tanpa log
    const contentH = dataList.length ? (ukurTinggiKontenRekeningMax_(dataList) + 12) : MIN_H; // +12 = kompensasi inset-[6px] atas+bawah
    list.style.height = Math.min(Math.max(contentH, MIN_H), available) + 'px';
  }

  // Ukur tinggi KONTEN natural (bukan tinggi kartu yg dipaksa penuh container) dari
  // kartu-kartu rekening, diambil nilai TERTINGGI di antara semuanya (spy semua kartu di
  // stack dpt tinggi container yg sama & tidak "geser²" tiap ganti kartu). Diukur via probe
  // tersembunyi (position:absolute, visibility:hidden, di luar layar) yg dipasangi markup
  // konten sama persis (renderRekeningCardInnerHtml_()) dgn lebar yg disamakan dgn lebar asli
  // kartu (lebar wrapper - inset kiri&kanan) supaya wrapping teks & tinggi hasil ukur akurat.
  function ukurTinggiKontenRekeningMax_(list) {
    const wrapper = document.getElementById('rekeningList');
    if (!wrapper || !list.length) return 0;
    const probe = document.createElement('div');
    probe.className = 'clay clay-card clay-key-blue bg-white p-4';
    probe.style.cssText = 'position:absolute; visibility:hidden; pointer-events:none; left:-9999px; top:0;';
    probe.style.width = Math.max(wrapper.clientWidth - 12, 100) + 'px'; // -12 = inset-[6px] kiri+kanan
    document.body.appendChild(probe);
    let max = 0;
    list.forEach(r => {
      probe.innerHTML = renderRekeningCardInnerHtml_(r);
      max = Math.max(max, probe.scrollHeight);
    });
    document.body.removeChild(probe);
    return max;
  }
  let rekeningResizeTimer_ = null;
  function scheduleRekeningReflow_(delay) {
    clearTimeout(rekeningResizeTimer_);
    rekeningResizeTimer_ = setTimeout(fitRekeningListViewport_, delay || 200);
  }
  window.addEventListener('resize', () => scheduleRekeningReflow_(200));
  window.addEventListener('orientationchange', () => scheduleRekeningReflow_(250));
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', () => scheduleRekeningReflow_(120));
  }

// Kartu rekening diclaykan (samain gaya tab Transaksi, §4/§7 DESIGN-MEMORY) & warna
  // utamanya diganti BIRU (clay-key-blue, bg-blue-700) sesuai permintaan terbaru — sebelumnya
  // hijau (clay-key-primary):
  // - ".rek-card-item" DIPERTAHANKAN (dipakai querySelectorAll di toggleDeleteBtnRekening,
  //   JANGAN dihapus) tapi ditambah ".tx-card-item .clay .clay-card .clay-key-blue" supaya
  //   dapat shadow clay ber-hue biru + tint biru saat :active. Shadow-nya jg dinaikkan
  //   khusus lewat selector ".rek-card-item.clay" (ViewCSS.html) krn versi default ".clay"
  //   dirasa kurang "pop"/kelihatan putih di kartu berjejer ini.
  // - Ikon "account_balance" dibungkus .clay-icon-tile (squircle timbul) hue biru.
  // - Nominal saldo dikasih .font-mono (aturan global tampilan angka, §2 DESIGN-MEMORY).
  // - ".rekening-stack-card" + "data-index": posisi absolut nyaris-penuh, "inset-[6px]"
  //   (BUKAN "inset-0") di dalam #rekeningList (ViewCSS.html) supaya bisa ditumpuk & digeser
  //   via applyRekeningStackTransform_() -> "mb-3" lama DIHAPUS (tidak relevan lagi utk
  //   elemen posisi absolut). Sisa 6px itu sengaja diberikan sbg ruang napas shadow clay
  //   kartu (FIX shadow kelihatan "terpotong" rata persis di tepi wadah #rekeningList).
  // - Log Perubahan: card SEKARANG cuma nampilkan BARIS TERAKHIR (perubahan paling baru,
  //   diambil lewat ambilLogTerakhirRekening_()), bukan seluruh riwayat -> riwayat LENGKAP
  //   dipindah ke modal detail (openDetailLogRekeningModal(), dibuka via tekan-tahan/
  //   long-press, lihat handleRekeningTouchStart_() & #modalDetailLogRekening di
  //   ViewBudget.html), supaya kartu tetap ringkas & pas-layar 1 kartu.
  function renderRekeningCard(r, i) {
    return `<div onclick="toggleDeleteBtnRekening(this)"
          ondblclick="openEditRekeningModal(JSON.parse(this.getAttribute('data-item')))"
          ontouchstart="handleRekeningTouchStart_(event, this)"
          ontouchmove="handleRekeningTouchMove_(event, this)"
          ontouchend="handleRekeningTouchEnd_(event, this)"
          data-item='${JSON.stringify(r).replace(/'/g, "&apos;")}'
          data-id="${r.id}"
          data-index="${i}"
          class="rek-card-item tx-card-item rekening-stack-card clay clay-card clay-key-blue absolute inset-[6px] w-auto bg-white p-4 transition-all select-none cursor-pointer">${renderRekeningCardInnerHtml_(r)}</div>`;
  }

  // Konten kartu (tanpa wrapper/positioning) DIPISAH ke fungsi sendiri supaya bisa dipakai
  // ULANG oleh probe pengukur tinggi (ukurTinggiKontenRekeningMax_(), lihat di atas) —
  // markup-nya harus PERSIS SAMA dgn yg dirender di kartu asli (renderRekeningCard()) supaya
  // hasil ukur tinggi akurat, bukan cuma perkiraan.
  function renderRekeningCardInnerHtml_(r) {
    const logTerakhir = ambilLogTerakhirRekening_(r.catatan);
    return `<div class="flex items-center gap-2 mb-2">
        <div class="flex items-center gap-2 min-w-0 flex-1">
          <div class="clay-icon-tile clay-key-blue w-9 h-9 rounded-full bg-blue-50 flex items-center justify-center shrink-0">
            <span class="material-symbols-outlined text-blue-700 text-[18px]">account_balance</span>
          </div>
          <span class="font-bold text-base text-slate-800 truncate">${r.nama}</span>
        </div>
        ${r.tipe ? `<span class="text-[10px] px-2 py-0.5 rounded-full bg-blue-50 text-blue-700 font-medium shrink-0 whitespace-nowrap ml-auto">${r.tipe}</span>` : ''}
        <button onclick="openDeleteRekeningModal('${r.id}', event)" class="delete-btn-action hidden shrink-0 w-8 h-8 rounded-full bg-red-50 hover:bg-red-100 text-red-500 flex items-center justify-center transition-all">
          <span class="material-symbols-outlined text-[18px]">delete</span>
        </button>
      </div>
      <div class="mb-2">
        <p class="text-xs text-slate-400">Saldo Akhir</p>
        <p class="font-mono text-lg font-bold text-slate-800">Rp ${Number(r.saldo).toLocaleString('id-ID')}</p>
      </div>
        ${logTerakhir ? `<div class="mb-2 bg-slate-50 rounded-lg px-2.5 py-2">
          <p class="text-xs font-semibold text-slate-400 mb-1">Perubahan Terakhir</p>
          <p class="text-xs text-slate-500 font-mono truncate">${escHtml_(logTerakhir)}</p>
          <p class="text-[10px] text-blue-700/70 mt-1 flex items-center gap-1">
            <span class="material-symbols-outlined text-[12px]">touch_app</span>
            Tahan kartu utk lihat semua riwayat
          </p>
        </div>` : ''}`;
  }

  // Ambil BARIS TERAKHIR (entri paling baru) dari teks log multi-baris "catatan" rekening —
  // dipakai di ringkasan kartu (renderRekeningCard()); riwayat lengkap tetap disimpan utuh di
  // r.catatan & ditampilkan semuanya lewat openDetailLogRekeningModal().
  function ambilLogTerakhirRekening_(catatan) {
    const entries = String(catatan || '').split('\n').map(s => s.trim()).filter(Boolean);
    return entries.length ? entries[entries.length - 1] : '';
  }

  // ===== TAMBAH REKENING BARU =====
  // Modal & form-nya sudah ada statis di ViewBudget.html (#modalTambahRekening, onsubmit="handleTambahRekeningSubmit(event)").
function openTambahRekeningModal() {
    document.getElementById('inputNamaRekeningBaru').value = '';
    document.getElementById('inputSaldoAwalRekeningBaru').value = '';
    document.getElementById('tipeRekening').value = '';
    document.getElementById('modalTambahRekening')?.classList.remove('hidden');
    document.getElementById('inputNamaRekeningBaru').focus();
  }

  function closeTambahRekeningModal() {
    document.getElementById('modalTambahRekening')?.classList.add('hidden');
  }

  function handleTambahRekeningSubmit(event) {
    event.preventDefault();

    const nama = document.getElementById('inputNamaRekeningBaru').value.trim();
    const saldoAwal = Number(document.getElementById('inputSaldoAwalRekeningBaru').value) || 0;
    const tipe = document.getElementById('tipeRekening').value;
    const btn = document.getElementById('btnSimpanRekeningBaru');

    if (!nama) { showToast('error', 'Nama rekening wajib diisi.'); return; }
    if (!tipe) { showToast('error', 'Tipe rekening wajib dipilih.'); return; }
    if (saldoAwal < 0) { showToast('error', 'Saldo awal tidak boleh minus.'); return; }

    const snapshotDompet = cloneCache_(cachedDompet);

    const newRekening = {
      id: 'temp-' + Date.now(),
      nama: nama,
      saldo: saldoAwal,
      tipe: tipe,
      catatan: '',
      terakhirDiperbarui: '-'
    };

    if (!cachedDompet) cachedDompet = { totalSaldo: 0, rekening: [], lastUpdated: null };
    cachedDompet.rekening.push(newRekening);
    cachedDompet.totalSaldo += saldoAwal;

    closeTambahRekeningModal();
    renderDompetUI(cachedDompet);
    showToast('success', 'Rekening berhasil ditambahkan!');

    google.script.run
      .withSuccessHandler(res => {
        if (res && res.status === 'success') {
          cachedDompet = res.dompet;
          const serverRekening = res.dompet.rekening.find(r => r.nama === nama && r.saldo === saldoAwal && r.tipe === tipe);
          if (serverRekening) {
            const tempRekening = cachedDompet.rekening.find(r => r.id.startsWith('temp-') && r.nama === nama && r.saldo === saldoAwal && r.tipe === tipe);
            if (tempRekening) {
              tempRekening.id = serverRekening.id;
            }
          }
          renderDompetUI(cachedDompet);
          populateSumberAkun(cachedDompet.rekening.map(r => r.nama));
        } else {
          cachedDompet = snapshotDompet;
          renderDompetUI(cachedDompet);
          showToast('error', 'Gagal disimpan ke server, perubahan dibatalkan: ' + (res ? res.message : 'Error'));
        }
      })
      .withFailureHandler(err => {
        cachedDompet = snapshotDompet;
        renderDompetUI(cachedDompet);
        showToast('error', 'Koneksi error, perubahan dibatalkan: ' + (err.message || err));
      })
      .simpanRekeningServer(nama, saldoAwal, tipe);
  }

  // ==========================================
  // LOAD & RENDER STATISTIK
  // ==========================================
  function loadStatistik() {
    updatePeriodeLabels_();
    if (cachedStatistik) {
      try { renderStatistikUI(cachedStatistik); } catch (e) { showToast('error', 'Gagal menampilkan statistik: ' + e.message); }
      return;
    }
    const container = document.getElementById('statistikContainer');
    if (container) container.classList.add('stat-loading');
    showToast('loading', 'Memuat statistik...');
    google.script.run
      .withSuccessHandler(res => {
        if (container) container.classList.remove('stat-loading');
        hideToast();
        // GUARD: getStatistikPeriodeServer() SEHARUSNYA selalu mengembalikan object
        // { pemasukan, pengeluaran, total, categories, trend, items } - tidak pernah
        // null/undefined dari sisi controller.gs. Kalau res tetap falsy di sini, itu
        // artinya payload HILANG di jalur komunikasi client<->server (mis. postMessage
        // dari sandbox iframe Apps Script ke-drop - cek console utk warning
        // "dropping postMessage.. was from host null" - biasanya terjadi saat test
        // lewat tombol Preview di Apps Script Editor, bukan lewat URL Web App yang
        // sudah di-deploy, atau saat cookie pihak-ketiga/extension browser
        // memblokir iframe googleusercontent.com). SEBELUM fix ini, res=null akan
        // diam-diam jatuh ke `data || {}` di renderStatistikUI() dan menampilkan
        // Statistik seolah-olah "Rp 0 / belum ada data" tanpa error apa pun -
        // menyesatkan karena datanya sebenarnya ADA di sheet, bukan hilang.
        if (!res) {
          console.error('[STATISTIK] getStatistikPeriodeServer() mengembalikan payload kosong (null/undefined). Kemungkinan payload ke-drop di jalur google.script.run, bukan datanya benar-benar kosong.');
          showToast('error', 'Gagal memuat statistik (payload kosong dari server). Coba muat ulang tab ini.');
          return;
        }
        cachedStatistik = res;
        try {
          renderStatistikUI(res);
        } catch (e) {
          showToast('error', 'Gagal menampilkan statistik: ' + e.message);
        }
      })
      .withFailureHandler(err => {
        if (container) container.classList.remove('stat-loading');
        showToast('error', 'Gagal memuat statistik: ' + (err && err.message ? err.message : err));
      })
      .getStatistikPeriodeServer(statistikMode, statistikBulan, statistikTahun);
  }

  function setPeriodeMode(mode) {
    statistikMode = mode;
    const lbl = document.getElementById('periodeLabelText');
    const dd = document.getElementById('periodeDropdown');
    if (lbl) lbl.textContent = mode === 'tahunan' ? 'Tahunan' : 'Bulanan';
    if (dd) dd.classList.add('hidden');
    cachedStatistik = null;
    loadStatistik();
  }

  function navigatePeriode(dir) {
    if (statistikMode === 'tahunan') {
      statistikTahun += dir;
    } else {
      statistikBulan += dir;
      if (statistikBulan < 0) { statistikBulan = 11; statistikTahun--; }
      else if (statistikBulan > 11) { statistikBulan = 0; statistikTahun++; }
    }
    cachedStatistik = null;
    loadStatistik();
  }

  function updatePeriodeLabels_() {
    const lbl = document.getElementById('periodeLabelText');
    const cur = document.getElementById('periodeCurrentLabel');
    if (lbl) lbl.textContent = statistikMode === 'tahunan' ? 'Tahunan' : 'Bulanan';
    if (cur) cur.textContent = statistikMode === 'tahunan'
      ? String(statistikTahun)
      : (NAMA_BULAN_ID[statistikBulan] + ' ' + statistikTahun);
    const chartTitle = document.getElementById('trendChartTitle');
    if (chartTitle) chartTitle.textContent = statistikMode === 'tahunan' ? 'Tren Tahun Ini' : 'Tren Bulan Ini';
    const catTitle = document.getElementById('categoryTitle');
    if (catTitle) catTitle.textContent = statistikMode === 'tahunan'
      ? 'Breakdown Kategori (Tahun Ini)'
      : 'Breakdown Kategori (Bulan Ini)';
  }

  function escHtml_(s) { const d = document.createElement('div'); d.textContent = String(s == null ? '' : s); return d.innerHTML; }

  function hiNominal_(t) {
    return t.replace(/Rp\s?[\d.,]+/g, m => {
      const angka = m.replace(/[^\d]/g, ''); // ambil digit mentah saja, buang titik/koma yang mungkin sudah ada
      const formatted = 'Rp ' + Number(angka || 0).toLocaleString('id-ID'); // format ulang konsisten: Rp 100.000
      return `<span style="display:inline-block;font-family:'Inter','Segoe UI',sans-serif;font-variant-numeric:tabular-nums;font-weight:700;color:#0F5132;background:#D1F5E3;border:1px solid rgba(45,106,79,.18);padding:2px 8px;margin:0 1px;border-radius:6px;font-size:12.5px;line-height:1.5;vertical-align:1px;white-space:nowrap;">${formatted}</span>`;
    });
  }

  // Hilangkan sisa markdown yang kadang masih ikut dari model AI (**: tebal, *: miring, __, `, #, [](url)).
  function stripMarkdown_(s) {
    return String(s || '')
      .replace(/\*\*([^*]+)\*\*/g, '$1')      // **tebal**
      .replace(/\*([^*]+)\*/g, '$1')          // *miring*
      .replace(/__([^_]+)__/g, '$1')          // __tebal__
      .replace(/`([^`]+)`/g, '$1')            // `code`
      .replace(/^#{1,6}\s+/gm, '')            // heading
      .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1') // link → teks
      .replace(/^\s*[-*]\s+/gm, '- ')         // bullet apa pun → "- "
      .trim();
  }

  function parseRek_(raw) {
    const txt = stripMarkdown_(raw);
    const m1 = txt.match(/KONDISI:\s*([\s\S]*?)(?=HEMAT DI SINI:|PRIORITAS ALOKASI:|$)/i);
    const m2 = txt.match(/HEMAT DI SINI:\s*([\s\S]*?)(?=PRIORITAS ALOKASI:|$)/i);
    const m3 = txt.match(/PRIORITAS ALOKASI:\s*([\s\S]*)$/i);
    const bullets = s => String(s || '').split(/(?:^|\s)-\s+/).map(x => x.trim()).filter(Boolean);
    return { kondisi: m1 ? m1[1].trim() : '', hemat: bullets(m2 ? m2[1] : ''), prioritas: bullets(m3 ? m3[1] : '') };
  }

  function renderRekomendasiAI_(raw) {
    const p = parseRek_(raw);
    if (!p.kondisi && !p.hemat.length && !p.prioritas.length)
      return `<p class="text-sm text-slate-600 leading-relaxed">${escHtml_(stripMarkdown_(raw))}</p>`;

    let h = '';

    if (p.kondisi) {
      h += `<div style="display:flex;align-items:flex-start;gap:10px;background:#D1F5E3;border-radius:10px;padding:12px 14px;margin-bottom:16px;">
        <span class="material-symbols-outlined" style="color:#2D6A4F;font-size:18px;flex-shrink:0;margin-top:1px;">verified</span>
        <p style="font-size:13px;color:#0F172A;line-height:1.6;margin:0;">${hiNominal_(escHtml_(p.kondisi))}</p>
      </div>`;
    }

    if (p.hemat.length) {
      h += `<div style="margin-bottom:16px;">
        <p style="display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:#2D6A4F;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;">
          <span class="material-symbols-outlined" style="font-size:15px;">savings</span>Hemat di Sini
        </p>
        <div style="display:flex;flex-direction:column;gap:7px;">
          ${p.hemat.map(item => `
            <div style="display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:#F8FAF9;border-left:3px solid #2D6A4F;border-radius:0 8px 8px 0;">
              <span class="material-symbols-outlined" style="color:#10b981;font-size:16px;flex-shrink:0;margin-top:1px;">check_circle</span>
              <span style="font-size:13px;color:#334155;line-height:1.55;">${hiNominal_(escHtml_(item))}</span>
            </div>`).join('')}
        </div>
      </div>`;
    }

    if (p.prioritas.length) {
      h += `<div>
        <p style="display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:#B45309;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;">
          <span class="material-symbols-outlined" style="font-size:15px;color:#E86C4A;">bolt</span>Prioritas Alokasi
        </p>
        <div style="display:flex;flex-direction:column;gap:7px;">
          ${p.prioritas.map((item, i) => `
            <div style="display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:#FDE8E0;border-radius:8px;">
              <span style="width:20px;height:20px;min-width:20px;border-radius:50%;background:#E86C4A;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;">${i+1}</span>
              <span style="font-size:13px;color:#334155;line-height:1.55;">${hiNominal_(escHtml_(item))}</span>
            </div>`).join('')}
        </div>
      </div>`;
    }

    return h;
  }

  function renderCategoryBars_(categories, totalJenis, opts) {
    const o = opts || {};
    const wrap = document.getElementById(o.wrapId || 'categoryBars');
    const empty = document.getElementById(o.emptyId || 'emptyCategory');
    if (!wrap) return;
    const list = (categories || []).filter(c => c.total > 0).slice(0, 8);
    if (o.storeVar && window[o.storeVar]) { window[o.storeVar] = list; }
    if (!list.length) {
      wrap.innerHTML = '';
      if (empty) empty.classList.remove('hidden');
      return;
    }
    if (empty) empty.classList.add('hidden');
    const max = Math.max(...list.map(c => c.total), 1);
    // Palet warna per jenis: index 0 (kategori terbesar) memakai warna PALING GELAP, makin
    // kecil nilai kategorinya makin terang — konsisten utk pemasukan (hijau) & pengeluaran (merah).
    const paletteGreen = ['#064E3B', '#065F46', '#047857', '#059669', '#10B981', '#34D399', '#6EE7B7', '#A7F3D0'];
    const paletteRed = ['#7F1D1D', '#991B1B', '#B91C1C', '#DC2626', '#EF4444', '#F87171', '#FCA5A5', '#FECACA'];
    const palette = (o.jenis === 'pemasukan') ? paletteGreen : paletteRed;
    const jenis = o.jenis === 'pemasukan' ? 'pemasukan' : 'pengeluaran';
    wrap.innerHTML = list.map((c, i) => {
      const pct = totalJenis > 0 ? (c.total / totalJenis * 100) : 0;
      const barPct = (c.total / max * 100).toFixed(1);
      const color = palette[i % palette.length];
      // Track progress bar dibuat jadi "sumur"/groove claymorphism (inset ganda, resep sama
      // dgn .clay-input) menggantikan bg flat #F1F5F9 lama, biar senada kartu Transaksi;
      // bar isian tetap warna palette per kategori tapi ditambah sedikit shadow raised
      // supaya kelihatan "timbul" di dalam sumurnya.
      return `<div ondblclick="openKategoriDetailModal('${jenis}', decodeURIComponent('${encodeURIComponent(c.kategori || 'Lainnya')}'))" style="cursor:pointer;padding:8px 10px;border-radius:14px;transition:background-color .15s ease;" title="Ketuk/klik dua kali untuk lihat rincian transaksi" onmouseover="this.style.backgroundColor='rgba(38,90,67,.05)'" onmouseout="this.style.backgroundColor='transparent'">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
          <span style="font-size:13px;font-weight:600;color:#334155;">${escHtml_(c.kategori || 'Lainnya')}</span>
          <span style="font-size:13px;font-weight:700;color:#0F172A;font-variant-numeric:tabular-nums;">Rp ${Number(c.total).toLocaleString('id-ID')} <span style="color:#94A3B8;font-weight:500;">(${pct.toFixed(1)}%)</span></span>
        </div>
        <div style="height:9px;background:#F1F5F9;border-radius:999px;overflow:hidden;box-shadow:inset 2px 2px 5px rgba(100,116,139,.18), inset -2px -2px 4px rgba(255,255,255,.8);">
          <div style="height:100%;width:${barPct}%;background:${color};border-radius:999px;box-shadow:1px 1px 3px rgba(0,0,0,.15);"></div>
        </div>
      </div>`;
    }).join('');
  }

  // Jenis "pemasukan"/"pendapatan" (case-insensitive) -> dianggap income, sama seperti
  // isIncome_() di controller.gs (getStatistikPeriodeServer()). Dipakai murni utk filter
  // client-side items periode kategori di openKategoriDetailModal(), TANPA round-trip baru.
  function isIncomeJenis_(jenis) {
    const j = String(jenis || '').toLowerCase();
    return j === 'pemasukan' || j === 'pendapatan';
  }

  // MODAL DETAIL TRANSAKSI PER KATEGORI ("card-modal") — dipicu double click/double tap
  // salah satu baris di "Breakdown Kategori" (Pemasukan ATAU Pengeluaran, sesuai argumen
  // jenis). Menampilkan SEMUA transaksi kategori tsb pada periode (bulan/tahun ATAU tahun
  // penuh, sesuai filter Statistik yg sedang aktif). Data diambil dari cachedStatistik.items
  // (sudah dikirim sekalian oleh getStatistikPeriodeServer(), lihat controller.gs) -> TIDAK
  // ada google.script.run baru, murni filter di memory.
  function openKategoriDetailModal(jenis, kategori) {
    const modal = document.getElementById('modalKategoriDetail');
    const titleEl = document.getElementById('modalKategoriDetailTitle');
    const subEl = document.getElementById('modalKategoriDetailSub');
    const listEl = document.getElementById('modalKategoriDetailList');
    const totalEl = document.getElementById('modalKategoriDetailTotal');
    const totalLabelEl = document.getElementById('modalKategoriDetailTotalLabel');
    if (!modal || !listEl) return;

    const isIncome = jenis === 'pemasukan';
    const periodeLabel = statistikMode === 'tahunan'
      ? ('Tahun ' + statistikTahun)
      : (NAMA_BULAN_ID[statistikBulan] + ' ' + statistikTahun);

    if (titleEl) titleEl.textContent = kategori || 'Lainnya';
    if (subEl) subEl.textContent = 'Semua ' + (isIncome ? 'pemasukan' : 'pengeluaran') + ' periode ' + periodeLabel;
    if (totalLabelEl) totalLabelEl.textContent = 'Total ' + (isIncome ? 'Pemasukan' : 'Pengeluaran');

    const items = ((cachedStatistik && cachedStatistik.items) || [])
      .filter(it => isIncomeJenis_(it.jenis) === isIncome && (it.kategori || 'Lainnya') === kategori)
      .slice()
      .sort((a, b) => new Date(b.tanggalRaw) - new Date(a.tanggalRaw)); // terbaru dulu

    if (!items.length) {
      listEl.innerHTML = `<p class="text-sm text-slate-500 text-center py-8">Tidak ada transaksi untuk kategori ini pada periode ${escHtml_(periodeLabel)}.</p>`;
    } else {
      // Baris transaksi di dalam modal (card-modal) dibuat jd mini "clay-card" flat (bg
      // rgba tipis + radius, TANPA shadow 3D penuh spy tidak berat di list yg discroll)
      // senada nuansa kartu Transaksi (.tx-card-item), gantikan divider border-b lama.
      const bgRow = isIncome ? 'rgba(16,185,129,.07)' : 'rgba(195,53,53,.05)';
      const warnaNominal = isIncome ? 'text-success' : 'text-expense';
      listEl.innerHTML = items.map(it => `
        <div class="flex items-center justify-between gap-3 px-3 py-2.5 mb-1.5 last:mb-0" style="border-radius:14px;background:${bgRow};">
          <div class="min-w-0">
            <p class="text-sm text-slate-700 truncate">${escHtml_(it.keterangan || it.kategori || '-')}</p>
            <p class="text-[11px] text-slate-400 mt-0.5">${escHtml_(it.tanggal)} · ${escHtml_(it.sumber || '-')}</p>
          </div>
          <span class="text-sm font-semibold ${warnaNominal} shrink-0">Rp ${Number(it.nominal).toLocaleString('id-ID')}</span>
        </div>`).join('');
    }

    const total = items.reduce((a, it) => a + (Number(it.nominal) || 0), 0);
    if (totalEl) totalEl.textContent = 'Rp ' + total.toLocaleString('id-ID');

    modal.classList.remove('hidden');
  }

  function closeKategoriDetailModal() {
    document.getElementById('modalKategoriDetail')?.classList.add('hidden');
  }

  function renderStatistikUI(data) {
    const container = document.getElementById('statistikContainer');
    if (!container) return;
    const { pemasukan, pengeluaran, categories, kategoriPemasukan, trend, pemasukanSebelumnya, pengeluaranSebelumnya } = data || {};

    const elPemasukan = document.getElementById('totalPemasukan');
    const elPengeluaran = document.getElementById('totalPengeluaran');
    const elSaldo = document.getElementById('totalSaldo');
    if (elPemasukan) elPemasukan.textContent = 'Rp ' + Number(pemasukan || 0).toLocaleString('id-ID');
    if (elPengeluaran) elPengeluaran.textContent = 'Rp ' + Number(pengeluaran || 0).toLocaleString('id-ID');
    const saldo = (pemasukan || 0) - (pengeluaran || 0);
    if (elSaldo) elSaldo.textContent = 'Rp ' + Number(saldo).toLocaleString('id-ID');

    // PERSENTASE PEMBANDING PERIODE SEBELUMNYA (bulan lalu / tahun lalu, sesuai filter
    // aktif) — ditampilkan di paragraf trendPemasukan/trendPengeluaran/trendSaldo.
    // naikBaik_=true berarti kenaikan (%) ditampilkan hijau (mis. Pemasukan/Saldo naik
    // itu bagus), naikBaik_=false berarti kenaikan ditampilkan merah (Pengeluaran naik
    // itu buruk) — arah panah & warna otomatis menyesuaikan.
    const labelPeriodeSebelumnya = statistikMode === 'tahunan' ? 'tahun lalu' : 'bulan lalu';
    function hitungPersenBanding_(sekarang, sebelumnya) {
      sekarang = Number(sekarang) || 0;
      sebelumnya = Number(sebelumnya) || 0;
      if (sebelumnya === 0) {
        if (sekarang === 0) return { persen: 0, ada: false };
        return { persen: 100, naik: true, ada: true, baruMuncul: true };
      }
      const persen = ((sekarang - sebelumnya) / Math.abs(sebelumnya)) * 100;
      return { persen, naik: persen >= 0, ada: true };
    }
    function renderTrendPersen_(elId, sekarang, sebelumnya, naikBaik) {
      const el = document.getElementById(elId);
      if (!el) return;
      const r = hitungPersenBanding_(sekarang, sebelumnya);
      if (!r.ada) {
        el.textContent = 'Belum ada data ' + labelPeriodeSebelumnya;
        el.className = 'text-xs text-slate-500 mt-2';
        return;
      }
      const teksPersen = Math.abs(r.persen).toFixed(1) + '%';
      const bagus = (naikBaik && r.naik) || (!naikBaik && !r.naik);
      const warna = r.baruMuncul ? 'text-slate-500' : (bagus ? 'text-success' : 'text-danger');
      const label = r.baruMuncul ? 'Baru' : ((r.naik ? 'Naik ' : 'Turun ') + teksPersen);
      el.textContent = label;
      el.className = 'text-xs mt-2 font-semibold ' + warna;
    }
    renderTrendPersen_('trendPemasukan', pemasukan, pemasukanSebelumnya, true);
    renderTrendPersen_('trendPengeluaran', pengeluaran, pengeluaranSebelumnya, false);
    const saldoSebelumnya = (Number(pemasukanSebelumnya) || 0) - (Number(pengeluaranSebelumnya) || 0);
    renderTrendPersen_('trendSaldo', saldo, saldoSebelumnya, true);

    // RENDER TREND CHART (harian jika Bulanan, bulanan jika Tahunan)
    const ctx = document.getElementById('statistikChart');
    const emptyTrend = document.getElementById('emptyTrend');
    const adaData = (pemasukan > 0 || pengeluaran > 0);
    if (ctx) {
      if (window._statistikChartInstance) { window._statistikChartInstance.destroy(); window._statistikChartInstance = null; }
      if (!adaData) {
        ctx.classList.add('hidden');
        if (emptyTrend) emptyTrend.classList.remove('hidden');
      } else {
        ctx.classList.remove('hidden');
        if (emptyTrend) emptyTrend.classList.add('hidden');
        const labels = (trend || []).map(t => t.label);
        const pemasukanData = (trend || []).map(t => t.pemasukan);
        const pengeluaranData = (trend || []).map(t => t.pengeluaran);
        // Formatter Rupiah singkat utk sumbu-Y & tooltip (mis. Rp 1,2 jt / Rp 850 rb)
        const fmtRupiahSingkat_ = (v) => {
          const n = Number(v) || 0;
          const abs = Math.abs(n);
          if (abs >= 1000000000) return 'Rp ' + (n / 1000000000).toLocaleString('id-ID', { maximumFractionDigits: 1 }) + ' M';
          if (abs >= 1000000) return 'Rp ' + (n / 1000000).toLocaleString('id-ID', { maximumFractionDigits: 1 }) + ' jt';
          if (abs >= 1000) return 'Rp ' + (n / 1000).toLocaleString('id-ID', { maximumFractionDigits: 0 }) + ' rb';
          return 'Rp ' + n.toLocaleString('id-ID');
        };
        window._statistikChartInstance = new Chart(ctx, {
          type: 'bar',
          data: {
            labels,
            datasets: [
              {
                label: 'Masuk',
                data: pemasukanData,
                backgroundColor: '#10b981',
                hoverBackgroundColor: '#0d9c6c',
                borderRadius: 4,
                borderSkipped: false,
                maxBarThickness: 28
              },
              {
                label: 'Keluar',
                data: pengeluaranData,
                backgroundColor: '#e53e3e',
                hoverBackgroundColor: '#c53030',
                borderRadius: 4,
                borderSkipped: false,
                maxBarThickness: 28
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: {
              legend: { display: false },
              tooltip: {
                backgroundColor: '#1e293b',
                padding: 10,
                titleFont: { weight: 'bold' },
                callbacks: {
                  label: (ctx2) => ` ${ctx2.dataset.label}: Rp ${Number(ctx2.parsed.y || 0).toLocaleString('id-ID')}`
                }
              }
            },
            scales: {
              x: {
                grid: { display: false },
                ticks: { color: '#64748b', font: { size: 11 } }
              },
              y: {
                beginAtZero: true,
                grid: { color: 'rgba(148,163,184,.15)' },
                ticks: {
                  color: '#64748b',
                  font: { size: 11 },
                  callback: v => fmtRupiahSingkat_(v)
                }
              }
            }
          }
        });
      }
    }

    // RENDER BREAKDOWN KATEGORI (2 kolom: Pemasukan & Pengeluaran)
    renderCategoryBars_(kategoriPemasukan, pemasukan, {
      wrapId: 'categoryBarsIncome',
      emptyId: 'emptyCategoryIncome',
      jenis: 'pemasukan'
    });
    renderCategoryBars_(categories || [], pengeluaran, {
      wrapId: 'categoryBars',
      emptyId: 'emptyCategory',
      jenis: 'pengeluaran'
    });

    // AI REKOMENDASI: TIDAK lagi di-fetch otomatis di sini (hemat kuota/biaya Gemini + biar
    // rekomendasi tidak nyangkut dari periode sebelumnya). Kartu direset ke placeholder
    // "ketuk dua kali utk memuat" - baru benar-benar fetch saat pengguna DOUBLE CLICK/DOUBLE
    // TAP kartunya, lihat handleAiRekomendasiTap().
    resetAiRecommendationCard_();

    cachedStatistik = data;
  }

  // ==========================================
  // FITUR: REKOMENDASI AI (AKTIF VIA DOUBLE CLICK / DOUBLE TAP, WEB MAUPUN MOBILE)
  // ==========================================
  let aiRecLoading = false; // guard: cegah request bertumpuk kalau kartu di-double click berkali-kali cepat

  function resetAiRecommendationCard_() {
    const aiTextDiv = document.getElementById('aiRecommendationText');
    if (!aiTextDiv) return;
    aiTextDiv.innerHTML = `<div class="flex items-center gap-2 text-sm text-slate-500 py-2">
      <span class="material-symbols-outlined text-[18px]">touch_app</span>
      Ketuk/klik dua kali pada kartu ini untuk memuat rekomendasi AI.
    </div>`;
  }

  // Dipicu dari atribut ondblclick di kartu #aiRecommendation (ViewStatistik.html). Event
  // "dblclick" native browser sudah otomatis terpicu baik dari klik ganda mouse (web) MAUPUN
  // tap ganda layar sentuh (mobile) selama viewport meta sudah diset (sudah ada di doGet()),
  // jadi tidak perlu deteksi tap manual terpisah.
  function handleAiRekomendasiTap() {
    if (aiRecLoading) return; // masih ada request berjalan, abaikan pemicu baru
    const aiTextDiv = document.getElementById('aiRecommendationText');
    if (!aiTextDiv) return;

    aiRecLoading = true;
    aiTextDiv.innerHTML = `<div class="flex items-center gap-2 text-sm text-slate-400 py-2"><span class="material-symbols-outlined text-[18px] spin">progress_activity</span>Memuat saran AI...</div>`;

    // Kirim periode yg SEDANG aktif di UI Statistik (bulanan/tahunan + bulan/tahun terpilih)
    // supaya rekomendasi yg dihasilkan AI selalu sesuai dgn apa yg sedang dilihat pengguna.
    const mode = statistikMode, bulan = statistikBulan, tahun = statistikTahun;
    google.script.run
      .withSuccessHandler(rekomendasi => {
        aiRecLoading = false;
        if (!aiTextDiv) return;
        const teks = (rekomendasi && rekomendasi.rekomendasi) || rekomendasi || '';
        if (!teks) {
          // NOTIFIKASI: server sukses dipanggil TAPI tidak ada teks rekomendasi yang
          // dikembalikan -> ini kendala juga, kasih tahu pengguna via toast, jangan diam-diam
          // tampil kosong.
          console.warn('[Rekomendasi AI] Server tidak mengembalikan teks rekomendasi apapun.');
          showToast('error', 'Rekomendasi AI kosong, coba ketuk dua kali lagi.');
          resetAiRecommendationCard_();
          return;
        }
        renderRekomendasiDenganTransisi_(aiTextDiv, teks);
      })
      .withFailureHandler(err => {
        aiRecLoading = false;
        console.error('[Rekomendasi AI] Gagal memanggil getRekomendasiKeuanganServer:', err);
        // NOTIFIKASI: tampilkan TOAST error (selain pesan detail di dalam kartu) supaya
        // kendala pada fitur AI ini langsung kelihatan, sama seperti fitur scan struk AI.
        showToast('error', 'Gagal memuat rekomendasi AI: ' + (err.message || err));
        // Kalau errornya karena masalah API key → buka modal input key baru
        maybeShowAIKeyProblemModal_(err && err.message);
        if (!aiTextDiv) return;
        aiTextDiv.innerHTML = `<div class="flex items-start gap-2 p-3 rounded-8 bg-danger-light"><span class="material-symbols-outlined text-danger text-[16px] mt-0.5">error</span><p class="text-sm text-slate-700">Gagal memuat: ${escHtml_(err.message || err)}</p></div>`;
      })
      .getRekomendasiKeuanganServer(mode, bulan, tahun);
  }

  // Render hasil rekomendasi dgn ANIMASI TRANSISI DROPDOWN (max-height 0 -> terbuka), bukan
  // langsung muncul instan. Class ".ai-rec-dropdown"/".open" didefinisikan di ViewCSS.html.
  function renderRekomendasiDenganTransisi_(aiTextDiv, teks) {
    const html = renderRekomendasiAI_(teks);
    aiTextDiv.innerHTML = `<div class="ai-rec-dropdown">${html}</div>`;
    const dropdownEl = aiTextDiv.querySelector('.ai-rec-dropdown');
    if (dropdownEl) {
      // Delay 2 frame supaya browser sempat "commit" state max-height:0 dulu sebelum class
      // .open ditambahkan - kalau tidak, transisi CSS tidak akan ter-animasi (langsung snap).
      requestAnimationFrame(() => requestAnimationFrame(() => dropdownEl.classList.add('open')));
    }
  }

  // ==========================================
  // LOAD & RENDER UTANG & CICILAN
  // ==========================================
  function loadUtang() {
    if (cachedUtang) { renderUtangUI(cachedUtang); return; }
    google.script.run
      .withSuccessHandler(res => { cachedUtang = res; renderUtangUI(res); })
      .withFailureHandler(err => { showToast('error', 'Gagal memuat utang: ' + err.message); })
      .getUtangServer();
  }

  // Parse "dd/MM/yyyy" (format dari server) jadi Date lokal, aman dari ambiguitas
  // parsing string tanggal browser yang beda-beda antar locale.
  function parseTglJatuh_(tglStr) {
    if (!tglStr) return null;
    const parts = String(tglStr).split('/');
    if (parts.length !== 3) return null;
    const [dd, mm, yyyy] = parts.map(Number);
    const d = new Date(yyyy, mm - 1, dd);
    return isNaN(d.getTime()) ? null : d;
  }

  function hitungHariSisa_(tglStr) {
    const tgl = parseTglJatuh_(tglStr);
    if (!tgl) return null;
    const now = new Date();
    const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    return Math.ceil((tgl - startOfToday) / 86400000);
  }

  // Konversi "dd/MM/yyyy" (format dari server) -> "yyyy-MM-dd" (format yang WAJIB dipahami
  // <input type="date">). PENTING: tanpa ini, mengisi value input date langsung dgn string
  // "dd/MM/yyyy" gagal SENYAP (browser menolak format asing & field jadi kosong) -> ini akar
  // penyebab field "Tgl Jatuh Tempo" terlihat kosong tiap kali modal Edit Utang dibuka.
  function formatTglJatuhForInput_(tglStr) {
    const d = parseTglJatuh_(tglStr);
    if (!d) return '';
    return d.toLocaleDateString('en-CA'); // 'en-CA' -> yyyy-MM-dd, konsisten dgn AGENTS.md
  }

  // NOTIFIKASI JATUH TEMPO (H-5): tampilkan banner ringkas di atas daftar utang & cicilan
  // kalau ada item AKTIF (status != 'Lunas') yang jatuh tempo dalam <= 5 hari ke depan.
  // Termasuk yang SUDAH TERLAMBAT (hariSisa negatif) supaya tetap terlihat sampai
  // dibayar/dilunasi/diedit oleh pengguna. Banner otomatis disembunyikan kalau tidak ada.
  function renderUtangDueSoonNotif_(list) {
    const wrap = document.getElementById('utangJatuhTempoNotif');
    const listEl = document.getElementById('utangJatuhTempoNotifList');
    if (!wrap || !listEl) return;

    const dueSoon = (list || [])
      .filter(u => u.status !== 'Lunas')
      .map(u => ({ ...u, hariSisa: hitungHariSisa_(u.tglJatuh) }))
      .filter(u => u.hariSisa !== null && u.hariSisa <= 5)
      .sort((a, b) => a.hariSisa - b.hariSisa);

    if (!dueSoon.length) {
      wrap.classList.add('hidden');
      listEl.innerHTML = '';
      return;
    }

    listEl.innerHTML = dueSoon.map(u => {
      let label;
      if (u.hariSisa < 0) label = `Terlambat ${Math.abs(u.hariSisa)} hari`;
      else if (u.hariSisa === 0) label = 'Jatuh tempo hari ini';
      else label = `${u.hariSisa} hari lagi`;
      return `<div class="flex items-center justify-between gap-2 text-xs text-danger">
        <span class="truncate">${escHtml_(u.namaPihak)} · Rp ${Number(u.sisa).toLocaleString('id-ID')}</span>
        <span class="font-semibold shrink-0 whitespace-nowrap">${label}</span>
      </div>`;
    }).join('');
    wrap.classList.remove('hidden');
  }

  function renderUtangUI(data) {
    const list = (data && data.list) || [];

    // ===== Hero Summary (mengikuti gaya kartu "Total Semua Saldo" di Budget,
    // dipakai warna merah karena --danger memang disiapkan sbg "Signature Accent
    // untuk Urgency/Utang" -- lihat ViewCSS.html) =====
    const aktif = list.filter(u => u.status !== 'Lunas');
    const totalSisaAktif = aktif.reduce((a, u) => a + (Number(u.sisa) || 0), 0);
    const terdekat = aktif
      .map(u => ({ ...u, hariSisa: hitungHariSisa_(u.tglJatuh) }))
      .filter(u => u.hariSisa !== null)
      .sort((a, b) => a.hariSisa - b.hariSisa)[0];

    const heroEl = document.getElementById('totalUtangAktif');
    const heroSubEl = document.getElementById('utangHeroSub');
    const heroCountEl = document.getElementById('utangHeroCount');
    if (heroEl) heroEl.textContent = 'Rp ' + totalSisaAktif.toLocaleString('id-ID');
    if (heroCountEl) heroCountEl.textContent = aktif.length + ' aktif';
    if (heroSubEl) {
      heroSubEl.textContent = terdekat
        ? `Terdekat: ${terdekat.namaPihak} — jatuh tempo ${terdekat.tglJatuh}`
        : (list.length ? 'Semua utang/cicilan sudah lunas 🎉' : 'Belum ada data utang/cicilan.');
    }

    renderUtangDueSoonNotif_(list);

    utangSortedList = list
      .slice()
      .sort((a, b) => {
        if (a.status !== b.status) return a.status === 'Lunas' ? 1 : -1;
        return (hitungHariSisa_(a.tglJatuh) ?? 9999) - (hitungHariSisa_(b.tglJatuh) ?? 9999);
      });

    layoutAndRenderUtangPages_();
    window.cachedUtang = data;
  }

  // ==========================================
  // "PAS LAYAR" (TANPA SCROLL) + PAGINATION KARTU TAB UTANG
  // ==========================================
  // Set tinggi #utangViewport (bungkus seluruh tab Utang) supaya PERSIS sebesar sisa ruang
  // kosong di viewport browser (dikurangi header situs sticky di atas & nav mengambang di
  // bawah), berapapun tingginya layar/perangkat. Ini yang membuat header/hero/notif/judul
  // TIDAK PERNAH mendorong daftar kartu sampai perlu discroll -- area kartu di bawahnya
  // (#utangListViewport) tinggal mengikuti sisa ruang lewat flex:1 di CSS.
  function fitUtangViewport() {
    const viewport = document.getElementById('utangViewport');
    const viewSection = document.getElementById('viewUtang');
    if (!viewport || !viewSection || viewSection.classList.contains('hidden')) return;

    const nav = document.querySelector('nav'); // satu-satunya <nav> di app ini = nav bawah
    const navH = nav ? nav.getBoundingClientRect().height : 0;
    // Nav bawah "mengambang" dgn jarak dari tepi viewport di layar md+ (md:bottom-6 = 24px),
    // tapi mepet ke tepi di mobile -> beri jarak aman berbeda supaya kartu terakhir tidak
    // ketimpa/terlalu dekat dgn nav pada kedua kasus.
    const navGap = window.innerWidth >= 768 ? 28 : 10;
    const top = viewport.getBoundingClientRect().top; // jarak dari atas viewport (otomatis akun header sticky di atasnya)
    // Pakai visualViewport.height kalau tersedia -> lebih akurat drpd window.innerHeight di
    // banyak browser mobile (terutama Safari iOS) saat address bar/toolbar sedang muncul-
    // sembul; window.innerHeight kadang masih mengacu ke tinggi layout lama sesaat sebelum
    // browser selesai animasi toolbar-nya, yang berujung salah hitung & memicu overflow tipis.
    const viewportHeight = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
    const available = viewportHeight - top - navH - navGap;
    viewport.style.height = Math.max(280, Math.round(available)) + 'px';
  }

  // Ukur tinggi RENDER SEBENARNYA tiap kartu (termasuk margin-bottom "mb-3") dengan merender
  // sementara ke elemen probe yang disembunyikan (visibility:hidden, di luar alur normal) tapi
  // lebarnya disamakan dgn area kartu asli -> supaya perhitungan wrap teks/tinggi akurat,
  // bukan tebakan/nilai tetap. Tinggi kartu memang bisa beda-beda per item (ada yg punya
  // deskripsi/log catatan/estimasi cicilan, ada yg tidak).
  function ukurTinggiKartuUtang_(sortedList) {
    const listViewport = document.getElementById('utangListViewport');
    const lebar = listViewport ? listViewport.clientWidth : 360;
    const probe = document.createElement('div');
    probe.style.cssText = `position:absolute; visibility:hidden; pointer-events:none; top:0; left:-9999px; width:${lebar}px; height:auto;`;
    document.body.appendChild(probe);
    const heights = sortedList.map(item => {
      probe.innerHTML = renderUtangCard(item);
      const cardEl = probe.firstElementChild;
      if (!cardEl) return 100;
      const marginBottom = parseFloat(getComputedStyle(cardEl).marginBottom) || 0;
      return cardEl.offsetHeight + marginBottom;
    });
    document.body.removeChild(probe);
    return heights;
  }

  // Bagi utangSortedList jadi beberapa "halaman" secara GREEDY: kartu terus ditambahkan ke
  // halaman berjalan selama masih muat di tinggi area yg tersedia, begitu kartu berikutnya
  // akan melebihi -> mulai halaman baru. Hasilnya: tiap halaman selalu presisi muat di layar,
  // & jumlah kartu per halaman otomatis menyesuaikan (halaman berisi kartu panjang bisa lebih
  // sedikit dari halaman berisi kartu pendek).
  function bagiHalamanUtang_(sortedList, tinggiTersedia) {
    if (!sortedList.length) return [[]];
    const heights = ukurTinggiKartuUtang_(sortedList);
    const pages = [];
    let page = [];
    let tinggiTerpakai = 0;
    sortedList.forEach((item, i) => {
      const h = heights[i];
      if (page.length > 0 && tinggiTerpakai + h > tinggiTersedia) {
        pages.push(page);
        page = [];
        tinggiTerpakai = 0;
      }
      page.push(item);
      tinggiTerpakai += h;
    });
    if (page.length) pages.push(page);
    return pages.length ? pages : [[]];
  }

  // Entry point utama: dipanggil tiap kali data utang berubah (load awal, bayar/lunasin,
  // tambah/edit/hapus) MAUPUN saat window di-resize/rotate selagi tab Utang aktif.
  function layoutAndRenderUtangPages_() {
    const track = document.getElementById('utangListTrack');
    const listViewport = document.getElementById('utangListViewport');
    if (!track || !listViewport) return;

    fitUtangViewport(); // pastikan tinggi #utangViewport (& otomatis #utangListViewport) sudah pas dulu

    if (!utangSortedList.length) {
      track.innerHTML = `<div class="utang-list-page">
        <div class="clay clay-card clay-key-danger bg-white p-8 text-center">
          <span class="material-symbols-outlined text-[32px] text-slate-300 mb-2 block">account_balance</span>
          <p class="text-sm text-slate-500">Belum ada utang / cicilan.</p>
        </div>
      </div>`;
      utangPages = [[]];
      utangCurrentPageIdx = 0;
      renderUtangPaginationControls_();
      terapkanTransformHalamanUtang_(false);
      return;
    }

    const tinggiTersedia = listViewport.clientHeight;
    utangPages = bagiHalamanUtang_(utangSortedList, tinggiTersedia);

    // Pertahankan halaman yg sedang dilihat kalau masih valid (mis. setelah bayar cicilan
    // tanpa mengubah jumlah halaman); kalau di luar jangkauan (mis. jumlah data berkurang
    // krn dihapus) -> fallback ke halaman terakhir yang tersedia.
    if (utangCurrentPageIdx >= utangPages.length) utangCurrentPageIdx = Math.max(0, utangPages.length - 1);

    track.innerHTML = utangPages
      .map(page => `<div class="utang-list-page">${page.map(renderUtangCard).join('')}</div>`)
      .join('');

    renderUtangPaginationControls_();
    terapkanTransformHalamanUtang_(false);
  }

  // Susun kontrol pagination (panah kiri/kanan + titik halaman) & indikator "Halaman x/y" di
  // judul. Otomatis kosong/tersembunyi kalau datanya cuma cukup utk 1 halaman.
  function renderUtangPaginationControls_() {
    const controls = document.getElementById('utangPaginationControls');
    const indicator = document.getElementById('utangPageIndicator');
    const totalPages = utangPages.length;

    if (indicator) indicator.textContent = totalPages > 1 ? `Halaman ${utangCurrentPageIdx + 1}/${totalPages}` : '';
    if (!controls) return;

    if (totalPages <= 1) { controls.innerHTML = ''; return; }

    const dots = utangPages.map((_, i) =>
      `<button type="button" aria-label="Ke halaman ${i + 1}" onclick="goToUtangPage(${i})" class="utang-pagination-dot ${i === utangCurrentPageIdx ? 'active' : ''}"></button>`
    ).join('');

    controls.innerHTML = `
      <button type="button" aria-label="Halaman sebelumnya" onclick="goToUtangPage(${utangCurrentPageIdx - 1})" class="utang-pagination-arrow" ${utangCurrentPageIdx === 0 ? 'disabled' : ''}>
        <span class="material-symbols-outlined text-[18px]">chevron_left</span>
      </button>
      <div class="utang-pagination-dots">${dots}</div>
      <button type="button" aria-label="Halaman berikutnya" onclick="goToUtangPage(${utangCurrentPageIdx + 1})" class="utang-pagination-arrow" ${utangCurrentPageIdx === totalPages - 1 ? 'disabled' : ''}>
        <span class="material-symbols-outlined text-[18px]">chevron_right</span>
      </button>`;
  }

  // Pindah ke halaman ke-idx dgn transisi geser mulus (CSS transform, lihat .utang-list-track
  // di ViewCSS.html). Dipanggil dari tombol panah & titik pagination.
  function goToUtangPage(idx) {
    if (idx < 0 || idx >= utangPages.length || idx === utangCurrentPageIdx) return;
    utangCurrentPageIdx = idx;
    terapkanTransformHalamanUtang_(true);
    renderUtangPaginationControls_();
  }

  // ==========================================
  // SWIPE GESTURE (mobile) — pindah halaman kartu Utang & Cicilan
  // ==========================================
  // Swipe kiri = halaman berikutnya, swipe kanan = halaman sebelumnya. Dipasang SEKALI di
  // container #utangListViewport (bukan per-kartu) via addEventListener biasa (bukan atribut
  // ontouch* inline) supaya tidak bentrok dgn long-press per-kartu (ontouchstart/move/end di
  // renderUtangCard(), pakai variabel touchStartX/Y yang berbeda) -> event sentuhan tetap
  // bubbling naik ke sini dari kartu manapun, di sini cuma dibaca koordinatnya, tidak
  // menghentikan propagasi, jadi tap/long-press/tombol di kartu tetap berfungsi normal.
  // #utangListViewport sendiri elemen tetap (tidak pernah di-innerHTML ulang, yang berubah
  // cuma isi #utangListTrack di dalamnya) -> aman dipasang sekali saja lewat flag _swipeBound.
  //
  // Track DIGESER MENGIKUTI JARI secara live selama drag (bukan cuma dihitung sesudah jari
  // dilepas) -> animasinya terasa jauh lebih halus/responsif drpd sekadar snap sesudahnya.
  // Ada juga efek "rubber-band" (resistensi 0.35x) saat drag melewati halaman pertama/
  // terakhir supaya terasa "mentok pegas", bukan diam kaku.
  let utangSwipeStartX = null;
  let utangSwipeStartY = null;
  let utangSwipeDragging = false; // true kalau gesture sudah dipastikan horizontal (sedang drag track)
  let utangSwipeDeltaPx = 0;

  function initUtangSwipe_() {
    const el = document.getElementById('utangListViewport');
    if (!el || el._swipeBound) return;
    el._swipeBound = true;

    el.addEventListener('touchstart', (e) => {
      if (!e.touches || e.touches.length !== 1) { utangSwipeStartX = null; utangSwipeStartY = null; return; }
      utangSwipeStartX = e.touches[0].clientX;
      utangSwipeStartY = e.touches[0].clientY;
      utangSwipeDragging = false;
      utangSwipeDeltaPx = 0;
    }, { passive: true });

    el.addEventListener('touchmove', (e) => {
      if (utangSwipeStartX === null || !e.touches || e.touches.length !== 1) return;
      const touch = e.touches[0];
      const diffX = touch.clientX - utangSwipeStartX;
      const diffY = touch.clientY - utangSwipeStartY;
      const track = document.getElementById('utangListTrack');
      if (!track) return;

      if (!utangSwipeDragging) {
        // Tunggu gerakan cukup jelas dulu sebelum memutuskan ini horizontal (drag halaman)
        // atau vertical (scroll darurat native, dibiarkan lewat touch-action:pan-y) -> supaya
        // scroll vertikal tidak salah "ketarik" ikut geser halaman.
        if (Math.abs(diffX) < 8 && Math.abs(diffY) < 8) return;
        if (Math.abs(diffX) <= Math.abs(diffY)) { utangSwipeStartX = null; return; }
        utangSwipeDragging = true;
        track.style.transition = 'none'; // matikan transisi CSS selama drag supaya benar² mengikuti jari 1:1
      }

      utangSwipeDeltaPx = diffX;
      const totalPages = utangPages.length || 1;
      let deltaPercent = (diffX / el.clientWidth) * 100;
      if ((utangCurrentPageIdx === 0 && deltaPercent > 0) ||
          (utangCurrentPageIdx === totalPages - 1 && deltaPercent < 0)) {
        deltaPercent *= 0.35; // rubber-band di batas halaman pertama/terakhir
      }
      track.style.transform = `translateX(calc(-${utangCurrentPageIdx * 100}% + ${deltaPercent}%))`;
    }, { passive: true });

    el.addEventListener('touchend', () => {
      const wasDragging = utangSwipeDragging;
      const deltaPx = utangSwipeDeltaPx;
      utangSwipeStartX = null; utangSwipeStartY = null;
      utangSwipeDragging = false; utangSwipeDeltaPx = 0;
      if (!wasDragging) return;

      const SWIPE_MIN_DIST = 42; // px — ambang minimal supaya swipe pendek/ragu² tidak kepicu ganti halaman
      const totalPages = utangPages.length || 1;
      let targetIdx = utangCurrentPageIdx;
      if (deltaPx <= -SWIPE_MIN_DIST) targetIdx = utangCurrentPageIdx + 1; // swipe kiri -> halaman berikutnya
      else if (deltaPx >= SWIPE_MIN_DIST) targetIdx = utangCurrentPageIdx - 1; // swipe kanan -> halaman sebelumnya

      if (targetIdx !== utangCurrentPageIdx && targetIdx >= 0 && targetIdx < totalPages) {
        goToUtangPage(targetIdx); // animasi resmi pindah halaman (transition CSS otomatis nyala lagi)
      } else {
        terapkanTransformHalamanUtang_(true); // di bawah ambang / di batas halaman -> pegas balik ke posisi semula
      }
    }, { passive: true });

    el.addEventListener('touchcancel', () => {
      utangSwipeStartX = null; utangSwipeStartY = null;
      if (utangSwipeDragging) { utangSwipeDragging = false; utangSwipeDeltaPx = 0; terapkanTransformHalamanUtang_(true); }
    }, { passive: true });
  }

  function terapkanTransformHalamanUtang_(animate) {
    const track = document.getElementById('utangListTrack');
    if (!track) return;
    if (!animate) {
      // Render ulang isi halaman (mis. setelah data berubah) TIDAK boleh ikut ter-animasi
      // seolah-olah user menggeser halaman -> matikan transisi sesaat, paksa reflow, baru
      // nyalakan lagi supaya interaksi user berikutnya (klik panah/titik) tetap mulus.
      track.style.transition = 'none';
      track.style.transform = `translateX(-${utangCurrentPageIdx * 100}%)`;
      void track.offsetHeight;
      track.style.transition = '';
    } else {
      track.style.transition = ''; // pastikan transition CSS nyala lagi (bisa saja sempat di-'none'-kan pas drag jari)
      track.style.transform = `translateX(-${utangCurrentPageIdx * 100}%)`;
    }
  }

  // Format ISO timestamp (kolom LAST_UPDATED) jadi "dd/MM/yyyy HH:mm" lokal.
  function formatLastUpdated_(isoStr) {
    if (!isoStr) return '';
    const d = new Date(isoStr);
    if (isNaN(d.getTime())) return '';
    const pad = n => String(n).padStart(2, '0');
    return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function renderUtangCard(item) {
    const isLunas = item.status === 'Lunas';
    const hariSisa = hitungHariSisa_(item.tglJatuh);
    const isMendesak = !isLunas && hariSisa !== null && hariSisa <= 7;
    const isCicilan = item.tipe !== 'Utang'; // Cicilan / Cicilan Spaylater / Cicilan Spinjam -> "Bayar", Utang -> "Lunasin"
    const cicilanPerBulan = Number(item.cicilanPerBulan) || 0;
    // Estimasi berapa kali cicilan lagi sampai lunas, berdasarkan sisa tagihan saat ini.
    const estimasiSisaCicilan = (isCicilan && !isLunas && cicilanPerBulan > 0)
      ? Math.ceil((Number(item.sisa) || 0) / cicilanPerBulan)
      : null;

    const progressPct = item.total > 0
      ? Math.min(100, Math.max(0, Math.round(((item.total - item.sisa) / item.total) * 100)))
      : 0;

    let dueLabel = '';
    let dueColor = 'text-slate-500';
    if (!isLunas && hariSisa !== null) {
      if (hariSisa < 0) { dueLabel = `Terlambat ${Math.abs(hariSisa)} hari`; dueColor = 'text-danger font-semibold'; }
      else if (hariSisa === 0) { dueLabel = 'Jatuh tempo hari ini'; dueColor = 'text-danger font-semibold'; }
      else if (hariSisa <= 7) { dueLabel = `${hariSisa} hari lagi`; dueColor = 'text-danger font-semibold'; }
      else { dueLabel = `${hariSisa} hari lagi`; dueColor = 'text-slate-500'; }
    }

// Tombol "Bayar"/"Lunasin" — keduanya HIJAU (seperti tombol update transaksi), teks putih.
    // Saat LUNAS tombol disembunyikan.
    const bayarBtnBg = 'linear-gradient(135deg,#059669 0%,#047857 100%)';
    const bayarBtnIcon = isCicilan ? 'payments' : 'paid';
    const bayarBtn = !isLunas ? `<button onclick="handleBayarLunasin(event, '${item.id}')"
        style="height:32px;padding:0 12px 0 9px;border:none;border-radius:8px;font-size:11.5px;font-weight:700;letter-spacing:.1px;display:inline-flex;align-items:center;gap:5px;color:#fff;box-shadow:0 2px 5px rgba(0,0,0,.2);background:${bayarBtnBg};cursor:pointer;white-space:nowrap;">
        <span class="material-symbols-outlined" style="font-size:16px;">${bayarBtnIcon}</span>${isCicilan ? 'Bayar' : 'Lunasin'}
      </button>` : '';

    // Badge status: LUNAS → hijau penuh; BELUM LUNAS → merah penuh (teks putih)
    const statusBadge = isLunas
      ? '<span class="text-[10px] px-2 py-1 rounded-full font-semibold bg-success text-white">Lunas</span>'
      : `<span class="text-[10px] px-2 py-1 rounded-full font-semibold bg-danger text-white">${isMendesak ? 'Mendesak' : 'Belum Lunas'}</span>`;

    return `<div onclick="toggleDeleteBtnUtang(this)"
          ondblclick="openUtangModal('${item.id}', 'edit')"
          ontouchstart="handleUtangLongPress(event, '${item.id}', this)"
          ontouchmove="handleUtangLongPressMove(event)"
          ontouchend="handleUtangLongPressEnd(event, this)"
          data-id="${item.id}"
          class="utang-card-item clay clay-card clay-key-danger relative bg-white p-4 mb-3 transition-all select-none cursor-pointer"
          style="${isMendesak ? 'border:1px solid rgba(229,62,62,.5);' : ''}">
      <div class="flex items-center justify-between gap-2 mb-2">
        <div class="flex items-center gap-2 min-w-0">
          <span class="clay-icon-tile clay-key-danger w-9 h-9 rounded-full bg-danger-light flex items-center justify-center shrink-0">
            <span class="material-symbols-outlined ${isLunas ? 'text-success' : 'text-danger'} text-[18px]">${isLunas ? 'task_alt' : 'account_balance_wallet'}</span>
          </span>
