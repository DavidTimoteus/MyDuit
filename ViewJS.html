  // ==========================================
  // UTANG CRUD (Tambah, Edit, Hapus)
  // ==========================================
  function openUtangModal(id, mode) {
    const modal = document.getElementById('modalUtang');
    editingUtangId = mode === 'edit' ? id : null;
    const modalTitle = document.getElementById('modalUtangTitle');
    if (modalTitle) modalTitle.textContent = mode === 'edit' ? 'Edit Utang / Cicilan' : 'Form Utang / Cicilan';
    if (modal) {
      modal.classList.remove('hidden');
      if (mode === 'edit') {
        // load existing
        const utang = cachedUtang?.list || [];
        const item = utang.find(u => u.id === id);
        if (item) {
          document.getElementById('formUtangNama').value = item.namaPihak || '';
          document.getElementById('formUtangDeskripsi').value = item.deskripsi || '';
          document.getElementById('formUtangTotal').value = item.total || 0;
          // Prefill dgn nilai jatuh tempo YANG SUDAH ADA (dikonversi ke format yyyy-MM-dd
          // yg dipahami input date) -> keputusan mengubah atau tidak diserahkan sepenuhnya
          // ke pengguna, bukan dikosongkan/dipaksa isi ulang.
          document.getElementById('formUtangTglJatuh').value = formatTglJatuhForInput_(item.tglJatuh);
          document.getElementById('formUtangStatus').value = item.status || 'Belum Lunas';
          document.getElementById('formUtangCicilan').value = item.cicilanPerBulan || 0;
          document.getElementById('formUtangCatatan').value = item.catatan || '';
        }
      } else {
        // reset form
        resetUtangForm();
      }
    }
  }

  function resetUtangForm() {
    editingUtangId = null;
    document.getElementById('formUtangNama').value = '';
    document.getElementById('formUtangDeskripsi').value = '';
    document.getElementById('formUtangTotal').value = '';
    document.getElementById('formUtangTglJatuh').value = new Date().toISOString().split('T')[0];
    document.getElementById('formUtangStatus').value = 'Belum Lunas';
    document.getElementById('formUtangCicilan').value = '';
    document.getElementById('formUtangCatatan').value = '';
  }

  function handleUtangSubmit(event) {
    event.preventDefault();
    const isEdit = !!editingUtangId;
    const total = Number(document.getElementById('formUtangTotal').value) || 0;
    const status = document.getElementById('formUtangStatus').value;
    const cicilanPerBulan = Number(document.getElementById('formUtangCicilan').value) || 0;
    // Tipe otomatis: kosong/0 -> "Utang", diisi -> "Cicilan" (field Tipe manual dihapus dari form).
    const tipe = cicilanPerBulan > 0 ? 'Cicilan' : 'Utang';

    const formData = {
      tanggal: new Date().toISOString().split('T')[0],
      namaPihak: document.getElementById('formUtangNama').value.trim(),
      deskripsi: document.getElementById('formUtangDeskripsi').value.trim(),
      total: total,
      tglJatuh: document.getElementById('formUtangTglJatuh').value,
      tipe: tipe,
      status: status,
      cicilanPerBulan: cicilanPerBulan,
      catatan: document.getElementById('formUtangCatatan').value.trim()
    };
    if (!formData.namaPihak) { showToast('error', 'Nama pihak wajib diisi.'); return; }

    const btn = event.target.querySelector('button[type=submit]');
    if (btn) { btn.disabled = true; btn.textContent = 'Menyimpan...'; }

    const finish = () => {
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = '<span class="material-symbols-outlined text-[16px]">save</span>Simpan';
      }
      document.getElementById('modalUtang')?.classList.add('hidden');
    };

    if (isEdit) {
      // Sisa: kalau ditandai Lunas -> 0. Kalau tidak, pertahankan proporsi sisa lama
      // relatif terhadap total lama (menghindari sisa > total baru kalau total diubah lebih kecil).
      const existing = (cachedUtang?.list || []).find(u => u.id === editingUtangId);
      let sisa = existing ? Number(existing.sisa) || 0 : total;
      if (status === 'Lunas') sisa = 0;
      else if (existing && Number(existing.total) > 0) sisa = Math.min(sisa, total);

      google.script.run
        .withSuccessHandler(res => {
          if (res && res.status === 'success') {
            showToast('success', 'Utang berhasil diperbarui!');
            cachedUtang = null; // paksa reload fresh dari server
            loadUtang();
          } else {
            showToast('error', (res && res.message) || 'Gagal memperbarui!');
          }
          finish();
        })
        .withFailureHandler(err => { showToast('error', err.message || err); finish(); })
        .updateUtangServer({ ...formData, id: editingUtangId, sisa });
    } else {
      google.script.run
        .withSuccessHandler(res => {
          if (res && res.status === 'success') {
            showToast('success', 'Utang berhasil ditambahkan!');
            cachedUtang = null;
            loadUtang();
          } else {
            showToast('error', (res && res.message) || 'Gagal menambahkan!');
          }
          finish();
        })
        .withFailureHandler(err => { showToast('error', err.message || err); finish(); })
        .simpanUtangServer(formData);
    }
  }

  // ===== DELETE (tap kartu utk toggle tombol hapus, dbl-click/long-press utk edit) =====
  function toggleDeleteBtnUtang(cardEl) {
    const isActive = cardEl.classList.contains('border-red-300');
    document.querySelectorAll('.utang-card-item').forEach(el => {
      el.classList.remove('border-red-300', 'bg-red-50');
      el.querySelector('.delete-btn-action')?.classList.add('hidden');
    });
    if (!isActive) {
      cardEl.classList.add('border-red-300', 'bg-red-50');
      cardEl.querySelector('.delete-btn-action')?.classList.remove('hidden');
    }
  }

  function handleUtangLongPress(event, id, cardEl) {
    touchStartX = event.touches[0].clientX;
    touchStartY = event.touches[0].clientY;
    const timer = setTimeout(() => { openUtangModal(id, 'edit'); }, 1200);
    window._lpTimerUtang = timer;
  }

  function handleUtangLongPressEnd() { clearTimeout(window._lpTimerUtang); }

  function handleUtangLongPressMove(event) {
    if (!event.touches || event.touches.length === 0) return;
    const diffX = Math.abs(event.touches[0].clientX - touchStartX);
    const diffY = Math.abs(event.touches[0].clientY - touchStartY);
    if (diffX > 10 || diffY > 10) clearTimeout(window._lpTimerUtang);
  }

  // ==========================================
  // BAYAR CICILAN / LUNASIN UTANG
  // ==========================================
  let targetUtangToBayar = null;

  function handleBayarLunasin(event, id) {
    event.stopPropagation(); // jangan trigger toggleDeleteBtnUtang di card
    const item = (cachedUtang?.list || []).find(u => u.id === id);
    if (!item) return;
    const isCicilan = item.tipe !== 'Utang';

    const modal = document.getElementById('modalBayarUtang');
    const icon = document.getElementById('bayarUtangIcon');
    const title = document.getElementById('bayarUtangTitle');
    const desc = document.getElementById('bayarUtangDesc');
    const amountEl = document.getElementById('bayarUtangAmount');
    const btnConfirm = document.getElementById('btnConfirmBayarUtang');
    if (!modal || !btnConfirm) return;

    if (isCicilan) {
      const jumlahBayar = Math.min(Number(item.cicilanPerBulan) || 0, Number(item.sisa) || 0);
      if (jumlahBayar <= 0) { showToast('error', 'Nominal cicilan per bulan belum diisi / sisa sudah 0.'); return; }
      utangBayarJumlahAktif = jumlahBayar;
      icon.textContent = 'payments';
      icon.className = 'material-symbols-outlined text-[40px] mb-2';
      icon.style.color = '#059669';
      title.textContent = 'Bayar Cicilan Bulan Ini?';
      desc.textContent = `${item.namaPihak} — sisa saat ini Rp ${Number(item.sisa).toLocaleString('id-ID')}`;
      amountEl.textContent = 'Rp ' + jumlahBayar.toLocaleString('id-ID');
      btnConfirm.textContent = 'Ya, Bayar';
      btnConfirm.className = 'px-4 py-2.5 rounded-xl text-white text-xs font-semibold shadow-sm transition-colors';
      btnConfirm.style.background = 'linear-gradient(135deg,#059669 0%,#047857 100%)';
    } else {
      utangBayarJumlahAktif = Number(item.sisa) || 0;
      icon.textContent = 'paid';
      icon.className = 'material-symbols-outlined text-[40px] mb-2';
      icon.style.color = '#059669';
      title.textContent = 'Lunasi Utang Ini?';
      desc.textContent = item.namaPihak;
      amountEl.textContent = 'Rp ' + Number(item.sisa).toLocaleString('id-ID');
      btnConfirm.textContent = 'Ya, Lunasin';
      btnConfirm.className = 'px-4 py-2.5 rounded-xl text-white text-xs font-semibold shadow-sm transition-colors';
      btnConfirm.style.background = 'linear-gradient(135deg,#059669 0%,#047857 100%)';
    }

    // Isi dropdown Sumber Dana dari daftar akun Dompet yang sudah ada (dimuat kalau
    // belum ada di cache), lalu reset pilihannya supaya user WAJIB memilih ulang tiap
    // kali membuka modal ini (menghindari salah potong akun karena pilihan lama nyangkut).
    const selSumber = document.getElementById('formBayarUtangSumber');
    if (selSumber) selSumber.value = '';
    if (cachedDompet && cachedDompet.rekening) {
      populateBayarUtangSumber(cachedDompet.rekening.map(r => r.nama));
    } else {
      google.script.run.withSuccessHandler(populateBayarUtangSumber).fetchSumberAkunServer();
    }
    if (selSumber) selSumber.value = '';
    checkBayarUtangSaldo_(); // reset notifikasi saldo & state tombol konfirmasi ke kondisi awal (belum ada akun terpilih)

    targetUtangToBayar = id;
    modal.classList.remove('hidden');
  }

  // Dipanggil via onchange di <select id="formBayarUtangSumber"> (ViewUtang.html) tiap kali
  // pengguna ganti pilihan Sumber Dana, dan juga dipanggil manual dari handleBayarLunasin()
  // (reset state) & confirmBayarUtang() (jaring pengaman terakhir). Membandingkan saldo akun
  // terpilih (dari cachedDompet) dgn nominal yang akan dibayar (utangBayarJumlahAktif) ->
  // kalau tidak cukup, tampilkan notifikasi teks di bawah form & nonaktifkan tombol konfirmasi
  // supaya pengguna tidak bisa membuat saldo akun jadi minus.
  function checkBayarUtangSaldo_() {
    const sel = document.getElementById('formBayarUtangSumber');
    const warning = document.getElementById('bayarUtangSaldoWarning');
    const warningText = document.getElementById('bayarUtangSaldoWarningText');
    const btnConfirm = document.getElementById('btnConfirmBayarUtang');
    if (!sel || !warning || !btnConfirm) return true;

    const namaAkun = sel.value;
    if (!namaAkun) { warning.classList.add('hidden'); btnConfirm.disabled = false; return true; }

    const rek = ((cachedDompet && cachedDompet.rekening) || []).find(r => r.nama === namaAkun);
    const saldo = rek ? (Number(rek.saldo) || 0) : 0;
    const cukup = saldo >= utangBayarJumlahAktif;

    if (!cukup) {
      const kurang = utangBayarJumlahAktif - saldo;
      // innerHTML (bukan textContent) supaya bagian "Kurang RpX" bisa ditebalkan (<strong>) --
      // aman krn tidak lagi menyisipkan nama akun/teks bebas dari pengguna ke dalam string ini,
      // semua nilai di sini murni angka hasil toLocaleString().
      if (warningText) {
        warningText.innerHTML = `Saldo kurang! Tersisa Rp${saldo.toLocaleString('id-ID')}, dibutuhkan Rp${utangBayarJumlahAktif.toLocaleString('id-ID')} (<strong>Kurang Rp${kurang.toLocaleString('id-ID')}</strong>).`;
      }
      warning.classList.remove('hidden');
    } else {
      warning.classList.add('hidden');
    }
    btnConfirm.disabled = !cukup;
    return cukup;
  }

  function closeBayarUtangModal() {
    targetUtangToBayar = null;
    document.getElementById('modalBayarUtang')?.classList.add('hidden');
  }

  function confirmBayarUtang() {
    if (!targetUtangToBayar || !cachedUtang) return;
    const id = targetUtangToBayar;
    const item = cachedUtang.list.find(u => u.id === id);
    if (!item) { closeBayarUtangModal(); return; }

    // Sumber Dana WAJIB dipilih — dipakai server utk memotong saldo akun terkait &
    // mencatat transaksi Pengeluaran/Pembayaran otomatis. Jangan lanjut kalau kosong.
    const sumber = document.getElementById('formBayarUtangSumber')?.value.trim();
    if (!sumber) { showToast('error', 'Pilih sumber dana pembayaran dulu.'); return; }

    const isCicilan = item.tipe !== 'Utang';
    const jumlahBayar = isCicilan ? Math.min(Number(item.cicilanPerBulan) || 0, Number(item.sisa) || 0) : (Number(item.sisa) || 0);

    // Jaring pengaman terakhir: tombol konfirmasi seharusnya sudah dinonaktifkan oleh
    // checkBayarUtangSaldo_() kalau saldo tidak cukup, tapi tetap divalidasi ulang di sini
    // (mis. cachedDompet berubah di antara waktu modal dibuka & tombol ditekan).
    utangBayarJumlahAktif = jumlahBayar;
    if (!checkBayarUtangSaldo_()) {
      showToast('error', 'Saldo sumber dana tidak mencukupi untuk pembayaran ini.');
      return;
    }

    const snapshotUtang = cloneCache_(cachedUtang);
    const snapshotDompet = cloneCache_(cachedDompet);

    closeBayarUtangModal();

    // Optimistic update: langsung update tampilan sebelum respons server datang
    const nowIso = new Date().toISOString();
    item.sisa = Math.max(0, (Number(item.sisa) || 0) - jumlahBayar);
    item.lastUpdated = nowIso;
    if (item.sisa <= 0) item.status = 'Lunas';
    renderUtangUI(cachedUtang);
    // Optimistic: potong saldo akun sumber di tampilan Dompet juga
    if (cachedDompet && cachedDompet.rekening) {
      const rek = cachedDompet.rekening.find(r => r.nama === sumber);
      if (rek) { rek.saldo = (Number(rek.saldo) || 0) - jumlahBayar; cachedDompet.totalSaldo = (Number(cachedDompet.totalSaldo) || 0) - jumlahBayar; }
      renderDompetUI(cachedDompet);
    }
    showToast('success', isCicilan ? 'Cicilan berhasil dibayar!' : 'Utang berhasil dilunasi!');

    const onFail = (msg) => {
      cachedUtang = snapshotUtang;
      cachedDompet = snapshotDompet;
      renderUtangUI(cachedUtang);
      if (cachedDompet) renderDompetUI(cachedDompet);
      showToast('error', msg || 'Gagal memproses, perubahan dibatalkan.');
    };

    const runner = google.script.run
      .withSuccessHandler(res => {
        if (!res || res.status !== 'success') { onFail(res && res.message); return; }
        cachedUtang = null; // paksa reload fresh dari server (sinkron dgn LAST_UPDATED asli)
        loadUtang();
        if (res.dompet) { cachedDompet = res.dompet; renderDompetUI(cachedDompet); populateSumberAkun(cachedDompet.rekening.map(r => r.nama)); }
        // Pembayaran ini baru saja tercatat sebagai transaksi Pengeluaran di 'in/out' ->
        // cache Riwayat JS lama sudah stale, paksa reload fresh saat tab Riwayat dibuka lagi.
        cachedRiwayat = null;
      })
      .withFailureHandler(err => onFail(err && err.message));

    if (isCicilan) {
      runner.bayarCicilanServer(id, sumber);
    } else {
      runner.lunasinUtangServer(id, sumber);
    }
  }

  function openDeleteUtangModal(id, event) {

    targetUtangToDelete = id;

  function closeDeleteUtangModal() {
    targetUtangToDelete = null;
    document.getElementById('modalHapusUtang')?.classList.add('hidden');

  function confirmDeleteUtang() {

    if (btnConfirm) { btnConfirm.innerText = 'Menghapus...'; btnConfirm.disabled = true; }

    const idToDelete = targetUtangToDelete;

    renderUtangUI(cachedUtang);
    showToast('success', 'Utang berhasil dihapus!');

    google.script.run
      .withSuccessHandler(res => {
        if (btnConfirm) { btnConfirm.innerText = 'Ya, Hapus'; btnConfirm.disabled = false; }
        if (!res || res.status !== 'success') {
          cachedUtang = snapshotUtang;
          renderUtangUI(cachedUtang);
          showToast('error', (res && res.message) || 'Gagal menghapus.');
          return;
        }
      })
      .withFailureHandler(err => {
        if (btnConfirm) { btnConfirm.innerText = 'Ya, Hapus'; btnConfirm.disabled = false; }
        cachedUtang = snapshotUtang;
        renderUtangUI(cachedUtang);
        showToast('error', 'Terputus, data dikembalikan: ' + (err.message || err));
      })
      .hapusUtangServer(idToDelete);
  }

  // ===== TOUCH HANDLERS kartu rekening (stack horizontal) =====
  // Menggabungkan 3 interaksi di elemen yg sama:
  // 1) TAP singkat (tanpa geser signifikan) -> event 'click' native tetap jalan normal
  //    (toggleDeleteBtnRekening, lihat onclick di renderRekeningCard()), TIDAK ditangani di sini.
  // 2) TAHAN >=1.2 detik TANPA geser -> buka modal detail riwayat perubahan (log lengkap),
  //    lihat openDetailLogRekeningModal(). Menggantikan perilaku lama (dulu tahan -> buka Edit;
  //    Edit sekarang dipicu double-click/dblclick, TIDAK berubah).
  // 3) GESER horizontal (>=10px, sumbu X lebih dominan dr Y) -> dianggap swipe stack: kartu
  //    ikut jari (live drag feedback) & long-press timer otomatis dibatalkan; dilepas dgn jarak
  //    >=SWIPE_MIN_DIST -> pindah kartu (goToRekeningStack_()), kalau kurang -> kartu balik
  //    ke posisi semula. Geser dominan VERTIKAL dibiarkan lolos (scroll halaman normal),
  //    konsisten dgn "touch-action: pan-y" di .rekening-stack-card (ViewCSS.html). Hanya
  //    kartu PALING DEPAN (delta 0) yg pointer-events aktif (lihat
  //    applyRekeningStackTransform_()) jadi handler ini otomatis hanya berlaku utk kartu depan.
  let rekeningTouchStartX = null;
  let rekeningTouchStartY = null;
  let rekeningSwipeDragging = false;

  function handleRekeningTouchStart_(event, cardEl) {
    if (!event.touches || event.touches.length !== 1) return;
    rekeningTouchStartX = event.touches[0].clientX;
    rekeningTouchStartY = event.touches[0].clientY;
    rekeningSwipeDragging = false;

    clearTimeout(window._rekLpTimer);
    window._rekLpTimer = setTimeout(() => {
      openDetailLogRekeningModal(JSON.parse(cardEl.getAttribute('data-item')));
    }, 1200);
  }

  function handleRekeningTouchMove_(event, cardEl) {
    if (!event.touches || event.touches.length !== 1 || rekeningTouchStartX === null) return;
    const touch = event.touches[0];
    const diffX = touch.clientX - rekeningTouchStartX;
    const diffY = touch.clientY - rekeningTouchStartY;

    if (!rekeningSwipeDragging) {
      if (Math.abs(diffX) < 10 && Math.abs(diffY) < 10) return;
      clearTimeout(window._rekLpTimer); // sudah bergerak -> batalkan long-press
      if (Math.abs(diffX) <= Math.abs(diffY)) { rekeningTouchStartX = null; return; } // dominan vertikal -> bukan swipe stack, biarkan scroll halaman normal
      rekeningSwipeDragging = true;
    }

    const rotate = Math.max(-6, Math.min(6, diffX / 18));
    cardEl.style.transition = 'none';
    cardEl.style.transform = `translateX(${diffX}px) rotate(${rotate}deg)`;
    cardEl.style.opacity = String(Math.max(0.5, 1 - Math.abs(diffX) / 300));
  }

  function handleRekeningTouchEnd_(event, cardEl) {
    clearTimeout(window._rekLpTimer);

    if (!rekeningSwipeDragging) {
      rekeningTouchStartX = null; rekeningTouchStartY = null;
      return; // TAP biasa -> biarkan event 'click' native yg urus (toggleDeleteBtnRekening)
    }

    const SWIPE_MIN_DIST = 60; // px — ambang minimal supaya swipe pendek/ragu² tidak kepicu ganti kartu
    const diffX = (event.changedTouches && event.changedTouches[0]) ? event.changedTouches[0].clientX - rekeningTouchStartX : 0;

    if (diffX <= -SWIPE_MIN_DIST) {
      nextRekeningStack_(); // swipe ke KIRI -> rekening berikutnya
    } else if (diffX >= SWIPE_MIN_DIST) {
      prevRekeningStack_(); // swipe ke KANAN -> rekening sebelumnya
    } else {
      applyRekeningStackTransform_(true); // swipe terlalu pendek -> kartu balik ke posisi semula
    }

    rekeningSwipeDragging = false;
    rekeningTouchStartX = null;
    rekeningTouchStartY = null;
  }

  function handleEditRekeningSubmit(event) {
    event.preventDefault();
    const btn = document.getElementById('btnSimpanEditRekening');
    const formData = {
      id: document.getElementById('editRekeningId').value,
      nama: document.getElementById('editRekeningNama').value.trim(),
      saldo: Number(document.getElementById('editRekeningSaldo').value) || 0,
      tipe: document.getElementById('editRekeningTipe').value.trim()
    };
    if (!formData.nama) { showToast('error', 'Nama rekening wajib diisi.'); return; }
    if (formData.saldo < 0) { showToast('error', 'Saldo tidak boleh minus.'); return; }

    const snapshotDompet = cloneCache_(cachedDompet);
    const snapshotRiwayat = cloneCache_(cachedRiwayat);

    const idx = cachedDompet.rekening.findIndex(r => r.id === formData.id);
    if (idx > -1) {
      const saldoLama = cachedDompet.rekening[idx].saldo;
      const delta = formData.saldo - saldoLama;
      cachedDompet.rekening[idx].nama = formData.nama;
      cachedDompet.rekening[idx].saldo = formData.saldo;
      cachedDompet.rekening[idx].tipe = formData.tipe;
      cachedDompet.totalSaldo += delta;
    }

    closeEditRekeningModal();
    renderDompetUI(cachedDompet);
    showToast('success', 'Rekening berhasil diperbarui!');

    google.script.run
      .withSuccessHandler(res => {
        if (res && res.status === 'success') {
          cachedDompet = res.dompet;
          renderDompetUI(cachedDompet);
          populateSumberAkun(cachedDompet.rekening.map(r => r.nama));

          // FIX RELASI DATA (RENAME): kalau nama akun diganti, transaksi lama di 'in/out'
          // ikut di-cascade-update di server (Sumber diganti + ditandai di Keterangan,
          // lihat renameSumberTransaksi_ di controller.gs) -> sinkronkan cachedRiwayat &
          // Riwayat Transaksi (lewat renderRiwayatResult(), BUKAN manual set+render lagi,
          // supaya batch 50-item & pagination tetap konsisten) supaya penanda "akun diganti
          // nama" langsung kelihatan.
          if (res.riwayat) {
            renderRiwayatResult(res.riwayat);
          }
          if (res.jumlahTransaksiDiubah > 0) {
            showToast('success', `Nama akun diganti, ${res.jumlahTransaksiDiubah} transaksi terkait ikut diperbarui.`);
          }
        } else {
          cachedDompet = snapshotDompet;
          renderDompetUI(cachedDompet);
          showToast('error', 'Gagal disimpan ke server, perubahan dibatalkan: ' + (res ? res.message : 'Error'));
        }
      })
      .withFailureHandler(err => {
        cachedDompet = snapshotDompet;
        cachedRiwayat = snapshotRiwayat;
        renderDompetUI(cachedDompet);
        showToast('error', 'Koneksi error, perubahan dibatalkan: ' + (err.message || err));
      })
      .updateRekeningServer(formData, getRiwayatBatchPage_(), batchFetchLimit, getCurrentFilterParams());
  }

    const btnConfirm = document.getElementById('btnConfirmDeleteRekening');
    if (btnConfirm) { btnConfirm.innerText = 'Menghapus...'; btnConfirm.disabled = true; }

    const idToDelete = targetRekeningToDelete;
    const rekToDelete = cachedDompet.rekening.find(r => r.id === idToDelete);
    const snapshotDompet = cloneCache_(cachedDompet);
    const snapshotRiwayat = cloneCache_(cachedRiwayat);

    closeDeleteRekeningModal();

    // OPTIMISTIC: hapus rekening dari cache & render langsung
    cachedDompet.rekening = cachedDompet.rekening.filter(r => r.id !== idToDelete);
    if (rekToDelete) cachedDompet.totalSaldo -= Number(rekToDelete.saldo) || 0;

    renderDompetUI(cachedDompet);
    populateSumberAkun(cachedDompet.rekening ? cachedDompet.rekening.map(r => r.nama) : []);
    showToast('success', 'Rekening berhasil dihapus!');

    google.script.run
      .withSuccessHandler(res => {
        if (btnConfirm) { btnConfirm.innerText = 'Ya, Hapus'; btnConfirm.disabled = false; }
        if (!res || res.status !== 'success') {
            cachedDompet = snapshotDompet;
            renderDompetUI(cachedDompet);
            showToast('error', res ? res.message : 'Gagal menghapus.');
            return;
        }
        cachedDompet = res.dompet;

        // FIX RELASI DATA: transaksi 'in/out' milik akun ini ikut dihapus di server
        // (lihat hapusRekeningServer_ / hapusTransaksiBySumber_ di controller.gs) ->
        // sinkronkan cachedRiwayat & tampilan Riwayat Transaksi (lewat renderRiwayatResult(),
        // BUKAN manual set+render lagi, supaya batch 50-item & pagination tetap konsisten)
        // supaya tidak ada lagi transaksi "yatim" yang masih nongol padahal akunnya sudah

        if (res.riwayat) {

        cachedRiwayat = snapshotRiwayat;
        renderDompetUI(cachedDompet);
        showToast('error', 'Terputus, data dikembalikan: ' + (err.message || err));
      })
      .hapusRekeningServer(idToDelete, getRiwayatBatchPage_(), batchFetchLimit, getCurrentFilterParams());
  }

function handleReceiptImageUpload(event) {
  const file = event.target.files && event.target.files[0];
  if (!file) return;
  if (!file.type.startsWith('image/')) {
    showToast('error', 'Hanya file gambar yang didukung.');
    return;
  }
  if (file.size > 5000000) {
    showToast('error', 'Ukuran maksimal 5 MB.');
    return;
  }

  // Notifikasi loading: tampil SEGERA (mulai dari file dibaca) & tetap ada selama proses
  // OCR di server berjalan, supaya pengguna tahu proses masih berlangsung. Tombol scan
  // dinonaktifkan sementara supaya tidak trigger proses kedua sebelum yang pertama selesai.
  showToast('loading', 'Memindai struk, mohon tunggu...');
  setScanButtonsDisabled_(true);

  const reader = new FileReader();
  reader.onerror = function() {
    setScanButtonsDisabled_(false);
    showToast('error', 'Gagal membaca file gambar.');
  };
  reader.onload = function(e) {
    const base64 = e.target.result.split(',')[1];
    google.script.run
      .withSuccessHandler(res => {
        setScanButtonsDisabled_(false);
        if (res) {
          // LOG: buka Console browser (F12 > Console) untuk lihat persis apa yang
          // berhasil diekstrak dari gambar sebelum diisi ke form.
          console.log('[OCR] Field yang berhasil diekstrak & divalidasi server:', {
            tanggal: res.tanggal || '(tidak terdeteksi)',
            jenis: res.jenis || '(tidak terdeteksi)',
            kategori: res.kategori || '(tidak terdeteksi)',
            sumber: res.sumber || '(tidak terdeteksi)',
            keterangan: res.keterangan || '(tidak terdeteksi)',
            nominal: res.nominal || '(tidak terdeteksi)'
          });
          applyOCRData(res);
          showToast('success', 'Struk berhasil dipindai!');
        } else {
          console.warn('[OCR] Server tidak mengembalikan data apapun.');
          showToast('error', 'OCR gagal, tidak ada data terbaca dari struk.');
        }
      })
      .withFailureHandler(err => {
        setScanButtonsDisabled_(false);
        console.error('[OCR] Gagal memanggil processReceiptImage:', err);
        showToast('error', 'Gagal memindai struk: ' + (err.message || err));
        // Kalau errornya karena masalah API key → buka modal input key baru
        maybeShowAIKeyProblemModal_(err && err.message);
      })
      .processReceiptImage(base64, file.type);
  };
  reader.readAsDataURL(file);
}

  function applyOCRData(data) {
    if (!data) return;
    const isian = []; // LOG: catat field mana yang benar2 dituliskan ke form (vs dilewati krn field sudah terisi manual)

    if (data.tanggal) {
      const dateParts = data.tanggal.split('/');
      if (dateParts.length === 3) {
        const isoDate = `${dateParts[2]}-${dateParts[1]}-${dateParts[0]}`;
        // PERBAIKAN: sebelumnya hanya diisi kalau field masih kosong (!el.value). Karena
        // form biasanya sudah punya nilai default (tanggal hari ini dari resetTanggal()),
        // tanggal dari struk jadi TIDAK PERNAH masuk. Upload struk = niat user mengganti
        // tanggal form dengan tanggal di struk, jadi field ini SELALU ditimpa (bukan cuma
        // kalau kosong).
        ['tanggal', 'inputTanggal'].forEach(id => {
          const el = document.getElementById(id);
          if (el) { el.value = isoDate; isian.push(id + '=' + isoDate); }
        });
      }
    }
    // Jenis (Pemasukan/Pengeluaran): server selalu mengirim "Pengeluaran" untuk upload
    // struk. Sebelumnya field ini TIDAK PERNAH diisi otomatis meski sudah dikirim server.
    if (data.jenis) {
      const elJenis = document.getElementById('jenis');
      if (elJenis && !elJenis.value) { elJenis.value = data.jenis; isian.push('jenis=' + data.jenis); }
    }
    if (data.kategori) {
      const elKategori = document.getElementById('kategori');
      if (elKategori) {
        elKategori.value = data.kategori || 'Belanja';
        isian.push('kategori=' + elKategori.value);
      }
    }
    if (data.sumber) {
      const elSumber = document.getElementById('sumber');
      if (elSumber) {
        // Cari option yang value/text-nya cocok (case-insensitive)
        let foundOption = Array.from(elSumber.options).find(
          opt => opt.value.toLowerCase() === data.sumber.toLowerCase() || opt.text.toLowerCase() === data.sumber.toLowerCase()
        );
        if (foundOption) {
          elSumber.value = foundOption.value;
          isian.push('sumber=' + foundOption.value);
        } else {
          // Fallback: set value langsung jika ada option yang cocok
          elSumber.value = data.sumber;
          isian.push('sumber=' + data.sumber + ' (direct)');
        }
      }
    }
    if (data.keterangan) {
      document.getElementById('keterangan').value = data.keterangan;
      isian.push('keterangan=' + data.keterangan);
    }
    if (data.nominal) {
      document.getElementById('nominal').value = data.nominal;
      isian.push('nominal=' + data.nominal);
    }

    // LOG: field yang benar-benar terisi ke form setelah OCR (bisa beda dgn field yang
    // "terdeteksi" di log sebelumnya, misal krn user sudah isi manual duluan).
    console.log('[OCR] Field yang benar-benar diisi ke form:', isian.length ? isian : '(tidak ada, semua field sudah terisi manual atau kosong dari OCR)');
  }

function handleLongPressStart(event, id, cardEl) {
    touchStartX = event.touches[0].clientX;
    touchStartY = event.touches[0].clientY;

    // FIX: tap-hold (long press) 800ms di kartu Riwayat Transaksi (khusus mobile, dipicu
    // lewat ontouchstart) sekarang membuka "card-modal" berisi detail/deskripsi lengkap
    // transaksi yang dipilih (#modalDetailTransaksi) — bukan langsung ke mode edit lagi,
    // supaya tap-hold jadi aksi "lihat detail" yang aman/non-destruktif. Mode edit tetap
    // bisa dari tombol "Edit" di dalam card-modal itu, atau via double-tap seperti biasa.
    const timer = setTimeout(() => {

    }, 800);
    window._lpTimer = timer;
}

function handleLongPressMove(event) {
    if (!event.touches || event.touches.length === 0) return;
    const diffX = Math.abs(event.touches[0].clientX - touchStartX);
    const diffY = Math.abs(event.touches[0].clientY - touchStartY);
    if (diffX > 10 || diffY > 10) {
        clearTimeout(window._lpTimer);
    }
}

function handleLongPressEnd(event, cardEl) {

      sumber: document.getElementById('sumber')?.value,

      nominal: document.getElementById('nominal')?.value
    };

    // ===== SNAPSHOT (utk rollback kalau server gagal) =====
    const snapshotRiwayat = cloneCache_(cachedRiwayat);
    const snapshotDompet = cloneCache_(cachedDompet);

    const nominalNum = Number(formData.nominal) || 0;
    let sumberLama = null, jenisLama = null, nominalLama = null;

    if (cachedRiwayat && cachedRiwayat.data) {
      if (isEditMode) {
        const idx = cachedRiwayat.data.findIndex(it => it.id === editId);
        if (idx > -1) {
          const old = cachedRiwayat.data[idx];
          sumberLama = old.sumber; jenisLama = old.jenis; nominalLama = old.nominal;
          cachedRiwayat.data[idx] = { ...old, jenis: formData.jenis, kategori: formData.kategori, sumber: formData.sumber, keterangan: formData.keterangan, nominal: nominalNum };
        }
      } else {
        cachedRiwayat.data.unshift({ id: 'temp-' + Date.now(), jenis: formData.jenis, kategori: formData.kategori, sumber: formData.sumber, keterangan: formData.keterangan, nominal: nominalNum });
      }
    }

    // EDIT: batalkan efek transaksi lama dari akun asal, lalu terapkan efek baru ke akun tujuan
    if (isEditMode && sumberLama !== null) {
      applyDeltaCachedDompet_(sumberLama, -hitungDeltaTransaksiClient_(jenisLama, nominalLama)); // revert lama
      applyDeltaCachedDompet_(formData.sumber, hitungDeltaTransaksiClient_(formData.jenis, nominalNum)); // apply baru
    } else if (!isEditMode) {
      applyDeltaCachedDompet_(formData.sumber, hitungDeltaTransaksiClient_(formData.jenis, nominalNum));
    }

    switchTab('riwayat'); // INSTAN, form/modal langsung tertutup
    refreshVisibleUI_();
    // FIX: toast muncul DI SINI (saat cache sudah dimutasi), bukan menunggu server balas
    showToast('success', isEditMode ? 'Perubahan disimpan!' : 'Transaksi berhasil dicatat!');

    // ===== KIRIM KE SERVER DI BACKGROUND =====
    const serverFunc = isEditMode ? 'updateTransaksiServer' : 'simpanTransaksiServer';

    google.script.run
      .withSuccessHandler(res => {
        if (res && res.status === 'success') {
          cachedRiwayat = res.riwayat; // sinkronkan dgn ID/pagination asli dari server, TANPA toast lagi
          cachedDompet = res.dompet;
          refreshVisibleUI_();
        } else {
          cachedRiwayat = snapshotRiwayat; cachedDompet = snapshotDompet; // ROLLBACK
          refreshVisibleUI_();
          showToast('error', 'Gagal disimpan ke server, perubahan dibatalkan: ' + (res ? res.message : 'Error'));
        }
      })
      .withFailureHandler(err => {
        cachedRiwayat = snapshotRiwayat; cachedDompet = snapshotDompet; // ROLLBACK
        refreshVisibleUI_();
        showToast('error', 'Koneksi error, perubahan dibatalkan: ' + (err.message || err));
      })
      [serverFunc](formData, getRiwayatBatchPage_(), batchFetchLimit, getCurrentFilterParams());

  }

  // FIX "kartu Pemasukan ikut memerah saat disentuh": sebelumnya toggleDeleteBtn() SELALU
  // pakai warna hardcoded 'border-red-300 bg-red-50' apapun jenis transaksinya -> kartu
  // Pemasukan (harusnya bertema hijau, clay-key-primary) ikut kelihatan merah/danger saat
  // di-tap utk munculkan tombol hapus, padahal bukan transaksi Pengeluaran. Sekarang warna
  // tint & border-nya ikut JENIS kartu: hijau (emerald) utk Pemasukan (clay-key-primary),
  // merah tetap utk Pengeluaran (clay-key-danger) -> senada dgn efek tap hijau/merah di
  // .tx-card-item:active (ViewCSS.html). Tombol hapus (ikon trash) TETAP merah krn itu
  // memang aksi destruktif, bukan penanda jenis transaksi.
  // FIX: kartu Pindah Saldo sebelumnya ikut memerah saat di-tap (fallback ke cabang
  // "bukan Pemasukan" = merah) padahal temanya biru (clay-key-blue, sama seperti FAB/modal
  // Pindah Saldo). Sekarang dideteksi lewat atribut data-pindah-saldo (lihat renderRiwayatUI)
  // dan diberi tint biru sendiri, terpisah dari cabang hijau (Pemasukan) & merah (Pengeluaran).
  function toggleDeleteBtn(cardEl) {
    const isAlreadyActive = cardEl.classList.contains('tx-card-active');
    document.querySelectorAll('.tx-card-item').forEach(el => {
      el.classList.remove('tx-card-active', 'border-red-300', 'bg-red-50', 'border-emerald-300', 'bg-emerald-50', 'border-blue-300', 'bg-blue-50');
      el.querySelector('.delete-btn-action')?.classList.add('hidden');
    });
    if (!isAlreadyActive) {
      const isPindahSaldo = cardEl.getAttribute('data-pindah-saldo') === 'true';
      const isPemasukan = cardEl.classList.contains('clay-key-primary');
      const tintClasses = isPindahSaldo
        ? ['border-blue-300', 'bg-blue-50']
        : (isPemasukan ? ['border-emerald-300', 'bg-emerald-50'] : ['border-red-300', 'bg-red-50']);
      cardEl.classList.add('tx-card-active', ...tintClasses);
      cardEl.querySelector('.delete-btn-action')?.classList.remove('hidden');
    }
  }

  let targetRowToDeleteIsPindahSaldo = false; // true kalau yg mau dihapus adalah transaksi Pindah Saldo

  function openDeleteModal(id, event) {
    if (event) event.stopPropagation();
    targetRowToDelete = id;
    targetRowToDeleteIsPindahSaldo = false;
    document.getElementById('deleteModal')?.classList.remove('hidden');
  }

  // Dipakai khusus tombol hapus di kartu Pindah Saldo (lihat renderRiwayatUI) -> reuse
  // #deleteModal yang sama, tapi confirmDelete() nanti akan routing ke server function
  // yang benar (hapusPindahSaldoServer, bukan hapusTransaksiServer biasa).
  function openDeletePindahSaldoModal(id, event) {
    if (event) event.stopPropagation();
    targetRowToDelete = id;
    targetRowToDeleteIsPindahSaldo = true;
    document.getElementById('deleteModal')?.classList.remove('hidden');
  }

  function closeDeleteModal() { 
    targetRowToDelete = null; 
    targetRowToDeleteIsPindahSaldo = false;
    document.getElementById('deleteModal')?.classList.add('hidden'); 
  }

  function confirmDelete() {
    if (!targetRowToDelete) return;
    if (targetRowToDeleteIsPindahSaldo) {
      confirmDeletePindahSaldo_();
      return;
    }
    const idToDelete = targetRowToDelete;
    closeDeleteModal(); // INSTAN

    // ===== SNAPSHOT (utk rollback) =====
   const snapshotRiwayat = cloneCache_(cachedRiwayat);
    const snapshotDompet = cloneCache_(cachedDompet);

    let sumberLama = null, jenisLama = null, nominalLama = null;
    if (cachedRiwayat && cachedRiwayat.data) {
      const idx = cachedRiwayat.data.findIndex(it => it.id === idToDelete);
      if (idx > -1) {
        const old = cachedRiwayat.data[idx];
        sumberLama = old.sumber; jenisLama = old.jenis; nominalLama = old.nominal;
        cachedRiwayat.data.splice(idx, 1);
      }
    }
    // Balikkan efek transaksi yg dihapus: Pemasukan -> saldo dikurangi, Pengeluaran -> saldo ditambah
    if (sumberLama !== null) applyDeltaCachedDompet_(sumberLama, -hitungDeltaTransaksiClient_(jenisLama, nominalLama));

    refreshVisibleUI_(); // ZERO-LATENCY
    // FIX: toast final "berhasil dihapus" langsung di sini (cache sudah terhapus), bukan nunggu server
    showToast('success', 'Transaksi berhasil dihapus!');

    // ===== KIRIM KE SERVER DI BACKGROUND =====
    google.script.run
      .withSuccessHandler(res => {
        if (res && res.status === 'success') {
          cachedRiwayat = res.riwayat; cachedDompet = res.dompet; // sinkron senyap, TANPA toast lagi
          refreshVisibleUI_();
        } else {
          cachedRiwayat = snapshotRiwayat; cachedDompet = snapshotDompet; // ROLLBACK
          refreshVisibleUI_();
          showToast('error', 'Gagal dihapus di server, data dikembalikan: ' + (res ? res.message : 'Error'));
        }
      })
      .withFailureHandler(err => {
        cachedRiwayat = snapshotRiwayat; cachedDompet = snapshotDompet; // ROLLBACK
        refreshVisibleUI_();
        showToast('error', 'Terputus, data dikembalikan: ' + (err.message || err));
      })
      .hapusTransaksiServer(idToDelete, getRiwayatBatchPage_(), batchFetchLimit, getCurrentFilterParams());
  }

  // Hapus transaksi Pindah Saldo: server yang membalikkan delta saldo di KEDUA akun
  // (sumber & tujuan) sekaligus -> di sini optimistic update cukup hapus dari cache riwayat
  // saja, saldo Dompet menunggu payload asli dari server (lebih aman drpd menebak arah
  // delta di client, krn format "A -> B" perlu di-parse ulang).
  function confirmDeletePindahSaldo_() {
    const idToDelete = targetRowToDelete;
    closeDeleteModal();

    const snapshotRiwayat = cloneCache_(cachedRiwayat);
    const snapshotDompet = cloneCache_(cachedDompet);

    if (cachedRiwayat && cachedRiwayat.data) {
      const idx = cachedRiwayat.data.findIndex(it => it.id === idToDelete);
      if (idx > -1) cachedRiwayat.data.splice(idx, 1);
    }
    refreshVisibleUI_();
    showToast('success', 'Transaksi Pindah Saldo berhasil dihapus!');

    google.script.run
      .withSuccessHandler(res => {
        if (res && res.status === 'success') {
          if (res.riwayat) cachedRiwayat = res.riwayat;
          if (res.dompet) { cachedDompet = res.dompet; renderDompetUI(cachedDompet); }
          refreshVisibleUI_();
        } else {
          cachedRiwayat = snapshotRiwayat; cachedDompet = snapshotDompet;
          refreshVisibleUI_();
          showToast('error', 'Gagal dihapus di server, data dikembalikan: ' + (res ? res.message : 'Error'));
        }
      })
      .withFailureHandler(err => {
        cachedRiwayat = snapshotRiwayat; cachedDompet = snapshotDompet;
        refreshVisibleUI_();
        showToast('error', 'Terputus, data dikembalikan: ' + (err.message || err));
      })
      .hapusPindahSaldoServer(idToDelete, getRiwayatBatchPage_(), batchFetchLimit, getCurrentFilterParams());
  }
  

  // ==========================================
  // HELPER: DETEKSI MASALAH API KEY AI
  // ==========================================
  // Dipanggil dari failure handler panggilan AI (OCR, rekomendasi). Kalau pesan error
  // mengindikasikan masalah API key (belum dikonfigurasi / semua key gagal / 401-403-429
  // / rate limit / kuota habis), buka modal "API Key Bermasalah" supaya user bisa input
  // key baru langsung. Mengembalikan true kalau masalah key terdeteksi (modal dibuka).
  function maybeShowAIKeyProblemModal_(errMsg) {
    const t = String(errMsg || '').toLowerCase();
    const hit =
      t.indexOf('gemini_api_key') !== -1 ||           // key belum dikonfigurasi
      t.indexOf('openrouter_api_key') !== -1 ||
      t.indexOf('tidak dikonfigurasi') !== -1 ||
      t.indexOf('semua api key') !== -1 ||            // semua key user gagal
      t.indexOf('semua model') !== -1 ||
      t.indexOf('semua key') !== -1 ||
      (t.indexOf('key#') !== -1 && (t.indexOf('rate limit') !== -1 || t.indexOf('kuota') !== -1 || t.indexOf('status 4') !== -1)) ||
      t.indexOf('resource_exhausted') !== -1 ||
      t.indexOf('quota') !== -1;
    if (hit && typeof showAIKeyProblemModal === 'function') {
      showAIKeyProblemModal();
    }
    return hit;
  }

  // type: 'success' | 'error' | 'loading'. Toast loading TIDAK auto-hide (dipanggil terus
  // sampai proses selesai, lalu di-timpa/ditutup manual oleh showToast('success'/'error', ...)
  // atau hideToast()) -> supaya pengguna tahu proses masih berjalan, bukan macet diam-diam.
  function showToast(type, text) {
    const toast = document.getElementById('toast');
    if (!toast) return;
    clearTimeout(toastTimeout);

    const iconMap = { success: 'check_circle', error: 'error', loading: 'progress_activity' };
    const bgClass = type === 'success' ? 'success' : (type === 'error' ? 'error' : 'loading');
    const iconClass = type === 'loading' ? 'material-symbols-outlined text-[18px] shrink-0 spin' : 'material-symbols-outlined text-[18px] shrink-0';

    toast.className = `toast show ${bgClass} flex items-center gap-2`;
    toast.innerHTML = `<span class="${iconClass}">${iconMap[type] || 'info'}</span><span class="truncate">${text}</span>`;
    toast.style.display = 'flex';

    if (type !== 'loading') {
      toastTimeout = setTimeout(() => { toast.style.display = 'none'; }, 2000);
    }
  }

  function hideToast() {
    const toast = document.getElementById('toast');
    if (!toast) return;
    clearTimeout(toastTimeout);
    toast.style.display = 'none';
  }

  function refreshVisibleUI_() {
       renderRiwayatResult(cachedRiwayat);
       if (document.getElementById('viewBudget')?.classList.contains('active')) renderDompetUI(cachedDompet);
   }

  function cloneCache_(obj) {
    return obj ? JSON.parse(JSON.stringify(obj)) : obj;
  }

  function hitungDeltaTransaksiClient_(jenis, nominal) {
    const n = Number(nominal) || 0;
    return String(jenis).trim().toLowerCase() === 'pengeluaran' ? -n : n;
  }

  function applyDeltaCachedDompet_(namaAkun, delta) {
    if (!cachedDompet || !cachedDompet.rekening || !namaAkun || !delta) return;
    const rek = cachedDompet.rekening.find(r => r.nama === namaAkun);
    if (rek) {
      rek.saldo += delta;
      cachedDompet.totalSaldo = (cachedDompet.totalSaldo || 0) + delta;
    }
  }

  // ==========================================
  // BUDGET UI (limit pengeluaran per kategori per periode)
  // Kontrak backend (budget.gs): getBudgetServer(bulan, tahun) -> { list: [{ id, kategoriID,
  // kategori, bulan, tahun, limitNominal, terpakai, sisa, persentase, melebihiLimit }] }.
  // ==========================================

  // Kategori yang boleh dipilih utk budget = HANYA jenis Pengeluaran. Ambil dari
  // kategoriJenisSumberMap (bucket Pengeluaran._all) atau fallback cachedKategori.
  function getKategoriPengeluaran_() {
    const map = kategoriJenisSumberMap;
    if (map && map.Pengeluaran && Array.isArray(map.Pengeluaran._all) && map.Pengeluaran._all.length) {
      return map.Pengeluaran._all.slice();
    }
    return (cachedKategori || []).slice();
  }

  function populateBudgetTahunSelect_() {
    const sel = document.getElementById('budgetTahun');
    if (!sel) return;
    const now = new Date().getFullYear();
    const current = sel.value;
    sel.innerHTML = '';
    for (let i = now + 1; i >= now - 4; i--) {
      const opt = document.createElement('option');
      opt.value = i; opt.textContent = i;
      sel.appendChild(opt);
    }
    if (current) sel.value = current;
  }

  // Pindah sub-tab Budget: 'rekening' (card-stack akun) | 'budget' (limit per kategori).
  function switchBudgetSubTab(tab) {
    budgetSubTab = tab;
    const panelRek = document.getElementById('budgetRekeningPanel');
    const panelLimit = document.getElementById('budgetLimitPanel');
    const btnRek = document.getElementById('budgetSubTabBtnRekening');
    const btnBgt = document.getElementById('budgetSubTabBtnBudget');

    const isBudget = tab === 'budget';
    if (panelRek) panelRek.classList.toggle('hidden', isBudget);
    if (panelLimit) panelLimit.classList.toggle('hidden', !isBudget);

    // Efek tombol aktif: BUTTON terlihat "ditekan" via inset box-shadow (konsep bayangan
    // tombol tertekan, pola clay :active) + teks biru + ikon terisi FILL 1. Tombol nonaktif
    // kembali polos (tembus warna track bg-slate-100, teks abu, ikon outline). BUKAN pill/
    // wrap terpisah di belakang ikon — efeknya murni di tombol itu sendiri.
    function setSubTabButton(btn, isActive) {
      if (!btn) return;
      const icon = btn.querySelector('.material-symbols-outlined');
      if (icon) icon.style.fontVariationSettings = isActive ? "'FILL' 1" : "'FILL' 0";
      btn.classList.toggle('text-blue-700', isActive);
      btn.classList.toggle('text-slate-500', !isActive);
      if (isActive) {
        btn.style.background = '#fff';
        btn.style.boxShadow = 'inset 3px 3px 7px rgba(0,0,0,.18), inset -3px -3px 7px rgba(255,255,255,.9)';
      } else {
        btn.style.background = '';
        btn.style.boxShadow = '';
      }
    }

    setSubTabButton(btnRek, !isBudget);
    setSubTabButton(btnBgt, isBudget);

    updateFabAddButton('budget'); // FAB menyesuaikan sub-tab aktif

    if (isBudget) {
      loadBudget();
    } else {
      // Kembali ke rekening -> layout stack dihitung ulang (tinggi viewport berubah).
      setTimeout(fitRekeningListViewport_, 0);

  function navigateBudgetPeriode(dir) {
    budgetBulan += dir;
    if (budgetBulan < 0) { budgetBulan = 11; budgetTahun--; }
    else if (budgetBulan > 11) { budgetBulan = 0; budgetTahun++; }
    cachedBudget = null;
    loadBudget();

  function loadBudget() {
    const label = document.getElementById('budgetPeriodeLabel');
    if (label) label.textContent = NAMA_BULAN_ID[budgetBulan] + ' ' + budgetTahun;
    if (cachedBudget) {
      try { renderBudgetUI(cachedBudget); } catch (e) { showToast('error', 'Gagal menampilkan budget: ' + e.message); }
      return;
    }
    const listEl = document.getElementById('budgetLimitList');
    if (listEl) {
      listEl.innerHTML = '<div class="flex flex-col items-center justify-center gap-3 py-10 text-slate-400 text-sm">' +
        '<div class="riwayat-dot-spinner" aria-hidden="true"><div class="riwayat-dot-spinner__dot"></div><div class="riwayat-dot-spinner__dot"></div><div class="riwayat-dot-spinner__dot"></div><div class="riwayat-dot-spinner__dot"></div><div class="riwayat-dot-spinner__dot"></div><div class="riwayat-dot-spinner__dot"></div><div class="riwayat-dot-spinner__dot"></div><div class="riwayat-dot-spinner__dot"></div></div>' +
        '<span>Memuat budget...</span></div>';
    }
    google.script.run
      .withSuccessHandler(res => {
        if (!res) { showToast('error', 'Gagal memuat budget (payload kosong).'); return; }
        if (res.status !== 'success') { showToast('error', res.message || 'Gagal memuat budget.'); return; }
        cachedBudget = res;
        try { renderBudgetUI(res); } catch (e) { showToast('error', 'Gagal menampilkan budget: ' + e.message); }
      })
      .withFailureHandler(err => {
        showToast('error', 'Gagal memuat budget: ' + (err && err.message ? err.message : err));
      })
      .getBudgetServer(budgetBulan, budgetTahun);
  }

  function renderBudgetUI(res) {
    const list = (res && res.list) || [];
    const listEl = document.getElementById('budgetLimitList');
    const totalLimitEl = document.getElementById('budgetTotalLimit');
    const totalTerpakaiEl = document.getElementById('budgetTotalTerpakai');
    const totalSisaEl = document.getElementById('budgetTotalSisa');

    let totalLimit = 0, totalTerpakai = 0;
    list.forEach(b => {
      totalLimit += Number(b.limitNominal) || 0;
      totalTerpakai += Number(b.terpakai) || 0;
    });
    if (totalLimitEl) totalLimitEl.textContent = formatRupiah(totalLimit);
    if (totalTerpakaiEl) totalTerpakaiEl.textContent = 'Terpakai: ' + formatRupiah(totalTerpakai);
    if (totalSisaEl) totalSisaEl.textContent = 'Sisa: ' + formatRupiah(Math.max(0, totalLimit - totalTerpakai));

    if (!listEl) return;
    if (!list.length) {
      listEl.innerHTML =
        '<div class="flex flex-col items-center justify-center gap-2 py-10 text-center px-4">' +
        '<span class="material-symbols-outlined text-[36px] text-slate-300">savings</span>' +
        '<p class="text-sm font-semibold text-slate-500">Belum ada budget untuk periode ini</p>' +
        '<p class="text-xs text-slate-400">Atur limit pengeluaran per kategori lewat tombol +</p>' +
        '<button onclick="openTambahBudgetModal()" class="mt-2 clay-btn clay-key-blue bg-blue-700 text-white text-xs font-semibold hover:bg-blue-800 transition-colors flex items-center gap-1.5 px-4 py-2.5">' +
        '<span class="material-symbols-outlined text-[16px]">add</span>Tambah Budget</button>' +
        '</div>';
      return;
    }

    listEl.innerHTML = list.map(b => renderBudgetCard_(b)).join('');
  }

  function renderBudgetCard_(b) {
    const limit = Number(b.limitNominal) || 0;
    const terpakai = Number(b.terpakai) || 0;
    const sisa = Math.max(0, limit - terpakai);
    const pct = limit > 0 ? Math.min(100, Math.round((terpakai / limit) * 100)) : 0;
    const over = b.melebihiLimit || terpakai > limit;

    // Warna progress bar: hijau (<75%), amber (75-99%), merah (>=100%).
    const barColor = over ? 'bg-red-500' : (pct >= 75 ? 'bg-amber-500' : 'bg-blue-600');
    const statusBadge = over
      ? '<span class="inline-flex items-center gap-1 text-[10px] font-bold text-white bg-red-500 px-2 py-0.5 rounded-full">' +
        '<span class="material-symbols-outlined text-[12px]">warning</span>MELEBIHI</span>'
      : '<span class="text-[10px] font-bold text-blue-700 bg-blue-50 px-2 py-0.5 rounded-full">SISA ' + formatRupiah(sisa) + '</span>';

    return '' +
      '<div class="clay clay-card clay-key-blue bg-white p-4">' +
        '<div class="flex items-center justify-between gap-2 mb-3">' +
          '<div class="flex items-center gap-2.5 min-w-0">' +
            '<div class="clay-icon-tile clay-key-blue w-9 h-9 rounded-xl bg-blue-100 flex items-center justify-center shrink-0">' +
              '<span class="material-symbols-outlined text-blue-700 text-[18px]">category</span>' +
            '</div>' +
            '<div class="min-w-0">' +
              '<p class="font-bold text-sm text-slate-800 truncate">' + escHtml_(b.kategori) + '</p>' +
              '<p class="text-[11px] text-slate-400">Limit ' + formatRupiah(limit) + '</p>' +
            '</div>' +
          '</div>' +
          '<div class="shrink-0">' + statusBadge + '</div>' +
        '</div>' +
        '<div class="flex items-center gap-3 mb-1.5">' +
          '<div class="flex-1 h-2 bg-slate-100 rounded-full overflow-hidden">' +
            '<div class="h-full rounded-full ' + barColor + ' transition-all" style="width:' + pct + '%"></div>' +
          '</div>' +
          '<span class="text-xs font-bold text-slate-700 tabular-nums w-11 text-right">' + pct + '%</span>' +
        '</div>' +
        '<div class="flex items-center justify-between text-[11px]">' +
          '<span class="text-slate-500">Terpakai <b class="text-slate-700 font-mono">' + formatRupiah(terpakai) + '</b></span>' +
          '<div class="flex items-center gap-1">' +
            '<button onclick="openEditBudgetModal(\'' + b.id + '\')" class="clay-chip clay-key-neutral w-7 h-7 rounded-full flex items-center justify-center text-slate-400 hover:bg-slate-100 hover:text-slate-600 transition-colors" aria-label="Edit budget">' +
              '<span class="material-symbols-outlined text-[15px]">edit</span>' +
            '</button>' +
            '<button onclick="openHapusBudgetModal(\'' + b.id + '\')" class="clay-chip clay-key-neutral w-7 h-7 rounded-full flex items-center justify-center text-slate-400 hover:bg-red-50 hover:text-red-500 transition-colors" aria-label="Hapus budget">' +
              '<span class="material-symbols-outlined text-[15px]">delete</span>' +
            '</button>' +
          '</div>' +
        '</div>' +
      '</div>';
  }

  // ===== TAMBAH / EDIT BUDGET =====
  function openTambahBudgetModal() {
    budgetEditId = null;
    document.getElementById('budgetId').value = '';
    document.getElementById('budgetKategori').value = '';
    document.getElementById('budgetBulan').value = budgetBulan;
    document.getElementById('budgetTahun').value = budgetTahun;
    document.getElementById('budgetLimitNominal').value = '';
    const title = document.getElementById('budgetModalTitleText');
    if (title) title.textContent = 'Tambah Budget';
    const btn = document.getElementById('btnSimpanBudget');
    if (btn) btn.querySelector('span:last-child') && (btn.lastChild.textContent = ' Simpan');
    document.getElementById('modalBudget')?.classList.remove('hidden');
    document.getElementById('budgetKategori')?.focus();
  }

  function openEditBudgetModal(id) {
    const item = (cachedBudget && cachedBudget.list || []).find(b => b.id === id);
    if (!item) { showToast('error', 'Budget tidak ditemukan.'); return; }
    budgetEditId = id;
    document.getElementById('budgetId').value = id;
    document.getElementById('budgetKategori').value = item.kategori;
    document.getElementById('budgetBulan').value = item.bulan;
    document.getElementById('budgetTahun').value = item.tahun;
    document.getElementById('budgetLimitNominal').value = item.limitNominal;
    const title = document.getElementById('budgetModalTitleText');
    if (title) title.textContent = 'Edit Budget';
    const btn = document.getElementById('btnSimpanBudget');
    if (btn) btn.lastChild && (btn.lastChild.textContent = ' Simpan');
    document.getElementById('modalBudget')?.classList.remove('hidden');
  }

  function closeBudgetModal() {
    document.getElementById('modalBudget')?.classList.add('hidden');
    budgetEditId = null;
  }

  function handleBudgetSubmit(event) {
    event.preventDefault();
    const kategori = document.getElementById('budgetKategori').value.trim();
    const bulan = Number(document.getElementById('budgetBulan').value);
    const tahun = Number(document.getElementById('budgetTahun').value);
    const limitNominal = Number(document.getElementById('budgetLimitNominal').value) || 0;
    const btn = document.getElementById('btnSimpanBudget');

    if (!kategori) { showToast('error', 'Kategori wajib dipilih.'); return; }
    if (isNaN(bulan) || bulan < 0 || bulan > 11) { showToast('error', 'Bulan tidak valid.'); return; }
    if (!tahun) { showToast('error', 'Tahun tidak valid.'); return; }
    if (limitNominal <= 0) { showToast('error', 'Limit budget harus lebih dari 0.'); return; }

    if (btn) { btn.disabled = true; btn.textContent = 'Menyimpan...'; }
    closeBudgetModal();

    const formData = budgetEditId
      ? { id: budgetEditId, kategori: kategori, bulan: bulan, tahun: tahun, limitNominal: limitNominal }
      : { kategori: kategori, bulan: bulan, tahun: tahun, limitNominal: limitNominal };

    // Update tampilan budget periode aktif kalau periode form = periode yg sedang tampil.
    const periodeSama = (bulan === budgetBulan && tahun === budgetTahun);

    const runner = google.script.run
      .withSuccessHandler(res => {
        if (btn) { btn.disabled = false; btn.textContent = 'Simpan'; }
        if (!res || res.status !== 'success') { showToast('error', (res && res.message) || 'Gagal menyimpan budget.'); return; }
        showToast('success', budgetEditId ? 'Budget berhasil diperbarui!' : 'Budget berhasil ditambahkan!');
        if (periodeSama) {
          cachedBudget = res.budget;
          renderBudgetUI(res.budget);
        } else {
          cachedBudget = null;
          budgetBulan = bulan; budgetTahun = tahun;
          loadBudget();
        }
      })
      .withFailureHandler(err => {
        if (btn) { btn.disabled = false; btn.textContent = 'Simpan'; }
        showToast('error', 'Koneksi error: ' + (err.message || err));
      });

    if (budgetEditId) {
      runner.updateBudgetServer(formData);
    } else {
      runner.simpanBudgetServer(formData);
    }
  }

  // ===== HAPUS BUDGET =====
  function openHapusBudgetModal(id) {
    targetBudgetToDelete = id;
    document.getElementById('modalHapusBudget')?.classList.remove('hidden');
  }

  function closeHapusBudgetModal() {
    targetBudgetToDelete = null;
    document.getElementById('modalHapusBudget')?.classList.add('hidden');
  }

  function confirmHapusBudget() {
    if (!targetBudgetToDelete) return;
    const idToDelete = targetBudgetToDelete;
    const btnConfirm = document.getElementById('btnConfirmHapusBudget');
    if (btnConfirm) { btnConfirm.innerText = 'Menghapus...'; btnConfirm.disabled = true; }

    closeHapusBudgetModal();

    // Optimistic: hapus dari cache & render langsung.
    if (cachedBudget) {
      cachedBudget.list = cachedBudget.list.filter(b => b.id !== idToDelete);
      renderBudgetUI(cachedBudget);
    }

    google.script.run
      .withSuccessHandler(res => {
        if (btnConfirm) { btnConfirm.innerText = 'Ya, Hapus'; btnConfirm.disabled = false; }
        if (!res || res.status !== 'success') {
          cachedBudget = null;
          loadBudget();
          showToast('error', (res && res.message) || 'Gagal menghapus budget.');
          return;
        }
        showToast('success', 'Budget berhasil dihapus!');
      })
      .withFailureHandler(err => {
        if (btnConfirm) { btnConfirm.innerText = 'Ya, Hapus'; btnConfirm.disabled = false; }
        cachedBudget = null;
        loadBudget();
        showToast('error', 'Terputus: ' + (err.message || err));
      })
      .hapusBudgetServer(idToDelete);
  }

  function openExportModal() {
    const now = new Date();
    const selBulan = document.getElementById('exportBulan');
    const selTahun = document.getElementById('exportTahun');
    
    if (selBulan) selBulan.value = now.getMonth();
    if (selTahun) {
      selTahun.innerHTML = '';
      for (let i = 0; i <= 3; i++) {
        const y = now.getFullYear() - i;
        const opt = document.createElement('option');
        opt.value = y; opt.textContent = y;
        selTahun.appendChild(opt);
      }
    }
    const info = document.getElementById('exportInfoText');
    if (info) info.textContent = '';
    
    document.getElementById('exportModal')?.classList.remove('hidden');
  }

  function closeExportModal() { document.getElementById('exportModal')?.classList.add('hidden'); }

  function prosesExportPDF() {
    const bulan = parseInt(document.getElementById('exportBulan')?.value);
    const tahun = parseInt(document.getElementById('exportTahun')?.value);
    const btn = document.getElementById('btnProsesExport');
    const info = document.getElementById('exportInfoText');

    if (btn) btn.disabled = true;
    if (info) info.textContent = 'Sedang membuat laporan PDF, mohon tunggu...';

    if(google.script && google.script.run && google.script.run.generateLaporanPDFServer) {
        google.script.run
          .withSuccessHandler(res => {
            if (btn) btn.disabled = false;
            if (res && res.status === 'success') {
              downloadBase64File(res.base64, res.fileName, 'application/pdf');
              if (info) info.textContent = '';
              closeExportModal();
              showToast('success', 'Laporan PDF berhasil dibuat!');
            } else {
              if (info) info.textContent = '';
              showToast('error', 'Gagal membuat PDF: ' + (res ? res.message : 'Error server'));
            }
          })
          .withFailureHandler(err => {
            if (btn) btn.disabled = false;
            if (info) info.textContent = '';
            showToast('error', 'Koneksi error: ' + (err.message || err));
          })
          .generateLaporanPDFServer(bulan, tahun);
    } else {
        if (btn) btn.disabled = false;
        if (info) info.textContent = '';
        showToast('error', 'Fungsi Export PDF belum tersedia di Backend.');
    }
  }

  function downloadBase64File(base64, fileName, mimeType) {
    const byteChars = atob(base64);
    const byteNumbers = new Array(byteChars.length);
    for (let i = 0; i < byteChars.length; i++) byteNumbers[i] = byteChars.charCodeAt(i);
    const byteArray = new Uint8Array(byteNumbers);
    const blob = new Blob([byteArray], { type: mimeType });
    const url = URL.createObjectURL(blob);
    const a = document.getElementById('downloadLink') || document.createElement('a');
    a.href = url; a.download = fileName;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);
  }
</script>
